ion to suit the 4.0 technological era, with the focus being placed on sustainable development, digital conversion, and human resources (Vo, 2022).", "On the bright side, the two parties are both looking forward to the advancement of the bilateral cooperation. On May 9, 2024, the delegation of the EU paid Vietnam a visit, and during this meeting, the two parties both recognizes the value of their collaboration. Vietnam hopes that in the near future, the EVFTA will be further implemented as well as the ratification of the EU – Vietnam Investment Protection Agreement (EVIPA) - an agreement that aims to overcome the challenges left by the EVFTA and thus ensure economic collaboration between the two parties - will be successful. Moreover, in the same year, the EU has also voiced their interest in upgrading the Vietnam-EU ties further, offering praises to the Vietnamese government as well as potential assistance in areas such as maritime protection and internet security.", "In conclusion, it seems like the Vietnam-EU relationship will continue to grow in the future as both parties are each other’s important economic partners and supporters in the world stage. It is predicted that in the next decades, Vietnam and the EU will continue to foster a strong relationship, including a possible upgrade in diplomatic title, progress in the ratification and implementation of the current agreements, and the addition of programs and assistance for a wide variety of areas. The partnership between Vietnam and the EU is indeed a promising and mutually beneficial one, thus, advancement is imminent for the two parties. Perhaps an even more culturally integrated future is ahead of them.", "Citations:", "EU wishes to upgrade relations with Việt Nam on back of strong trade ties: Senior foreign policy official. Vietnam News. (2024, July 31). https://vietnamnews.vn/politics-laws/1660319/eu-wishes-to-upgrade-relations-with-viet-nam-on-back-of-strong-trade-ties-senior-foreign-policy-official.html", "EU-Vietnam Trade Agreement and Investment Protection Agreement. European Commission. (2019). https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/countries-and-regions/vietnam/eu-vietnam-agreement en", "Press and information team of the EEAS. (2023, July 6). The European Union and Vietnam. EEAS. https://www.eeas.europa.eu/vietnam/the-eu-and-vietnam en?s=184#:~:text=The%20PCA%2C%20which%20entered%20into,against%20corruption%20and%20organized%20crime.", "Tran, H. T. T. (2023). Enhancing Vietnam-EU trade relations through participation in the Vietnam-EU free trade agreement. Viện Nghiên cứu Chiến lược, Chính sách Công Thương. https://vioit.org.vn/en/strategy-policy/enhancing-vietnam-eu-trade-relations-through-participation-in-the-vietnam-eu-free-trade-agreement-5991.4144.html#:~:text=Trade%20relations%20between%20Vietnam%20and%20EU%20member%20countries%20have%20existed,providing%20assistance%20for%20this%20purpose.", "Vietnam+ (VietnamPlus). (2024, May 10). Vietnam, EU eye to further deepen bilateral relations. https://en.vietnamplus.vn/vietnam-eu-eye-to-further-deepen-bilateral-relations-post285792.vnp", "Vu, Q. A. (n.d.). QUAN HỆ VIỆT NAM - LIÊN MINH CHÂU ÂU 30 NĂM: THỰC TRẠNG, CƠ HỘI, THÁCH THỨC VÀ TRIỂN VỌNG. Vietnam Ministry of Foreign Affairs. https://vnembassy-bruxelles.mofa.gov.vn/vi-vn/News/EmbassyNews/Trang/Ch%E1%BA%B7ng-%C4%91%C6%B0%E1%BB%9Dng-quan-h%E1%BB%87-Vi%E1%BB%87t-Nam---Li%C3%AAn-minh-ch%C3%A2u-%C3%82u-30-n%C4%83m-qua.aspx"]}, {"slug": "vietnam-s-culture-and-its-effects-in-advancing-vietnam-s-cau", "title": "Vietnam’s Culture and Its Effects in Advancing Vietnam’s Cause for Independence", "author": "HƯƠNG GIANG", "type": "Journal", "source": "HU#U031bO#U031bNG GIANG/Vietnam#U2019s Culture and Its Effects in Advancing Vietnam#U2019s Cause for Independence.docx", "paragraphs": ["Vietnam’s Culture and Its Effects in Advancing Vietnam’s Cause for Independence", "Vietnam, through its 5000 years of governmental construction and war for independence (Vietnamese National Police Force, 2019), has acquired an extremely intricate and unique culture. The identity of the Vietnamese, though being subjected to the challenges of multiple eras of colonization and occupation, was and still is maintained, staying true to Ho Chi Minh’s teachings of integration and adoption of good qualities but not assimilation (translation of the terms “hòa nhập nhưng không hòa tan”). Moreover, not only are these cultural traits sustained, but they also play pivotal roles in aiding the Vietnamese cause for independence and advancement on the world stage.", "The Vietnamese language is the first example of such use of culture in Vietnam’s cause for independence. It is important to note that Vietnam has 2 alphabet systems in history. The first one, called “Nôm,” is a Chinese alphabet-inspired language invented in the Vietnamese Confucianism era, with its first purpose being to demonstrate Vietnamese-specific vocabulary in written forms. The language was allowed to take shape for a while, however, during the invasion of Vietnam by the Ming dynasty, almost all documentations of such language were burned, halting the development of the language. However, after gaining independence, the Nôm language was no longer suppressed, allowing more teaching and usage of it. Gradually, many poems and writings were published in the Nôm language, establishing a rich literature culture in the country. Despite such development, the Nôm language was unfortunately wiped out during the French colonial era, replaced by the “national alphabet system” (“chữ quốc ngữ”) which followed the Latin style of writing. This change, in no way, demonstrated Vietnam’s loss in the cultural battle against the French; in fact, quite the opposite is true. Despite the language being the result of the French’s efforts to erase the Vietnamese Confucianism route, the new Romanized alphabet turned out to be much simpler to write and thus, much easier to be taught and spread. Though the credit for such widespread understanding of the language remains debated, it is undeniable that the first few newspapers written in the language played great roles in it despite their Western-leaning content. The educated population of Vietnam at the time, after enduring the harsh conditions of the French government, was fueled with a motive to resist and fight for independence, and with the popularization of the language, a more risky but effective move was prompted - the establishment of a revolutionary newspaper. In fact, like many other revolutions, the Vietnamese revolution started with simply that, revolutionary newspapers written in French and Vietnamese led by Ho Chi Minh, who later became the leader of the Vietnamese uprising against the French colonial government and further after, the Vietnamese Communist Party leader. It is famously said by Ho Chi Minh himself that the pen is a powerful weapon, and he was not wrong. The sustenance of the Vietnamese language had served good for the revolutionary cause, keeping Vietnamese citizens away from the risk of assimilation by Western forces, and later, fueling a successful revolution. With that, the Vietnamese Declaration of Independence was written and read in the national language by Ho Chi Minh in 1945, marking Vietnam’s success in gaining independence as a country with its own language. Afterward, during Vietnam’s fight for reunification, political writings and posters in the language promoting the Ho Chi Minh government continued to aid the process and strengthen nationalism in the Vietnamese people’s hearts.", "Secondly, the Vietnamese’s Red music and literature should also be mentioned as extremely effective political tools in Vietnam. During the era, the most highlighted traits in both of these platforms were the collective strength and nationalism of the Vietnamese people, as they courageously surpassed challenges with the hope of acquiring independence and, ultimately, widespread happiness for their nation. However, it would be completely misjudged to think that these contemporary pieces lack variety. In fact, such a trait of the Vietnamese people was demonstrated using different images and settings. For literature, many poems implemented the frequent use of natural components to illustrate the Vietnamese force, such as the bamboo tree, as used in pieces like “Cây tre Việt Nam” (translated as “The Vietnamese Bamboo Tree”). Other writings featured soul-touching camaraderie between Vietnamese soldiers, as seen in “Dồng chí” (or “Comrades”). Another kind of red literature is short stories, such as “Chiếc lược ngà” or “Lặng lẽ Sa Pa” (roughly translated as “The ivory comb” and “Silent Sa Pa”), which followed the lives of Vietnamese revolutionary forces. These stories served to further advance the revolutionary cause and encourage all Vietnamese citizens to partake in the fight for freedom and independence. Vietnamese red music, though less frequently talked about, is just as special to the cause. These songs, like red writings, featured the many stories of Vietnamese revolutionary personnel, documenting the sorrows of seeing their hometown demolished or sadness amidst the lack of food, fueling more determination to fight for independence and reunification. Moreover, many of these songs also carry positive messages, such as hope for independence and trust in the government, as well as heart-wrenching love declarations amidst the raging war. These forms of art and culture accompanied Vietnam through the early independence era as well, as Vietnam emerged as a new and struggling country, barely recovering from the sorrows and weight of the fighting it had just endured. Literature and music in this era captured not only the strangeness of the new era, having come back from the military base such as in “Ánh trăng” (“Moonlight”) and the struggle of the new era, but also hope for the development of the country as well as for multiple different industries to prosper.", "In the modern days, these key cultural pieces, though not as popular as the modern pop sound or the new echoes of literature, are still thoroughly preserved. The Vietnamese language is spoken by almost all Vietnamese citizens and is the official language of Vietnam. The language even spread worldwide, inspiring many foreigners to pick up Vietnamese. Revolutionary literature is taught at schools and is included in the compulsory curriculum. Music of the revolutionary era can still be heard through the voices of both senior and aspiring artists, allowing the youth of Vietnam to understand the culture and the power of Vietnamese arts in wartime.", "Citations:", "Nguyen, K. T. (2021, January 20). Contemporary Vietnamese literature: Achievements and challenges (Part 1). COMMUNIST REVIEW. https://www.tapchicongsan.org.vn/web/english/culture-society/-/asset publisher/nI7yCFQ01T3T/content/contemporary-vietnamese-literature-achievements-and-challenges-part-1-", "Quỳnh, Z. M. (2022, March 30). Quốc ngữ: The Shackle that became the sword. DVAN. https://dvan.org/2022/03/quoc-ngu-south-vietnam/#:~:text=In%20its%20dynastic%20era%2C%20Vietnam,written%20language%20for%20government%20documents", "Tran, B. T. (2022, February 10). Vietnam’s military culture through the lens of military art - national defence journal. National Defense Journal. http://tapchiqptd.vn/en/research-and-discussion/vietnams-military-culture-through-the-lens-of-military-art/18310.html"]}, {"slug": "yalta-conference-cold-war-and-its-effects", "title": "Yalta Conference, Cold War, and Its Effects", "author": "HƯƠNG GIANG", "type": "Brief", "source": "HU#U031bO#U031bNG GIANG/Yalta Conference, Cold War, and Its Effects.docx", "paragraphs": ["Brief: Yalta Conference, Cold War, and Its Effects", "The Yalta conference was the second of the 3 major conferences in the World War II period. It was prompted by the success of the Battle of Normandy, which made the victory of the Allied seem more imminent than ever. Thus, the leaders of the Allied nations - Winston Churchill (Prime Minister of the UK), Franklin D. Roosevelt (President of the United States of America), and Joseph Stalin (Soviet Premier) - met in Yalta to discuss the next courses of action after a defeat of Germany and the Axis Powers.", "The conference produced the Yalta Protocol, a top-secret document containing 03 areas: division of lands, reparations, and a proposal for a world organization.", "The Yalta Protocol’s first section specified the establishment of a conference to discuss the proposed “World Organization”, with the participants being existing United Nations countries as of 8th February 1945 and the nations that had declared war on the common enemy by 1st March 1945 (which are meant to be the eight Associated Nations and Turkey), as well as the Soviet Socialist Republics. This section, created to unite nations against the Axis Powers and establish international peace and consensus after WWII, paved the way for the official establishment of the United Nations in the future and its procedures as well as the confirmation of Stalin for the Soviets to take part in the organization, which was previously only an agreement between Churchill and Roosevelt in 1941 (History Channel, 2009).", "The conference also discussed the reshaping of Germany and Europe following the end of WWII. Several reparation terms were drafted, and Germany was asked to pay all of the losses as well as lose most of its military capacity. The most important outcome, however, was the division of land and “spheres of influence”. First of all, Germany would be divided among the 4 countries: the United States, the United Kingdom, the Soviet Union, and France. Berlin, the capital of Germany, lay in the Soviet-occupied zone, but was also divided into 4, each piece taken by an Allied country. This division is thought to be one of the causes of the Cold War, in which Berlin became a heated theatre.", "In persuasion of the Soviet’s participation in the Indochina region against Japan, where the other Allied nations were struggling to keep up, Stalin was granted a “sphere of influence” in Eastern Europe (Office of the Historian, n.d.). This grant of influence allowed the Soviets to expand their political agenda and acquire more land and satellite states, which followed their Communist ideology, causing future divisions among the Allied nations as the United States and the USSR faced each other in a battle of dominance.", "Meanwhile, with the help of Stalin, Japan's defeat in the Asia-Pacific theatre was achieved. This ending, however, was far from peace for the whole world, as decades of the Cold War were about to emerge. Many countries were forced to split into two, usually a communist-rooted and a democratic-rooted government - due to internal conflict or international influences. Among them were China, Korea, and Vietnam.", "Soon, tension arose between the two main ideologies that were dominating the world: Communism/Socialism and Democracy. During this time, the U.S. and the U.S.S.R. continuously engaged in battles of technology, development, and proxy wars, both desperate to expand their influence. Most prominent were the threats of nuclear bombing, which required intervention from the UNSC and other international bodies to cease from happening. As for the aforementioned countries that were split, some came out united, such as Vietnam, which became a Socialist nation, while others were not so lucky as the two halves remain split and hostile to this day, such as North and South Korea. In 1991, the Soviet Union collapsed, concluding the Cold War period, and so, a century of diplomatic tasks to normalize relations commenced.", "Nowadays, the world is a very different place. Even though many countries stuck with their ideology even after the collapse of the Soviet Union, there have been many developments and renovations to better themselves and encourage globalization. Vietnam is an interesting case to look at, as it has been most persistent in its ideology, while also changing itself with time and achieving many amazing accomplishments on the world stage. The country has undergone an economic reform, also known as the “doi moi” period, where the free market was legalized after assistance from the Soviet Union dwindled and the country was met with an economic crash. Since then, there have been major improvements in the economic-politics scene in Vietnam, as the country rose from isolation to prosperity. It became one of the world’s largest rice exporters and is on the rise of becoming a key player in many industries. Politically, the country also reconciled and established diplomatic relations with many other nations. It is a member of multiple international bodies, while also being the potential ally and strategic partner of world powers such as the United States, Russia, and China. However, it is important to note that these achievements were gathered with Vietnam staying true to its founding principles, even if changes do take place to accommodate advancements.", "In conclusion, it is clear that the world has become a more globalized and united stage, as past conflicts are resolved and diplomatic relations prosper. Though the effects of the Yalta Conference leading up to the Cold War will be an unerasable mark in history, it has also served as a lesson for world leaders to learn from. As countries like Vietnam continues to evolve, the world is likely to become a less polarized place, where unity and collaboration thrives.", "Citations:", "Hong, T. A. (2009, September). Doi Moi and the remaking of Vietnam. Global Asia. https://www.globalasia.org/v4no3/cover/doi-moi-and-the-remaking-of-vietnam hong-anh-tuan", "U.S. Department of State. (n.d.). The Yalta Conference, 1945. U.S. Department of State. https://history.state.gov/milestones/1937-1945/yalta-conf#:~:text=At%20Yalta%2C%20Roosevelt%20and%20Churchill,of%20influence%20in%20Manchuria%20following"]}, {"slug": "refusal-to-listen-a-case-study-of-digital-lynching-and-mob-m", "title": "Refusal to Listen: A Case Study of Digital Lynching and Mob-Mentality towards Phạm Tường Lan Thy in Vietnamese Internet Culture", "author": "Lucie Dang", "type": "Journal", "source": "LUCIE/ Refusal to Listen_ A Case Study of Digital Lynching and Mob-Mentality towards Pha#U0323m Tu#U031bo#U031b#U0300ng Lan Thy in Vietnamese Internet Culture.docx", "paragraphs": ["Refusal to Listen: A Case Study of Digital Lynching and Mob-Mentality towards Phạm Tường Lan Thy in Vietnamese Internet Culture", "Introduction", "We tend to think that in this modern age, we have progressed immensely, our behaviors improved, and our thinking modern. Etiquettes are taught to our children at a young age. In public spaces we follow codes of conduct, and are most often told to “Treat others with respect”. However, in cyberspace, it seems as if all of our efforts for civil interactions are in vain - libel, slander, defamation are rife on all social media spaces. In all these dehumanizing acts a pattern of behavior emerged and has progressed into a ‘culture’ - digital lynching. One such case that epitomizes this toxic culture is that of Pham Tuong Lan Thy, a Vietnamese figure known for her achievements in the renowned academic TV show “Road to Olympia”. However, she has also become a victim of the digital mob mentality that has persisted for years. This op-eds uses the Hatred Framework to analyze Lan Thy’s story, underlining my perspective on this widely recognized case yet rarely discussed in Vietnam academia.", "Case summary", "For those unfamiliar with the case: At the end of 2015, Lan Thy faced widespread accusations claiming she had stolen a science experiment idea from a male friend, Gia Khoi, which allegedly led to his death from shock. On February 28, 2019, Lan Thy publicly refuted these claims, providing detailed evidence to defend herself. Despite this, she continued to face relentless harassment on Facebook, where users hurled insults and even encouraged her to harm herself.", "Countless Facebook posts and groups concerning Lan Thy have been created for the past eight years, with most of them spreading shared hostility and branding her as the \"Grey matter thief.\" Any netizens who attempt to question the accusations are quickly met with backlash. Rumors also circulated that her family was wealthy and influential enough to manipulate the media and her school's administration. As a result, Lan Thy has become a scapegoat for public frustration over corruption and the privileges of the wealthy .", "Digital lynching in seven stages", "The case's endurance can be summed up by three main causes: a) the sensational events and ambiguity of information, b) echo chambers and Vietnamese Facebook users' fixation on the past, and c) Lan Thy's background (and the lack of information thereof).", "I’d also use the Hatred Framework as an analytical tool to dissect the triggers, escalation, and manifestations of hate towards Lan Thy. Developed by John Schafer and Joe Navarro, this framework offers a systematic approach to understanding the dynamics of hatred and hostility in cyberspace. This case contains all the steps outlined in the \"7-Stage Hate Model\".", "In \"Stage 1: The haters gather\", Facebook groups with thousands of members were created to discuss and coordinate attacks against her, fueled by baseless accusations and \"telephone game\" rumors.", "“Stage 2: The hate group defines itself\" presents Lan Thy being labeled derogatory terms like \"disabled sperm\" and \"freak,\" by these groups, and her achievements in academia disregarded and dismissed.", "“Stage 3: The hate group disparates the target”, the hatred towards Lan Thy becomes \"glue binds\" for these online communities, with constant denigration and aggression aimed at her. Despite her attempts to defend herself with evidence, including specific details provided on February 28, 2019, Internet users refused to engage with her explanations, opting instead to continue emphasizing false narratives and escalating the hostility every year.", "Haters then increase their taunts and offensive gestures towards Lan Thy to avoid introspection. This is “Stage 4: The hate group taunts the target.” Comments filled with insults and threats of self-harm or violence are prevalent across various online platforms.", "\"Stage 5: Hate group attacks the target without weapons\" and \"Stage 6: With weapons\" While the attacks against Lan Thy remain primarily online, the intensity and aggressiveness of the language used by haters continue to rise. Calls for extreme measures such as \"hiến tế nó\" (sacrifice her) or \"thiêu sống nó\" (burn her alive) demonstrate the lengths to which some individuals are willing to go in their attempts to ruin her reputation and life.", "Finally, “Stage 7: Hate group destroys the target”. By erasing her presence from the Internet and perpetuating false narratives about her, the group successfully silences Lan Thy's side of the story and dehumanizes her.", "The analysis of Lan Thy's case highlights key insights into online behavior, misinformation, and the widespread culture of hatred in Vietnamese internet communities. It shows the need for empathy, critical thinking, and responsible online engagement in shaping our digital culture. As we continue to grapple with the implication of the digital age, it's important to know the dangers posed by the culture of digital lynching.", "Wider implications", "This op-ed focuses more on the \"public\" than the \"policy\" side of the journal. While policy changes can help, the most important factor is the public's awareness and responsibility. Current Vietnamese policies on digital spaces are unclear and need improvement, as they don't address harmful content or provide support for victims of online harassment.", "References", "Hoàng Giang Đặng. (2017). Thiện, ác và smart phone. Hà Nội Nhà Xuất Bản Hội Nhà Văn.", "JOHN R. SCHAFE , & JOE NAVARRO. (2003). The Seven-Stage Hate Model The Psychopathology of Hate Groups. FBI Law Enforcement Bulletin, 72(3). http://www.drvalverde.com/uploads/1/0/5/3/10538520/7 stage hate model.pdf", "Lan Thy - Gia Khôi | Phốt hot girl Lan Thy Đường Lên Đỉnh Olympia năm nào. (2023). Facebook.com. https://www.facebook.com/groups/368691404441050/posts/373495507293973/", "VCCorp.vn. (2023). Phạm Tường Lan Thy. Https://Kenh14.Vn. https://kenh14.vn/pham-tuong-lan-thy.html", "Yến Nguyễn. (2019, February 28). “Hot girl ống nghiệm” lên tiếng khi bị tố ăn cắp ý tưởng dẫn đến cái chết của bạn thân, cư dân mạng nói gì? - Saostar.vn. Tạp Chí Điện Tử Saostar.vn; Saostar.vn. https://www.saostar.vn/sao-hoc-duong/hot-girl-ong-nghiem-len-tieng-khi-bi-to-an-cap-y-tuong-dan-den-cai-chet-cua-ban-than-cu-dan-mang-noi-gi-4680048.html"]}, {"slug": "why-do-laws-protecting-vietnamese-children-fail-to-empower-t", "title": "Why Do Laws Protecting Vietnamese Children Fail to Empower Their Decision-Making?", "author": "Lucie Dang", "type": "Journal", "source": "LUCIE/Children_s Participation Laws In Vietnam - Why it fails.docx", "paragraphs": ["Why Do Laws Protecting Vietnamese Children Fail to Empower Their Decision-Making?", "Abstract", "This journal offers an examination of the effectiveness of existing legal framework on children’s participation rights in Vietnam and the challenges of implementing the Convention of the Rights of the Child in the country, including traditional customs and culture, and socioeconomic situations.", "Introduction", "Children’s participation rights has been increasingly discussed since the 1990s with the existence of the Convention on the Rights of the Child (CRC) (Wyness, 2013). Vietnam is the first country in Asia and the second country globally to become a member of the CRC, and has since demonstrated its efforts and commitment to integrating the principles of the CRC into its legal system, such as amending the Law on Protection, Care, and Education of Children to the Child Law in 2016, revising key provisions in the Criminal Law, Civil Law, Labor Law, and Education Law towards a child rights-based approach. However, admist these remarkable development, the real life implementation of children's participation rights still predominantly remains formalistic, superficial, and lacks adequate attention from adult stakeholders. Periodic assessment by the UN Committee on the Rights of the Child reveals persistent challenges in upholding Article 12 of the CRC—\"respect for the views of the child\"— across nations, specifically from significant cultural norms and societal biases. This journal will comprehensively evaluate current Vietnamese law on children's participation rights and analyze practical challenges in applying the CRC Convention in Vietnam.", "Policy Overview: CRC", "The purpose of the Convention of the Rights of the Child (CRC) is to shift the perspective of considering children from objects of rights to subjects of rights, viewing children as mere recipients of rights to recognizing them as active participants entitled to political, civil, economic, cultural, and social rights, akin to any other member of society. Most importantly, these rights must warrant equal respect, implementation and protection. The Convention becomes an international legal framework for member countries to build and perfect their national legal systems on children's rights. Member States should ensure that their national laws are compatible with the principles in the Convention; Regulations, programs and policies need to be based on children's rights and ensure the core principles of the Convention. This article will use the CRC Convention as a legal framework to analyze the current legal system on children's participation rights in Vietnam.", "Policy Analysis: Vietnam’s legal framework", "Definition of the child", "According to Vietnam's Children's Law in 2016, children are people under 16 years old, which is 2 years younger than general international regulations. Vietnam is in the 11 countries that set the age of children lower than the CRC Convention, including: North Korea (17), Timor Leste (17), Myanmar, Cambodia (16), Cuba (16), Kyrgyzstan (16). 16), Indonesia (15), Saudi Arabia (15) and Iran (shockingly, being 9).", "The last paragraph of Article 1 of the CRC Convention states “Except in the case the law [of a Member State] is applicable to the child of an earlier age of maturity” to make this provision more specific, but this does not mean that flexibility should be allowed in determining the range of childhod. This provision means that national members can determine the age of maturity earlier, but are till obliged to monitor CRC provisions for everyone under 18 years of age. Countries can only set a minimum age lower than 18 in some areas and for some specific purposes - provided that the general principles of the CRC are met.", "On the other hand, it is especially worth noting that the the definition of the child in Vietnam’s legal documents are inconsistent. In Vietnam’s 2015 Civil Code, the age of maturity is 18 years old, while the 2019 Labor Code stipulates that minor workers are workers under 18 years old and the concept of children is understood as people under 15 years old (Article 143). Moreover, the Law on Handling of Administrative Violations 2012 stated that people aged 14 years or older can be punished for administrative violations (Point a, Clause 1, Article 5). Thus, the concept of a child is not identical to the concept of a minor (a person under 18 years old), although both of these concepts refer to a person who has not yet fully developed physically, mentally and do not near the legal rights and obligations of adults. Subjects aged 16 to under 18 years old are left open, with no clear regulations.", "This shows how Vietnam has failed to establish a consistent legal age framework that aligns with the principles of the Convention on the Rights of the Child (CRC).", "Legal recognition of children’s rights", "The Constitution of Vietnam, the highest legal document in the system of legal regulations, acknowledges children's participation rights: \"Children shall be protected, cared for, educated by the State, families, and society; they shall participate in issues concerning children...\" (Article 37). The 2013 Constitution serves as a guideline for the State to formulate and enact other laws, including the 2016 Law on Children. While the title might suggest that its provisions primarily concern children as the subjects of rights, Article 3 of the 2016 Law on Children expands its scopes as follows: “State agencies, political organizations, socio-political organizations, socio-political-professional organizations, social organizations, socio-professional organizations, economic organizations, public service units, armed forces units, educational institutions, families, Vietnamese citizens; international organizations, foreign organizations operating within the territory of Vietnam, and individuals who are foreign residents in Vietnam.”", "A set of laws specifically dedicated to children, outlining their rights, yet children are not the direct recipients of the law. Additionally, there’s a section allocated solely to emphasize the duties that children must fulfill, including the duties of children towards their families, the community, their homeland, and themselves (Articles 37 to 40). This reflects the perspective that children are still regarded primarily as objects in need of adult care and protection, rather than being approached based on their rights.", "It is evident that these provisions may not hold legal weight because if children fail to fulfill these duties, the responsibility falls on adults. For instance, duties for children such as \"No gambling; no buying, selling, or using addictive substances” cannot be carried out by children themselves without guidance from adults (family, school, and the state). Therefore, instead of framing these as children's duties, it would be more legally sound to approach them from the perspective of children's rights to be protected from these harmful factors, and the responsibility of adults, rather than the current view of the child.", "Lack of Clarity and Specificity", "Upon initial inspection, Vietnam's framework for children's participation rights appears comprehensive, clearly outlined across numerous provisions. However, upon closer examination, many still lack precision and transparency, especially concerning their legal implications.", "For instance, Article 34 of the Vietnam’s 2016 Law on Children outlines the following: \"Children have the right to express their opinions, desires regarding issues related to children; they are free to assemble according to the provisions of the law appropriate to their age, maturity level, and development; they have the right for authorities, organizations, educational institutions, families, and individuals to listen, understand, and respond to their legitimate opinions and desires.\" Compared to Article 12 of the CRC: “(1) States Parties shall assure to the child who is capable of forming his or her own views the right to express those views freely in all matters affecting the child, the views of the child being given due weight in accordance with the age and maturity of the child.”", "While Article 12 of the Convention uses the phrase \"given due weight,\" which imply \"to be given appropriate consideration,\" Article 34 uses the phrase \"chính đáng\", According to the Hoàng Phê Vietnamese Dictionary, \"chính đáng\" means correct, justifiable. \"Justifiable\" implies compliance with requirements and meeting needs. This phrase carries a lower legal significance, hiding the role of adults in meeting the needs and desires of children. This fails to emphasize the importance of valuing children's viewpoints, rather than requiring them to justify their needs in order to be heard.", "Moreover, the 2016 Law on Children, along with Decree 56/2017/ND-CP, provides detailed provisions regarding the responsibilities of entities (agencies, organizations, educational institutions, families, and individuals) in ensuring the implementation of children's participation rights. However, this does not offer specific guidance and explanations for cases where children's participation rights are not properly exercised \"for the best interests of the child.\" This absence on \"what constitutes the best interests of the child\" or \"alternative measures\" could easily lead to abuse by authorities. In General Comment No. 14 (2013), the Committee emphasized the most effective means of determining ‘the best interests of the child’ is by actively listening to the child's perspective.\"", "Impact on Youth", "The ambiguous and inconsistent legal framework regarding children's participation rights in Vietnam can have significant implications for its youth population. In the immediate sense, the lack of clarity and specificity in legal provisions undermines the ability of Vietnamese youth to effectively exercise their rights to participate in decisions that affect us.", "Article 34 of Vietnam’s 2016 Law on Children grants children the right to express their opinions and desires, yet the vague language surrounding how these opinions should be considered and acted upon leaves room for interpretation and inconsistent application. As a result, we find their voices muted or disregarded in matters that directly impact their lives, which is entirely true in many Vietnamese families. These issues can even reach beyond individual experiences to affect the broader Vietnamese society, where a generation of youth who are inadequately prepared to participate in governance and community affairs may contribute to social challenges like social inequality, lack of transparency in governance, and reduced accountability, etc.", "Personal Commentary & Recommendation", "I believe that there are several factors contributing to the challenges regarding the implementation of children’s participation rights in Vietnam from CRC’s guidelines: traditional customs and culture, and socioeconomic conditions. These are surely “big words” - overarching concepts that are not easily changed, but there are still steps we can take to eliminate barriers to children’s participation.", "Traditional customs and Culture", "The right to participate can be understood, constructed, and implemented differently across various cultural backgrounds and social contexts. Even adults' perceptions of children's participation rights are influenced by the cultural and social norms of that society.", "In Vietnam, child participation is not prevalent, and the youngest members of the society rarely get the chance to engage in family discussions and decision-making processes. The notion of \"filial piety\" (Hiếu) from Confucianism traditions is a significant factor in defining one's role as a child. It often idealizes parental authority and emphasizes children's obligations to a large extend. Although nowadays, imposed ideologies on children in Vietnam are gradually being eradicated, in many families, especially in rural areas, children are still often pressured by their parents on matters ranging from education and career choices to marriage and having children.", "The emphasis on \"filial piety\" and the obligation to \"obey\" not only cause parents or other family members to forget their own duties and fail to listen to the opinions of children but also render children passive, only following their parents' opinions or not daring to voice their own opinions. This can be considered one of the biggest barriers to implementing participation rights in Vietnam because children's participation practices start with the smallest things right within the family.", "Changing perceptions and viewpoints require effort from all stakeholders, not only the community and the state but also from schools, families, and children themselves. As mentioned above, The legal framework in Vietnam on children’s participation rights has some provisions that are not mutually compatible and with the principles and provision set out in the Convention on the Rights of the Child, and some provisions lacks legal validity - these need to be amended. It is also essential to complete the guidance documents for relevant stakeholders to implement and ensure participation rights of children.", "Economic and social situation", "The economic and social situation deeply affects ensuring children's participation rights. As of 2020, Vietnam still had about four million children lacking access to at least two basic social services, including education, healthcare, nutrition, housing, clean water and sanitation, information, social integration, and protection. In some underdeveloped areas, many children are even forced out of their childhood life to become the main breadwinners to support their families. According to the International Labour Organization (ILO). \"58.8% of working children in Vietnam are child laborers.” Children's participation in labor restrict their time and their rights to participate in other social activities.", "Additionally, there’s a limited understanding of the laws regarding children's participation rights in lower-income society. Children require the support and guidance of adults to effectively exercise their participation rights. Adults, especially parents or guardians, must also understand children's participation rights for children to participate effectively. Children need to be guided and educated about their participation rights and how to exercise them. However, many parents, especially in lower-income community, often lack knowledge about children's rights. They may believe that providing material necessities is sufficient, overlooking the importance of respecting children's opinions and involving them in decision-making processes.", "Clearly, the state requires economic resources in terms of infrastructure, transportation, technological equipment, especially in the era of the 4.0 technological revolution, to adapt to new changes and global developments in ensuring human rights as well as children's participation rights. This includes providing equipment and information technology applications to serve everyone, including children; digitizing information, using connectivity applications to help children access information and policies easily; expressing their opinions, recommendations; or reporting, lodging complaints about rights violations.", "Conclusion", "Despite Vietnam's commitment to children's rights, cultural norms and vague laws keep the youngest voices unheard. Vietnam has made commendable strides in ensuring children’s participation rights in the legal system. The ratification of the CRC and incorporation of children’s participation rights into the Vietnam Constitution and the Children Law 2016 have demonstrated the Vietnamese government’s commitment to promoting and protecting children’s rights. Nevertheless, several challenges persist in ensuring meaningful and effective participation of children in Vietnam. The government needs to consider factors including politics, economic, and culture to create a human right based approach to reaching children rights in society.", "References", "Gromada A, Richardson D and Rees G, ‘Childcare in a Global Crisis: The Impact of COVID-19 on Work and Family Life’ (2020)", "Hodgkin R and UNICEF (eds), Implementation Handbook for the Convention on the Rights of the Child (Fully rev 3 ed, Unicef 2007)", "Krappmann L, ‘The Weight of the Child’s View (Article 12 of the Convention on the Rights of the Child)’ (2010) 18 The International Journal of Children’s Rights 501", "Lundy L, ‘“Voice” Is Not Enough: Conceptualising Article 12 of the United Nations Convention on the Rights of the Child’ (2007) 33 British Educational Research Journal 927", "Nguyen Le Dan, ‘Độ tuổi pháp lý của trẻ em: một số vấn đề lý luận và thực tiễn’ (Tap chi Cong Thuong, 2021) <https://tapchicongthuong.vn/bai-viet/do-tuoi-phap-ly-cua-tre-em mot-so-van-de-ly-luan-va-thuc-tien-84755.htm> accessed 16 February 2024", "Nordenfors M, Participation - on the Children’s Own Terms? (City of Gothenburg, Tryggare och mänskligare Göteborg 2012)", "Todres J and King SM, The Oxford Handbook of Children’s Rights Law (Oxford university press 2020)", "UN Committee on the Rights of the Child (CRC), ‘General Comment No. 12 (2009): The Right of the Child to Be Heard, CRC/C/GC/12’", "Willow C, Children’s Right to Be Heard and Effective Child Protection: A Guide for Governments and Children Rights Advocates on Involving Children and Young People in Ending All Forms of Violence (Save the Children Sweden 2010)", "Woodhouse BB, ‘Children’s Rights’ [2000] SSRN Electronic Journal <http://www.ssrn.com/abstract=234180> accessed 16 February 2024", "Author: Đặng Khánh Linh", "Despite Vietnam's commitment to children's rights, cultural norms and vague laws keep the youngest voices unheard.", "Vietnam, despite being one of the first countries to ratify the Convention on the Rights of the Child (CRC), struggles with the effective implementation of children's participation rights. The country's legal framework, although comprehensive in appearance, remains superficial and formalistic and falls short in practice. This paper examines the challenges and calls for reforms to ensure that Vietnamese children are truly empowered to participate in decisions that affect their lives.", "Highlights of Problems in Legal Framework:", "Definition of the Child: Vietnam’s inconsistent age definitions (e.g., 16 vs. 18) creates confusion with the application of children's rights", "Legal Recognition: Children are still largely viewed as objects needing adult care rather than individuals with rights.", "Clarity Issues: Legal language is ambiguous compared to international standards, which can lead to inconsistent application and potential abuse by authorities.", "Author commentary", "The author identifies traditional customs, particularly the influence of Confucian ideals like \"filial piety\" (Chữ hiếu) as major barriers to children's participation. The socioeconomic situation also plays a role, as children in lower-income families often lack access to education, limiting their awareness of their participation rights. The author recommends legal reforms to align Vietnamese laws with CRC principles and improvement to implementing these rights."]}, {"slug": "are-we-all-getting-a-fair-shot-at-education-in-vietnam", "title": "Are we all getting a fair shot at education in Vietnam?", "author": "Lucie Dang", "type": "Journal", "source": "LUCIE/Educational equity_ Are we all getting a fair shot at education in Vietnam_.docx", "paragraphs": ["Are we all getting a fair shot at education in Vietnam?", "Abstract: The right to equal access to education for children is one of the fundamental rights recognized and protected by both international and national law. This right ensures that all children, regardless of race, gender, age, ethnicity, disability, or economic background, are given the same opportunity to access education.", "Although this is a basic right guaranteed by international and national laws, in practice, there remain significant disparities in access to education among different groups of children. Many countries, including Vietnam, continue to face challenges in daily life that not only hinder school attendance but also affect the quality of education.", "This journal aims to provide a comprehensive, multidimensional perspective on children's right to equal access to education and propose several measures to promote this right for disadvantaged groups.", "Introduction", "Education provides not only knowledge but also life skills, critical thinking, and societal adaptability. While equal access to education is a fundamental human right, many children globally still lack this opportunity. Factors such as the need to work to support families, gender biases preventing girls from attending school, and economic barriers hinder access, especially in developing countries.", "Disadvantaged children—such as those with disabilities, ethnic minorities, and abandoned children—face even greater challenges in obtaining equal educational opportunities. Ensuring equal access to education across various groups remains a significant global challenge.", "According to the United Nations High Commissioner for Human Rights, equal access to education is essential not only for acquiring knowledge but also for empowerment and the realization of other human rights. Promoting equal access allows girls to close the gender gap, enables poor children to escape poverty, and facilitates the integration of children with disabilities into society. Thus, the right to education is a fundamental human right and a vital tool for achieving the fulfillment of other rights.", "Theoretical framework", "According to Article 1 of the 1989 UN Convention on the Rights of the Child (CRC), a child is defined as anyone under 18, unless legal adulthood is reached earlier. Children are vulnerable due to lower social status, cognitive development, and inability to self-protect. Within this group, subsets like disabled, ethnic minority, migrant, and refugee children face even greater challenges, particularly in accessing education.", "The Universal Declaration of Human Rights (1948) asserts: \"Everyone has the right to education.\" Children are no exception. Furthermore, Article 28, Section 1, of the 1990 UN Convention on the Rights of the Child (UNCRC) states: \"States Parties recognize the right of the child to education, and with a view to achieving this right progressively and on the basis of equal opportunity...\" This emphasizes that the right to education applies to all children without any discrimination against beneficiaries of this right.", "The provisions require states to ensure equal access to education for all children. UNESCO’s 1960 Convention Against Discrimination in Education defines this as education free from discrimination based on race, gender, language, religion, or social origin. This implies that all children, regardless of social diversity or physical challenges, have the right to equal educational opportunities.", "Most discussions about equality in education focus on how to equalize access and participation in various levels of formal education for different social groups (Lynch, 2000) [1]. According to Froomkin, there is a need for equality in access to education for children from different socio-economic backgrounds. However, while the discussion of equal access to education tends to center on equal opportunity, in reality, this definition only reflects one aspect of the concept of equal access to education. Campbell and Klein (1982) argue that focusing solely on equal opportunity overlooks the broader concept of lifelong educational access, which starts at birth and continues throughout life.", "Kathleen Lynch approaches \"equality\" from the perspective of \"equality of condition.\" Simply put, the definition of equality of condition is the belief that people should be as equal as possible in terms of the central conditions of their lives. Equality of condition is not about making equality more just or providing more equal opportunities; rather, it ensures that people have almost equal prospects for a good life. In this sense, equal access to education means that all children have equal opportunities to access and enjoy this right.", "\"Equality\" is often mistaken for \"sameness,\" but they are different concepts, especially in education. Equality means everyone has the same opportunities, not that everyone should be treated or taught the same way. All children, regardless of race, gender, religion, disability, or economic background, deserve equal access to quality education. However, achieving this requires tailored support based on individual needs. For instance, a child with a disability might need assistive devices, a low-income child may need financial help, and an ethnic minority child might require language assistance.", "\"Equality\" more closely aligns with \"equity,\" as each child begins from different circumstances and experiences varying impacts on their rights. Inequalities in birth circumstances—such as country of birth, family education status, socio-economic level, cultural environment, age of education, school resources, and teacher competency—affect opportunities for equal education. For example, a child born in a Brazilian slum lacks the same educational access as a child born in Paris.", "When natural inequalities arise from how individuals are born, countries and legal bodies strive to make those who are not equal in nature legally equal. When natural inequalities combine with social inequalities, as Rousseau (1950) mentioned in his Social Contract Theory, it is impossible to speak of equal educational opportunities for students. Consequently, creating \"equality\" in access to education requires creating \"equitable\" opportunities through responsible entities such as the state, families, schools, and social organizations, which must respect the individual differences and specific needs of child groups while supporting efforts to bridge the educational gap.", "Legal framework", "As an active member of the Convention on the Rights of the Child, Vietnam prioritizes \"education and training as the foremost national policy,\" enacting numerous policies related to children's right to education. The 1946 Constitution established that \"children have the right to care and education,\" with primary education declared compulsory and free, particularly for poor students. These principles have been reaffirmed in subsequent Constitutions, culminating in Article 39 of the 2013 Constitution, which states, \"Citizens have the right and obligation to learn.\"", "Vietnamese law has institutionalized children's rights through legal frameworks such as the 2013 Constitution, the 2016 Child Law, and the 2019 Education Law, focusing on comprehensive child development. Article 16 of the 2016 Child Law emphasizes that children have the right to education, equal opportunities for learning, and the development of their talents and creativity. Promoting access to education, particularly for marginalized groups in challenging socio-economic conditions, is a key objective of Vietnam's development policies.", "The 2019 Education Law reinforces that \"learning is the right and obligation of citizens,\" ensuring equal educational opportunities for all, regardless of ethnicity, religion, gender, or socio-economic status. Article 13 emphasizes the state's responsibility to ensure fairness in education and provide a quality learning environment, particularly for vulnerable children, including those with disabilities and those from low-income families.", "To support equal rights for children with disabilities, Vietnam ratified the UN Convention on the Rights of Persons with Disabilities (UNCRPD) and enacted the 2010 Law on Persons with Disabilities, which guarantees full educational opportunities. Vietnamese law prohibits actions that hinder children's education, establishing responsibilities for families, schools, and state agencies. Article 69 of the 2014 Law on Marriage and Family outlines parental obligations regarding children's education, while Article 99 of the 2016 Child Law mandates that parents, teachers, and caregivers ensure children's rights to learn and complete compulsory education.", "Decree 81/2021/ND-CP details tuition fee exemptions and reductions for various groups, including children from families with historical merits, those without caregivers, and students from poor households. The Decree also allows for 50-70% tuition fee reductions and provisions for suspending fees in cases of natural disasters or epidemics, subject to local government decisions.", "Key achievements and areas for continued development", "4.1. Key Achievements", "In recent years, Vietnam has made impressive strides in promoting equal access to education for children, contributing to improved education quality and ensuring the comprehensive development of future generations. These achievements are evident not only through policies and legal documents but also via specific programs and projects aimed at improving learning conditions for children across different regions.", "One of the most remarkable accomplishments is achieving universal primary education, with a 100% enrollment rate from grades 1 to 5. Fee exemptions and reductions for students from poor and near-poor households, as well as other vulnerable groups, have enabled many disadvantaged children to continue their education without interruption. Notably, policies supporting educational costs, free textbooks, and social assistance have alleviated the financial burden on poor families, ensuring equal access to education for children.", "Additionally, Vietnam has launched several educational development programs targeting remote, mountainous, and ethnic minority regions. Initiatives to construct and upgrade schools, along with modern facilities and equipment, have substantially improved teaching and learning conditions, thereby enhancing the overall quality of education in these regions. By 2020, the literacy rate among ethnic minorities reached 90%; the percentage of solidly constructed schools increased from 77.1% in 2015 to 91.3% in 2019, and the school attendance rate across all educational levels improved... [2]", "Ensuring the right to education for children with disabilities has received special attention in Vietnam. The country has enhanced access to education for disabled children by establishing provincial Centers for Inclusive Education Support in over 20 provinces and cities, as well as 107 specialized educational institutions and 12 centers dedicated to these children. Data from the National Survey on People with Disabilities shows that the primary school attendance rate for children with disabilities is approximately 88.7%, while the rate for high school is 33.6% [3].", "For girls, Vietnam has also undertaken measures to promote gender education and protect their rights. Gender education programs in schools and awareness campaigns on girls' rights have helped reduce early school dropout rates, child marriages, and gender-based violence. This not only improves the educational outcomes of girls but also raises community awareness about the importance of gender equality in education.", "4.2. Areas that needs improvements", "Despite the achievements, there remain issues that need further research and adjustment to align with practical needs:", "First, there are existing policies that prioritize enrollment and support for preschool, elementary, and high school students from ethnic minority groups (Decree 57/2017/ND-CP), focusing on children from particularly disadvantaged areas (Region III). However, more support is needed for children in Regions I and II, where many ethnic minority families face economic difficulties, affecting children's education. Additionally, the changes in the curriculum and textbooks, along with teacher quality, have posed challenges.", "Second, most education and vocational training policies for ethnic minority students are currently gender-neutral. To avoid gender biases, specific regulations are needed to promote equal access to education for girls. Although the Education Law (2019) and the Vocational Education Law (2014) include measures to close the gap in access to general and vocational education for ethnic minorities, most of these provisions are \"gender-neutral.\" The Gender Equality Law (2006) ensures gender equality in education, but greater attention is needed to address gender-specific issues within ethnic minority communities.", "Third, policies on inclusive and culturally diverse education need to be further researched and adjusted, particularly in educational programs and textbooks. Language barriers remain a significant obstacle for many ethnic minority children in accessing education. These students follow a standardized curriculum, with the primary language of instruction being Vietnamese and an elective foreign language, often English. Therefore, further research is required to develop solutions that facilitate inclusive education for these children.", "Fourth, in addition to issuing legal documents on children's right to equal access to education, law enforcement and practical application are crucial. Therefore, assessing the quality of law enforcement in different regions and for specific groups of children is essential. In rural, mountainous, and remote areas, the implementation of educational support policies continues to face many challenges due to a lack of resources and infrastructure, leading to disparities in educational access compared to urban areas.", "Recommendations", "Based on the strengths and limitations mentioned above, I propose several recommendations to further promote equal access to education for children:", "1. Legal policies should focus more on children with special circumstances. It is essential to clearly identify and categorize different groups of children, understanding their specific needs to formulate and implement appropriate measures that promote equal access to education. The ultimate goal is to ensure that every child enjoys the right to equal access to education.", "2. Legal regulations need to be implemented swiftly and uniformly, avoiding overlap or complexity that may hinder their application. Legal provisions should focus on children's right to education, avoiding the perception of children as passive recipients and instead acknowledging the rights children can exercise themselves. Furthermore, regulations must be specific and avoid being overly general, which could reduce the effectiveness of legal dissemination and education efforts.", "3. To ensure equal access to education for ethnic minority children in remote areas and vocational education for persons with disabilities, it is crucial to continue strengthening policies for teachers and educational managers working in special schools and regions with difficult socio-economic conditions. Special attention should also be given to teaching and learning the languages and scripts of ethnic minorities within educational institutions.", "4. Continue establishing policies and implementing reforms to ensure the quality of education for all. These policies should set standards, frameworks, and guidelines for curricula, assessment, and teacher qualifications. Education authorities must study and consider the viewpoints of various stakeholders, such as educators, parents, and experts in the education sector, in an effort to create policies that align with the evolving needs of society.", "5. Legal policies should be adjusted to expand the beneficiaries of the right to access education. For example, simplifying administrative procedures is necessary. Education policies should reduce complex bureaucratic processes, making it easier for children from disadvantaged backgrounds to enroll in schools. Education laws need to be improved to ensure that all children have equal opportunities to access education, contributing to the sustainable development of society.", "Conclusion", "The significance of education for individuals and society is clear, and the right to education cannot be subject to market principles. Equal access must be guaranteed for all children, including those from impoverished or special circumstances.", "Economic and political obstacles often prevent young people from receiving a full education. Structural issues like poverty, discrimination, and conflict hinder school attendance and access to learning materials. Therefore, responsible parties must implement measures to promote equal access to education for all children.", "References", "[1] UNESCO (2020), What you need to know about the Right to Education (Những điều cần biết về quyền được giáo dục). https://www.unesco.org/en/articles/what-you-need-know-about-right-education", "[2-3] Thanh Giang (2022), Thúc đẩy quyền tiếp cận giáo dục, Trang thông tin điện tử Ban Tuyên giáo Tỉnh uỷ Phú Yên: https://tuyengiao.phuyen.gov.vn/khoa-giao/thuc-day-quyen-tiep-can-giao-duc-4388.html", "[4-5] Nguyễn Thị Dung (2023), Đảm bảo quyền tiếp cận giáo dục của trẻ em khuyết tật, Đồng hành Việt online. https://donghanhviet.vn/dam-bao-quyen-tiep-can-giao-duc-cua-tre-khuyet-tat/", "[6-7] Quang Thành và Đức Thành (2023), Thực trạng và kiến nghị trong việc bảo đảm quyền học tập của trẻ em dân tộc thiểu số ở Việt Nam, Xây dựng Đảng. https://www.xaydungdang.org.vn/nhan-quyen-va-cuoc-song/thuc-trang-va-kien-nghi-trong-viec-bao-dam-quyen-hoc-tap-cua-tre-em-dan-toc-thieu-so-o-viet-nam-18975"]}, {"slug": "breaking-the-cycle-rethinking-corporal-punishment-norms-for", "title": "Breaking the Cycle: Rethinking Corporal Punishment Norms for Children’s Rights in Vietnam", "author": "Lucie Dang", "type": "Journal", "source": "LUCIE/Policii.docx", "paragraphs": ["Breaking the Cycle: Rethinking Corporal Punishment Norms for Children’s Rights in Vietnam", "Abstract", "This paper delves into the deeply ingrained norms of corporal punishment in Vietnam while examining the effectiveness of existing policies. Through a thorough exploration of cultural, societal, and legal facets, this unravels the complex factors sustaining the prevalence of physical discipline among parents and educators.", "Introduction", "In today's rapidly changing world, where conversations about human rights and child welfare are gaining momentum, the persistence of corporal punishment norms in Vietnam stands as a stark contradiction. In Vietnam, nearly 70% of children have experienced violence at home from their parents and caregivers, ranking 27th out of 75 countries (UNICEF, 2023). For Vietnamese youth, corporal punishment isn't just a relic of the past; it's a lived experience that shapes their perceptions of authority, self-worth, and safety.", "Corporal punishment, defined as the use of physical force intended to cause pain or discomfort as a form of discipline or control, remains prevalent among parents and teachers. The norms “yêu cho roi cho vọt, ghét cho ngọt cho bùi” (\"spare the rod, spoil the child\") echoes through generations, with the belief that physical discipline is a necessary tool to foster discipline and respect in children. However, as we dive deeper into the repercussions of such practices, it becomes evident that this practice comes at the cost of children's physical and psychological well-being.", "This paper will dissect the multifaceted issue surrounding corporal punishment norms in Vietnam through the lens of children's rights. In addition to cultural and social aspects, the study will examine the existing legal framework governing corporal punishment and evaluete its effectiveness of Children’s Law of Vietnam. This paper aim to shed light on its impact on Vietnamese youth and advocate for a shift towards non-violent disciplinary practices, paving the way for a future where every child in Vietnam grows up in an environment that nurtures their potential and safeguards their rights.", "Issue Analysis", "Corporal punishment, deeply ingrained in Vietnamese culture, remains a contentious issue with significant implications for children's rights and well-being. Its roots can be traced back to traditional beliefs that physical discipline is essential for instilling respect and obedience in children (Smith, 2018). Despite modernization efforts, corporal punishment persists in Vietnamese households and schools, reflecting broader societal attitudes towards discipline and authority.", "The 1992 Constitution (amended and supplemented in 2013) has institutionalised views on protecting human rights. On the basis of these Constitutional rights, the right of children to be free from violence are clearly stated. The law prohibits acts that harm children, and explains very clearly what acts of violence against children (prohibiting physical punishment), yet there are still various incidents that hurt and harm children both in the family and at school continued to occur on television and newspapers: “1st grade students had their fingers broken by the teacher”, “father threw his daughter out into the yard”, etc. And most of the time, this is trenched in the widespread acceptance and normalisation of corporal punishment.", "The current status quo of corporal punishment in Vietnam is characterized by a complex interplay of cultural traditions. Vietnam, deeply rooted in Eastern Culture, places strong emphasis on filial piety, valuing resếpct for parents and elders. Within this cultural framework, parent-child relationships often embody authoritarian dynamics, where children feel obligated to fulfil their parents' expectations and follow their decisions. This societal norm is expressed in the popular proverb “Yêu cho roi cho vọt, ghét cho ngọt cho bùi\", or a similar one in English, “He who withholds his rod hates his son, But he who loves him disciplines him diligently\". This suggests an acceptance of corporal punishment as a form of discipline, or even out of love, in Vietnam.", "Within Vietnamese society, physical punishment is also deeply entrenched in familial and educational practices. Parents often resort to physical discipline as a means of correcting perceived misbehaviour, viewing it as a form of tough love and necessary for character development (Nguyen, 2017). Similarly, teachers employ corporal punishment in schools to maintain discipline and order.", "The broader context of corporal punishment extends beyond individual disciplinary practices, reflecting broader power dynamics and social norms. Gender roles and cultural expectations further perpetuate the normalisation of corporal punishment, with boys more likely to experience physical discipline than girls (UNICEF, 2021). Moreover, socio-economic disparities exacerbate the issue, as children from marginalised communities are disproportionately affected by corporal punishment due to limited access to resources and support systems (Tuoitrevn, 2020). “This is just the tip of the iceberg, because in Vietnam there are still many unreported cases,\" Ms. Lesley Miller - deputy chief representative of the United Nations Children's Fund in Vietnam (Unicef) - emphasised at the meeting.", "Data and reports highlight the prevalence and impact of corporal punishment on Vietnamese youth. A study conducted by UNICEF revealed that over 70% of Vietnamese children experience some form of corporal punishment at home or in school (UNICEF, 2021). Out of every 10 children surveyed, more than 6 children have been subjected to psychological punishment and 4 children have been physically punished. Mr. Dang Hoa Nam, Director of the Department of Children (Ministry of Labor, War Invalids and Social Affairs) admitted: \"We are not too surprised by the fact that nearly 71% of children have been educated through violent punishment.\"", "Policy intervention is imperative to address the critical aspects of corporal punishment in Vietnam. Strengthening enforcement mechanisms and raising awareness about children's rights are essential steps towards creating a protective environment for Vietnamese youth.", "Impact Assessment", "The effects of corporal punishment on Vietnamese youth are profound and far-reaching. Beyond physical harm, children subjected to corporal punishment often experience psychological trauma, eroding their sense of self-worth and security (Le & Vu, 2019). Research indicates that children who experience corporal punishment are more likely to develop aggression, anxiety, and depression, affecting their overall well-being and future prospects (Tran & Nguyen, 2018).", "The immediate implications of corporal punishment extend to children's educational experiences, with studies showing a negative correlation between physical discipline and academic achievement. Fear of punishment may hinder children's engagement in learning activities, perpetuating a cycle of underachievement and disengagement from school (Pham & Le, 2020).", "In the long term, the impact of corporal punishment on Vietnamese youth can have lasting consequences on their socio-emotional development and societal integration. Children who experience corporal punishment may internalize violent behaviors and attitudes, perpetuating cycles of violence in future generations. Moreover, the normalization of corporal punishment perpetuates inequalities and reinforces power dynamics within Vietnamese society, hindering efforts towards social cohesion and inclusive development (Tran, 2019).", "Addressing the issue of corporal punishment in Vietnam requires a multifaceted approach that considers its cultural, social, and legal dimensions. By recognizing the broader context of corporal punishment and its impact on Vietnamese youth, policymakers can enact meaningful reforms that prioritize children's rights and well-being.", "Need for Policy Change:", "The current legal framework concerning children's rights and protection in Vietnam, particularly regarding corporal punishment, presents notable inadequacies warranting immediate attention. While the Vietnamese government has ratified international treaties advocating for children's rights, including the Convention on the Rights of the Child (CRC), and set out a domestic framework in “Children’s Law”, it is clear that implementation remains uneven (Ministry of Labor, Invalids and Social Affairs, 2020). Enforcement mechanisms are lacking, leading to widespread acceptance and normalization of corporal punishment.", "Analyzing the current law reveals specific strengths and shortcomings that render it ineffective in adequately addressing the issue of corporal punishment. Firstly, while the Law on Child Protection, Care, and Education prohibits physical punishment, and it actually provide clear definitions and guidelines on what constitute as violence against children, being “the act of tormenting, mistreating, and beating; harming body and health; insulting and insulting honor and dignity; isolation, exclusion and other intentional acts that cause physical and mental harm to children.” Yet, a significant gap exists between the intent of policies and their actual implementation. The interpretation of violence against children and corporal punishment varies widely among individuals: Many believe these are different. This ambiguity creates challenges in effectively enforcing and prosecuting cases of abuse. It also leads to inconsistencies in addressing instances of corporal punishment. The law lacks stringent enforcement and mechanisms to ensure compliance and accountability among parents, educators, and caregivers.", "Another pressing issue is the widespread lack of awareness and understanding among the general population regarding the provisions of the law and children's rights. Many parents and teachers are not familiar with alternative disciplinary methods or the detrimental effects of corporal punishment on children's well-being. Cultural and societal norms further worsen this problem by perpetuating the acceptance of physical punishment in Vietnamese households and schools. Traditional beliefs emphasizing strict discipline and respect for authority figures, normalizing physical punishment. There is also a glaring absence of adequate education and training on positive parenting practices and non-violent disciplinary techniques for parents and caregivers. Without such education, they may continue to rely on corporal discipline as a method of behavior correction. Additionally, the lackluster education system contributes to children not reporting instances of corporal punishment, hence many incidents may go unreported or be culturally justified, thereby hindering efforts to effectively address the issue.", "Policy Recommendations:", "To effectively address the deficiencies in current policies and combat the issue of corporal punishment in Vietnam, a comprehensive set of innovative and practical policy recommendations is essential:", "Strengthen legal frameworks by enacting comprehensive legislation explicitly prohibiting corporal punishment in all settings. Clear and unequivocal guidance on the rights and protection of children against all forms of violence is indispensable for ensuring their safety and well-being.", "Strengthen enforcement mechanisms to ensure compliance with existing laws prohibiting corporal punishment. This entails implementing regular monitoring and supervision protocols in schools and households to detect and address instances of physical discipline promptly.", "Promote positive discipline practices. This involves developing and disseminating guidelines and training programs for parents, educators, and caregivers on non-violent disciplinary techniques. This can help shift societal norms towards more compassionate and effective approaches to discipline.", "Enhance support services for families at risk of resorting to corporal punishment. Expanding access to counseling, support groups, or at least contact information to equip paảents and children with the necessary skills and reéources.", "Incoporate children's voices into policy-making processes. Ensuring children's active participation in decisions related to policies and programs affecting their well-being can foster a sense of ownership and empowerment. Creating platforms for children to express their views and advocate for their rights is essential for promoting a culture of respect and dignity.", "Implementing these policy recommendations has the potential to significantly impact the lives of Vietnamese youth by creating safer, more nurturing environments conducive to their growth and development.", "As young individuals, we hold a special power to bring about social change and impact policy decisions. We can spread awareness about the detrimental effects of corporal punishment and by advocating for non-violent disciplinary approaches, we can significantly influence the attitudes and behaviors within our communities. Getting involved in local initiatives, organizing awareness-raising events, and working alongside stakeholders can magnify our voices and rally support for policy reforms. We can actually also contribute to policy reforms, either indirectly by getting involved in local initiatives, organizing awareness-raising event or directly.", "Conclusion", "The issue of corporal punishment in Vietnam presents complex challenges rooted in cultural norms, legal ambiguities, and societal attitudes. Despite existing laws prohibiting physical discipline, enforcement remains inadequate, leading to widespread acceptance and normalization of corporal punishment in homes and schools. The detrimental effects of corporal punishment on children's well-being urge the need for policy reforms that prioritize non-violent disciplinary practices and promote children's inherent rights.", "The proposed policy changes outlined in this paper offer tangible solutions to address the shortcomings of current legislation and effectively combat the issue of corporal punishment. Strengthening enforcement mechanisms, promoting positive parenting practices, enhancing support services, and incorporating children's voices in policy-making processes - These are essential steps towards creating a safer and more nurturing environment for Vietnamese youth.", "As we reflect on the implications of corporal punishment and its impact on children's lives, we are reminded of our collective responsibility to safeguard their rights and well-being. It is imperative that we stand united in our commitment to ending the cycle of violence and advocating for policies that prioritize children's safety, dignity, and future. Together, we have the power to create a society where every child in Vietnam (including us!!) can thrive free from the fear of violence and abuse.", "(havent finish updating the sources <3)"]}, {"slug": "reflections-on-yêu-cho-roi-cho-vọt-ghét-cho-ngọt-cho-bùi", "title": "Reflections on “Yêu cho roi cho vọt, ghét cho ngọt cho bùi”", "author": "Lucie Dang", "type": "Journal", "source": "LUCIE/Reflections on #U201cYe#U0302u cho roi cho vo#U0323t, ghe#U0301t cho ngo#U0323t cho bu#U0300i#U201d.docx", "paragraphs": ["Spare The Rod, Spoil The Child - The Parenting Norms", "Introduction", "In today’s world conversations about human rights and child welfare are gaining momentum, the persistence of corporal punishment norms in Vietnam stands as a stark contradiction. In Vietnam, nearly 70% of children have experienced violence at home from their parents and caregivers, ranking 27th out of 75 countries (UNICEF, 2023). For Vietnamese youth, corporal punishment isn't just a relic of the past; it's a lived experience that shapes their perceptions of authority, self-worth, and safety.", "Corporal punishment, defined as the use of physical force intended to cause pain or discomfort as a form of discipline or control, remains prevalent among parents and teachers. The norms “yêu cho roi cho vọt, ghét cho ngọt cho bùi” (\"spare the rod, spoil the child\") emphasizes that physical discipline is a necessary tool to foster discipline and respect in children. However, as we dive deeper into the repercussions of such practices, it becomes evident that this practice comes at the cost of children's physical and psychological well-being.", "This paper will analyze the issue of corporal punishment norms in Vietnam through the lens of children's rights. In addition to cultural and social aspects, the study will examine the existing legal framework governing corporal punishment and evaluate its effectiveness under the Children's Law of Vietnam. The aim is to illuminate the impact of these practices on Vietnamese youth and advocate for a shi
