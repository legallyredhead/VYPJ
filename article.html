t Cương Gián 1 primary school did not have sufficient staff who are well trained for psychological consultation, they are missing the consultation room and pointed out that another drawback was that students are shy and did not open themselves to seek psychological counseling. The last drawback seems to raise some questions. Children who attend primary school are still immature, they do not have the ability to comprehend nor notice subtle changes in their mental health - such as stress, depression, anxiety and the likes. It is near impossible to ask primary school students to open up for talks without reaching out to them first - which is difficult considering the number of students a teacher must manage as well as her/his knowledge of psychological health illness symptoms. Furthermore, it is important to note that there is the mention of the school’s ability to pay for consultants, training coaches or the construction of the counseling room - instead it simply states the school will provide a suitable amount of money to construct the service room. In addition, the school did not mention any solution relating to finding consultants outside of schools - which can be difficult but not impossible to not mention.", "Lastly, there are 5 cases of psychological consultation reported by Bình Xuân primary school in Tiền Giang - mainly circles around gender, age and family based consultation (Nguyễn Thị, 2021). Other activities mentioned in the reports were mainly awareness-raising for the whole school, but is insufficient compared to Cương Gián 1 primary school. The report of the number of staff for psychological counseling is even more alarming - There is only one teacher who is not carefully trained and is still unfamiliar with the consulting service. This further demonstrates the lack of attention the school paid for psychological counseling, and mainly implementing this circular for its sake. The future plans were also lacking details and consideration, as there is no mention of recruiting more staff or opening counseling rooms as well as creative implementation activities for awareness-raising, instead there are only mentions of adopting further documents, training for staffs, incorporating knowledge into subjects and a few activities for school gathering.", "From the data above, it proves that the actual implementation progress was met with many limits and reluctance, mainly regarding the lack of professionalism and uncooperative attitude between students and consultants. In the end, this raises a question considering what could have been better in the execution of this circular. After three years of implementation and the result was still underperformed and ineffective, it is possible that there could be more factors affecting the success of psychological consultation services, from a lack of qualified teachers and consultants, staff’s hesitance to taking in more tasks, staff’s teaching style and the ability to control a large group of students, related aspects of the education system such as study schedule, student number per classroom, workload to social issues such as family problems, prejudice and discrimination against mental illness. The major problem seen with the existing data is regarding staff’s availability, recruitment and training. Compared to the social norm, prejudice and hesitation that stems from students’ perspective, the problem of insufficient staff proved that investment and focus on it would be more realistic and effective for the long run. The implementation of psychological consultation services should be in chronological order: From recruiting staff, training staff members, opening counseling rooms to raising awareness through campaigns and educational means. Priorities must be set straight, it is not raising awareness that should be prioritized, it should have been training staff for the best consultation quality. The circular did not mention any specific orders - which is understandable considering educational centers were responsible for making detailed plans in which includes their own interpretation of orders of implementation steps, but still - the lack of proper guidelines and knowledge about implementing counseling services for students are affecting the outcome as well as attitude of the school’s management board towards the work. The government was responsible for making this clear - that it is important to have someone to listen to students’ needs and struggles to guide or heal them than only telling them that there can be danger. Furthermore, the government could have taken responsibilities to address other study quality issues to further push the process and achieve better outcomes - but it seems it will take time and effort to even notice such a situation.", "Critical Analysis", "This circular excels because it includes all relevant agencies and major players in providing psychological counseling services, including both public and private schools, school facilities, ministry, and specialized agencies. It also contains detailed guides and instructions on the responsibilities of each agency, including reports, organizing curriculum, training, observation and surveying, … More importantly, it included sending feedbacks and advice to the Ministry and the People’s Committee for changes and reassessment if needed, thus helps the Ministry of Education and Training to work closely with the current situation, quickly resolve problems that arise while also amend related legislation and guidelines to bring convenience and efficiency to all factors.", "However, the circular should include or mention any KPI criteria for a successful implementation, while reports could be made semi-annually for faster updates or placing pressure on making progress. It should also include cooperation between consultants and heads of schools to reassess school rules to adjust them based on the data gathered from surveys, therefore placing emphasis on the role of the school executive board in creating a safe environment for students as well as raising awareness of the importance of psychological consultation.", "Recommendations and Policy Alternatives", "To complement Circular 31, the Ministry of Education and Training or relevant organizations such as consulting agencies and schools should consider methods to reduce stereotyping or change the mindset of parents and the community in general such as open workshops, raise awareness outside of school, encourage student-led or teacher-led projects regarding psychological wellbeing. The Ministry could amend to include such methods in this circular for students to have the courage to seek psychological consultation services without facing discrimination or shame. In addition, the circular needs to address the issue of ensuring there are sufficient staff members from each school through methods such as having minimum requirements, open channels to connect to professionals, remodeling pay and remuneration policy for staff who work both as teacher and consultant (Golden Careers Việt Nam, 2022). Funds should also be established for building facilities or for finance purposes which place emphasis on investment in psychological consultation services in school, and related policies could include a part that specifies that it is highly recommended to cooperate with national and international organizations such as UNICEF or NGOs that place focus on the mental wellbeing of students.", "Conclusion", "In the end, Circular 31/2017/TT-BGDĐT was necessary to improve mental wellbeing for students across Vietnam, and it has been making moderate progress with specific guidelines of communication, major roles, requirements to implement the psychological consultation service in both public and private schools from all regions. Though there should be further amendments as well as investment to address in the circular to fully cover all aspects and issues that arise, the circular had been a game changer that can potentially reduces the crime, suicide and drug abuse rates in Vietnam by influencing students to pursue a healthier lifestyle and avoid negative mental effects from their daily life as well as study journey. It is of utmost importance to provide a secure and positive environment for Vietnamese students so that the younger generations can place their focus on studying more efficiently while also caring about their own mental state.", "References", "Báo Nhân Dân (2023). Để mỗi ngày đến trường là một ngày vui. [online] Báo Nhân Dân điện tử. Available at: https://nhandan.vn/de-moi-ngay-den-truong-la-mot-ngay-vui-post768017.html [Accessed 5 Feb. 2024].", "Bộ Giáo dục và Đào tạo (2021). Đẩy mạnh công tác xã hội, tư vấn học đường trong trường học. [online] moet.gov.vn. Available at: https://moet.gov.vn/tintuc/pages/tin-hoat-dong-cua-bo.aspx?ItemID=7684 [Accessed 5 Feb. 2024].", "Bộ Giáo dục và Đào tạo (2022). Quyết Định: Phê duyệt Sổ tay hướng dẫn tư vấn tâm lý cho học sinh phổ thông. doi:https://doi.org/4216.", "Đặng, C.C. (2021). BÁO CÁO SƠ KẾT Thực hiện Thông tư số 33/2018/TT-BGDĐT ngày 26/12/2018 của Bộ trưởng Bộ GDĐT về hướng dẫn công tác xã hội trong trường học và Thông tư số 31/2017/TT-BGDĐT ngày 18/12/2017 về việc hướng dẫn thực hiện công tác tư vấn tâm lý cho học sinh trong trường phổ thông. [online] Trường THCS Minh Lập. Available at: http://thcsminhlap.donghy.edu.vn/ke-hoach-giao-duc/ke-hoach-cong-tac/bao-cao-so-ket-thuc-hien-thong-tu-so-33-2018-tt-bgddt-ngay-2.html [Accessed 21 Feb. 2024].", "Đào, L.T. (2021). Hội nghị sơ kết ba năm thực hiện Thông tư 31/2017/TT-BGDĐT và Thông tư số 33/2018/TT-BGDĐT. [online] National University of Art Education. Available at: http://www.spnttw.edu.vn/articledetail.aspx?articleid=27321&sitepageid=624 [Accessed 5 Feb. 2024].", "Golden Careers Việt Nam (2022). 4 cách tìm kiếm được nhân sự giỏi cho HR. [online] Golden Careers Việt Nam. Available at: https://goldencareers.vn/4-cach-tim-kiem-duoc-nhan-su-gioi-cho-hr-n1499.html [Accessed 5 1%BB%A9u-v%E1%BB%81-s%E1%BB%A9c-kh%E1%BB%8Fe-t%C3%A2m-th%E1%BA%A7n-v%C3%A0-t%C3%A2m-l%C3%BD-x%C3%A3-h%E1%BB%99i-c%E1%BB%A7a-tr%E1%BA%BB-em-v%C3%A0-thanh-ni%C3%AAn-t%E1%BA%A1i-vi%E1%BB%87t [Accessed 25 Jan. 2024].", "UNICEF Việt Nam (2018b). Sức khỏe tâm thần và tâm lý xã hội của trẻ em và thanh niên tại một số tỉnh và thành phố ở Việt Nam. [online] Available at: https://www.unicef.org/vietnam/media/1016/file/B%C3%A1o%20c%C3%A1o%20t%C3%B3m%20t%E1%BA%AFt.pdf [Accessed 5 Feb. 2024].", "UNICEF Việt Nam (2022a). NGHIÊN CỨU TOÀN DIỆN VỀ CÁC YẾU TỐ LIÊN QUAN ĐẾN TRƯỜNG HỌC ẢNH HƯỞNG ĐẾN SỨC KHỎE TÂM THẦN VÀ SỰ PHÁT TRIỂN TOÀN DIỆN CỦA TRẺ EM NAM VÀ NỮ VỊ THÀNH NIÊN TẠI VIỆT NAM Bản tóm tắt nghiên cứu NGHIÊN CỨU TOÀN DIỆN VỀ CÁC YẾU TỐ LIÊN QUAN ĐẾN TRƯỜNG HỌC ẢNH HƯỞNG ĐẾN SỨC KHỎE TÂM THẦN VÀ SỰ PHÁT TRIỂN TOÀN DIỆN CỦA TRẺ EM NAM VÀ NỮ VỊ THÀNH NIÊN TẠI VIỆT NAM.", "UNICEF Việt Nam (2022b). TÁC ĐỘNG CỦA TRƯỜNG HỌC TỚI SỨC KHỎE TÂM THẦN VÀ SỰ PHÁT TRIỂN TOÀN DIỆN CỦA THANH THIẾU NIÊN TẠI VIỆT NAM. [online] UNICEF Việt Nam. Available at: https://www.unicef.org/vietnam/media/9781/file/B%C3%A1o%20c%C3%A1o%20t%C3%B3m%20t%E1%BA%AFt%20ch%C3%ADnh%20s%C3%A1ch:%20T%C3%A1c%20%C4%91%E1%BB%99ng%20c%E1%BB%A7a%20tr%C6%B0%E1%BB%9Dng%20h%E1%BB%8Dc%20t%E1%BB%9Bi%20s%E1%BB%A9c%20kh%E1%BB%8Fe%20t%C3%A2m%20th%E1%BA%A7n%20v%C3%A0%20s%E1%BB%B1%20ph%C3%A1t%20tri%E1%BB%83n%20to%C3%A0n%20di%E1%BB%87n%20c%E1%BB%A7a%20thanh%20thi%E1%BA%BFu%20ni%C3%AAn%20t%E1%BA%A1i%20Vi%E1%BB%87t%20Nam.pdf [Accessed 5 Feb. 2024]", "Vietnam's youth are grappling with a silent crisis. Shockingly high rates of child abuse, coupled with a hyper-competitive education system, are fueling a surge in stress, anxiety, and depression among students. While the government acknowledges a mental health crisis, affecting an estimated 15-30% of the population, its response has been notably inadequate. The implementation of Circular 31/2017/TT-BGDĐT, aimed at bolstering these services, reveals significant shortcomings. According to a UNICEF study, approximately 26% of students face a moderate to high risk of mental health issues, yet many do not receive the necessary support, largely due to social stigma and a lack of resources.", "The crisis is exacerbated by gender disparities, with girls more likely to experience emotional problems like anxiety and depression, and boys more prone to behavioral disorders. Suicidal thoughts are alarmingly common, with 21.4% of girls and 7.9% of boys contemplating suicide, and about 5.8% attempting it. These statistics highlight the inadequacy of the current school-based mental health frameworks to effectively address the needs of the student population. The academic environment in Vietnam contributes to the stress, emphasizing performance over well-being and offering few outlets like arts or sports. Students often feel disconnected from their school environment, which correlates with higher rates of mental health problems.", "This VYPJ piece then critiques the circular's implementation, noting the lack of specific performance indicators and the need for a more robust approach involving all educational stakeholders. It calls for a \"stepped-care\" model to improve early detection and intervention, integrating mental health literacy and services into the school system more effectively.nThis piece sheds light on the systemic changes needed to better support the mental well-being of Vietnam's youth, urging for enhanced collaboration across educational, health, and social sectors."]}, {"slug": "talent-acquisition-policies-what-is-vietnam-going-to-do-with", "title": "Talent Acquisition Policies: What is Vietnam going to do with its ever-growing number of talented youth?", "author": "Xuân", "type": "Journal", "source": "Xua#U0302n/Xua#U0302n - VYPJ - Chi#U0301nh sa#U0301ch thu hu#U0301t nha#U0302n ta#U0300i + Co#U0302ng ta#U0301c tu#U031b va#U0302#U0301n ta#U0302m ly#U0301 ho#U0323c #U0111u#U031bo#U031b#U0300ng.docx", "paragraphs": ["Chính sách thu hút nhân tài", "Title", "Talent Acquisition Policies - What is Vietnam going to do with its ever-growing number of talented youth?", "Abstract (Optional)", "If included, the abstract should offer a brief summary of the key arguments, insights, and conclusions of your paper, not exceeding 150 words.", "Introduction", "People might have heard about talent acquisition policies of companies or other countries when they prepare to study abroad or working in a new company.", "Talent Acquisition in their eyes may look like this: Scholarships, Competition, Sponsors, Investments, Promotion", "Students always wonder what would the school give us, what are their Talent Acquisition policies, …", "Have you ever wondered about how the Vietnamese government finds and trains their talented people? What policies are there to support talented students and researchers? Why is it important to find talented people on the governmental scale?", "BG of the policy:", "Chính sách thu hút nhân tài là gì?", "Talent Acquisition policies are regulations that are published to attract talented young minds for: 1, Contributing to the country’s public services, giving everyone a chance to achieve personal and professional development. 2, Compete and/or integrate in the global market (such as RnD, inventions, strategies, …) 3, Ensure that the next leaders of the young generations will be promising through training, nurturing strong will and earn opportunities to lead and develop the country.", "Factors that make up a Talent Acquisition Policy:", "Working environment: Working conditions, equipment, facilities, specific environmental elements such as noise, light, policies such as guidance, appreciation and empowerment, pressure, choice, challenges, opportunities … This could affect: Satisfaction, achieve flow in work, comfortable in workspace, Positivity in work, empowerment and motivation to keep working → Psychological climate to feel safe and comfortable.", "Remuneration: Pay system, can differ to give uniqueness, can determine job attractiveness, convey information about the organization’s values, culture, philosophy, …", "Rewards: To enforce employment relationships, retain employees. Including employees benefit (assets, security, insurance, medical offers), performance and financial recognition (Cash bonus, enforce individualism and independence for motivation)", "Training: Beneficial for personal and professional development. Offer access to training for organizational (and even national) growth → Improvements, engage in career challenges, increase retention rate.", "Career advancement: Planning to maintain skills in the market, flexibility in job and life options.", "Significance", "The case in Vietnam is simply too obvious: Brain drain, talented people are all going out abroad, while those who stayed do not live up to expectations (such as being lazy, corrupted, …) → The Talent Acquisition policies are important to retain talented students and high-skills workers in the country while also provide trainings for skills that are suitable and can benefit the country", "Why isn’t it working for Vietnam? The decrees are not being institutionalized, not synchronized and not suitable for all regions and the condition of each institute. To focus on earning degrees (bachelor, master, PhD), examinations are not suitable and focusing too much on theories rather than critical thinking, adaptability and professional skills. The jobs that talented people receive are not according to their profession and skills, and expected them to be good leaders (when they actually are not) and did not give them the remuneration they desire. Payment system is not suitable because they are for office workers and not consultants or professionals → Unable to keep up with the daily need, no motivation made, many moved to private sectors. Working conditions are too poor or insufficient for research programs and creativity, and not flexible enough → Unproductive, not cooperating, resign.", "Những chính sách của nước ngoài hấp dẫn hơn chính sách Việt Nam ở điểm nào? Basically more open tbh.", "Liệu vấn đề có nằm ở chính sách không? Hay còn ở những yếu tố chưa nói đến? Example: Market, Mindset, Morality, Trend of youth, Education, Parent Influence, …", "Thesis Statement", "Nghị định 140/2017/NĐ-CP → Tìm hiểu về những điểm mạnh và yếu của nghị định này và nêu recommendation.", "Policy Overview or Issue Overview", "In-depth explanation of the policy:", "Decree No. 140/2017/NĐ-CP on the 5/12/2017: Policies of attracting excellent students and young scientists.", "Objective", "Strategies", "Results", "Development", "Area: Public Sector", "Subject: Graduated students from university, Master graduates, doctor level 1, pharmacist level 1 (16 - 30 yrs old) OR PhD degree or doctor level 2, pharmacist level 2 (<35 yrs old)", "Requirements: (1) Individual third prize or higher at one of the provincial excellent student selection exams; won an encouraging prize or higher in national excellent student selection exams in one of the natural sciences (math, physics, chemistry, biology, informatics) and social sciences (literature, history, geography, foreign languages) in high school period; (2) Individual third prize at a national or international science technology competition in high school or university period; (3) Individual third prize at the Olympic contest in one of the mathematics, physics, chemistry, mechanics, computer science or other subjects while studying at the university level, recognized by the Ministry of Education and Training (for 16 - 30) AND (1) Individual third prize or higher as mentioned above; (2) Graduated from a university with good or higher degree and majoring in postgraduate training with the same major of undergraduate education (for Master graduates, doctor level 1, pharmacist level 1 and for <35 yrs old)", "Principles: Synchronized, transparent, legitimate, using payrolls that are not yet in use to attract students (should be in accordance to their profession)", "Điều 4, 5: Nhà trường/ cơ sở giáo dục đại học and public offices phối hợp với bộ → Make the list of eligible students,", "Impact on Youth", "Immediate impacts", "Long-term impacts", "Resonates with Vietnamese society", "Critical Analysis and Personal Commentary (Most important)", "Compare and contrast:", "America:", "Luật nhập cư: Xác minh có trình độ cao → Được cấp visa lao động tạm thời", "Nới lỏng việc yêu cầu người đang chờ xét duyệt đăng ký thẻ xanh phải chịu bó buộc trong công việc hiện tại.", "Chấm dứt những quy trình nghiêm ngặt với người lao động, linh hoạt tạo cơ hội cho sinh viên nước ngoài có việc làm/ ở lại Mỹ.", "Xóa khoản vay sinh viên", "Europe", "Thụy Sĩ: Cân bằng hệ thống giáo dục chất lượng cao tạo nguồn sinh viên đầu vào xuất sắc cho các trường đào tạo, chất lượng đời sống cao, chế độ đãi ngộ - phúc lợi tuyệt vời.", "Đan Mạch: Thành tích nổi trội trên các lĩnh vực kinh tế - xã hội, nhận thức sự công bằng.", "Luxembourg: Duy trì phát triển bền vững, tổng chi tiêu công cho giáo dục trên mỗi học sinh và chất lượng giáo dục tiểu học đứng đầu thế giới.", "Korea", "Không tập trung dàn trải, phát triển 1 lĩnh vực trọng điểm có tiềm năng, có khả năng tương hỗ tích cực cho các lĩnh vực khác", "Quan tâm chiến lược phát triển giáo dục.", "Chính sách tài trợ học bổng cho sinh viên nước ngoài vào làm việc tại Hàn Quốc", "Cấp thẻ vàng cho nhà khoa học trẻ nước ngoài làm việc tại Hàn (ưu đãi trả lương cao, hỗ trợ phương tiện di chuyển, …", "Trí thức trẻ có chính sách hỗ trợ kinh phí về đào tạo nâng cao trình độ, cải thiện điều kiện sinh hoạt (qua vay với lãi suất ưu đãi)", "Bồi dưỡng 10 nhà khoa học xuất sắc nhất để đoạt giải Nobel.", "Singapore", "Tuyển nhân tài dựa trên năng lực, khả năng đóng góp, tầm nhìn, khả năng phát triển trong tương lai.", "Quỹ lương cao hơn tất cả các bộ trưởng ở những quốc gia khác", "Kiểm soát chặt chẽ thu nhập đội ngũ công chức", "Công chức trẻ có triển vọng → Phân công quản lý lĩnh vực kỹ thuật chuyên trách, sau đó luân chuyển sang vị trí quản lý cấp cao hơn để có tầm vĩ mô nhà nước.", "China", "Dựa theo yêu cầu về trách nhiệm nghề nghiệp, năng lực thực tế và tiềm năng phát triển, sau đó mới là năng lực và thành tích → Khắc phục việc coi trọng bằng cấp.", "Điều phối hài hòa chính sách cán bộ, cải cách hệ thống tiền lương, kiện toàn chính sách khuyến khích (ưu đãi lương, chức vụ, phúc lợi)", "Đầu tư cho viện nghiên cứu, trường học, y tế công cộng", "Chuẩn hóa hoạt động hành chính, giảm thiểu thủ tục hành chính và lệ phí.", "Lập nhiều kế hoạch tạo cơ hội cho người tài (hoặc mời người tài về nước), đầu tư vào dự án phát minh/ khoa học", "Offer lương cao hơn cho những nhân tài là đồng bào Hoa kiều ở nước ngoài.", "Strength", "Weakness", "Application if Vietnam decided to implement it", "GTCI: (1) Attract (Thu hút nhân tài) thể hiện khả năng thu hút các nguồn lực nước ngoài có giá trị như FDI và người nhập cư tay nghề cao; (2) Grow (Phát triển nhân tài) phản ánh khả năng cung cấp nền giáo dục chất lượng cao, các chương trình thực tập và cơ hội phát triển để mở rộng năng lực toàn cầu của nhân tài; (3) Retain (Giữ chân nhân tài) cho thấy khả năng khuyến khích nhân tài phát huy hết khả năng và tiềm năng, đồng thời giữ chân họ làm việc trong nước; (4) Enable (Tạo điều kiện thuận lợi cho nhân tài) liên quan đến các điều kiện về pháp lý, thị trường lao động trong một quốc gia tạo thuận lợi cho nhân tài phát triển; (5) VT skills (Kỹ năng kỹ thuật và đào tạo nghề) là nhóm kỹ năng về kỹ thuật và đào tạo nghề; (6) GK Skills (Kỹ năng tri thức toàn cầu) là nhóm kỹ năng mềm như sáng tạo và giải quyết vấn đề.", "Bảng xếp hạng Nhân tài Thế giới: bao gồm “Đầu tư và phát triển nhân tài” (Investment and development), “Thu hút và giữ chân nhân tài” (Appeal) và “Mức độ sẵn sàng về nhân tài” (Readiness).", "Insights:", "Recommendations and Policy Alternatives", "What should Vietnam change in its policies", "Tạo cơ hội cho sinh viên trong nước có việc làm ngay ở những lĩnh vực nặng về trí thức như: Kinh doanh, quản lý, khoa học, tạo cơ hội và nới lỏng quy định nghiêm ngặt với người lao động trẻ/ từ nước ngoài về.", "Cải cách, thay đổi những mặt liên quan đến tài chính như: Khoản vay sinh viên,", "Tập trung vào cải thiện và chi tiêu đầu tư cho giáo dục và đào tạo cũng như có chiến lược thực tế về cải thiện giáo dục → Học tập giáo án và nền giáo dục nước ngoài để đem tới cho giới trẻ Việt Nam nhiều cơ hội trải nghiệm ngành nghề, định hướng tài năng và tương lai hơn → Đào tạo chuyên sâu vào 1 lĩnh vực để rèn cho tốt nhân lực của lĩnh vực đó. Đầu tư vào không chỉ cơ sở vật chất mà còn trui rèn đội ngũ giáo viên, xây dựng tủ sách, cung cấp dụng cụ và tài liệu học tập, mở rộng cho nhiều chương trình trải nghiệm, …", "Cải thiện chất lượng đời sống của Việt Nam → 1, Đặt ra chỉ tiêu và giá trị mà xã hội theo đuổi, tuyên truyền những giá trị đạo đức tốt và có lợi lâu dài. 2, Giải quyết tệ nạn xã hội, nâng cao sự an toàn và đảm bảo sức khỏe cho người dân. 3, Đẩy mạnh về bảo hiểm, giảm khoảng cách giàu nghèo và phân chia tầng lớp.", "Có nhiều chế độ đãi ngộ, phúc lợi tốt cho nhân tài kể cả trong nước và ngoài nước,", "Đẩy mạnh phát triển một vài lĩnh vực nhiều tiềm năng như: Du lịch, kinh doanh, quản lý, tài chính, … Và tập trung khai thác, thu hút, đào tạo nguồn lực nhân tài trẻ cho những lĩnh vực đó qua học bổng, hỗ trợ học phí/ chi phí chi tiêu", "Bồi dưỡng và đặt mục tiêu cho nhóm nhân tài ưu tú nhất của quốc gia, đặt mục tiêu đoạt giải lớn, thúc đầy phát triển dự án lớn hoặc đầu tư để những dự án đấy thành sự thực", "Có tiêu chí tuyển chọn và đào tạo nhân tài phù hợp với thời thế và nhu cầu thị trường: Người Việt Nam thường bị chê là không nhìn xa trông rộng mà chỉ quan tâm đến lợi nhuận trước mắt → Đặt ra tiêu chí để vừa rèn những thế hệ tiếp theo những giá trị tốt mà vừa tìm được người tài có khả năng đổi mới phát triển đất nước (Tìm kiếm những kỹ năm mềm quan trọng như: Tham vọng lớn, có khả năng đóng góp lớn, có tiềm năng phát triển, committed to the job, …)", "ĐẶC BIỆT đầu tư cho cơ sở vật chất cũng như hệ thống tiền lương của các cơ sở khoa học → Mở rộng nhiều cơ hội có dự án nghiên cứu tốt, nhân viên và các nhà khoa học tài năng được trả tiền lương và có động lực thúc đẩy cống hiến.", "Kêu gọi các doanh nghiệp lớn offer lương cao hơn cho nhân tài Việt kiều từ nước ngoài về.", "Giảm thiểu thủ tục hành chính, chi phí không nhất thiết để giúp các dự án và các cơ hội đến nhanh hơn cho nhân tài trẻ.", "What should Vietnam implement to address the need and want from talented youth?", "Conclusion", "Main arguments", "Final thoughts, rhetoric question", "References", "All sources cited in your paper must be meticulously documented, following a recognized citation style.", "1, Thu hút nhân tài là gì? Chính sách đãi ngộ nhân tài của Nhà nước?", "2, Chính sách thu hút, trọng dụng cán bộ từ trí thức trẻ qua lăng kính của một số quốc gia và kinh nghiệm đối với Việt Nam", "3, Kinh nghiệm thu hút, trọng dụng nhân tài của một số nước – Bài học tham khảo cho Việt Nam", "4, Việt Nam nhiều nhân tài nhưng sao đất nước vẫn chưa giàu? | Báo Dân trí", "5, Chất lượng cuộc sống là gì và tiêu chí đánh giá ra sao?", "6, TALENT ACQUISITION IN PUBLIC SECTOR: A CASE STUDY OF HO CHI MINH CITY", "7, Nghị định 40/2014/NĐ-CP sử dụng trọng dụng cá nhân hoạt động khoa học công nghệ mới nhất", "8, Chế độ chính sách đối với học sinh, sinh viên năm 2022", "9, Thực trạng và giải pháp chính sách thu hút, trọng dụng nhân tài trong khu vực công", "Appendices (If Necessary)", "Include any supplementary materials such as extended data, graphs, or relevant documents in this section.", "Công tác tư vấn tâm lý học đường", "Title", "What is holding back the success of psychological consultation in Vietnam?", "Abstract (Optional)", "If included, the abstract should offer a brief summary of the key arguments, insights, and conclusions of your paper, not exceeding 150 words.", "Introduction", "Current situation: Stereotyping, schools lacking a psychological consultation department, avoidance of psychological consultation (Statistics required)", "Why is it such a case? What factors contribute to said trend? *Research", "BG of the policy:", "Circular 31/2017/TT-BGDĐT 18/12/2017", "Context: The significance of psychological consultation (especially after Covid 19) for highschool students.", "To address what?", "Significance", "What has changed?", "Is it up-to-date?", "How DID it affect Vietnamese youth?", "How WILL it affect Vietnamese youth?", "Thesis Statement", "Analyze and point out what this circular didn’t address and recommendations.", "Policy Overview or Issue Overview", "In-depth explanation of the policy:", "Objective", "Avoid, aid and intervene (if needed) for students who are troubled with mental issues while studying and in life → Resolve issues and reduce the effect of such issues to create a safe education environment.", "Train and teach student life skills, strong will, have confidence and bravery as well as suitable behavior in social connections and have a better mental and physical health → Personal growth.", "Increase activity in psychological consultation in Vietnamese schools, aim to provide beneficial and positive consultation accessible for all students.", "Strategies", "Schools (Esp Head of School): Establish Consultation department, set out rules and system to provide service for students. Survey and analyze data of psychological issues/ concerns from students to observe, follow and update. Conclude and report to head departments on a regular period.", "Facilities: Implement this circular in all schools under the control. Instruct, check up and observe the progress. Research, advise People’s Committee about relevant policies to aid and motivate consultants and teachers providing the service with consideration to the financial and social condition of the region. Open training for consultants and teachers, and communicate between higher ups and the schools under supervision.", "Ministry of Education and Training: Cooperate with relevant agencies to implement, monitor and check up this circular in facilities, earn reports and organize training and certificates for teachers and consultants. Integrate information regarding psychological consultation into the curriculum and activities of schools and facilities.", "Facilities specialized in training psychological consultation: Survey and organize training plans and curriculum to address the need in the region/ facility. Create necessary documents and provide certificates for teachers and consultants who met the requirements.", "Results", "Some schools do not have sufficient staff members who are well trained.", "Students are still holding back because they avoid meeting teachers who teach them in class.", "Policy mechanisms are not satisfactory", "Did not acknowledge the importance of psychological consultation → Some students receive help later than expected.", "Service room are not suitable or not provided", "Lacking documents, handbooks, guidelines.", "22/12/2021 - 3 years after implementing Circular 31 and 33. 40/53 regions (75%) raised written plans to implement circular 31. 35/53 regions (66%) divided works to teachers to organize psychological consultation service, 28/53 (52%) built and incorporated policy framework for teachers and consultants (including reducing teaching hours for teachers who do both)", "Development", "Circular 33/2018 → Instruction for social activities in schools.", "Cooperate with UNICEF, GNI, RtR, Bộ lao động thương binh, trung ương đoàn thanh niên cộng sản HCm, …", "Psychological consultation for highschool student handbooks by famous doctors like Trần Thành Nam.", "June 2023: Successfully organized training on using documents and skills for psychological consultants (Focus mainly on Self-harm behavior and prevention)", "Include hotline 111 for Children Protection and website of the facilities.", "Established groups for consultation services, intertwined into extracurricular lessons, community gathering that teaches knowledge and skills.", "Impact on Youth", "Immediate impacts:", "Provided accessible consultation service to help students feel safer while studying and being at school", "Specialized in preventing bullies or self harm behavior, helping students to get through trauma and reintegrate back into their school life.", "Teach new soft skills, attention skills, independence , strong will, …", "ON THE OTHER HAND, WITHOUT THIS CIRCULAR:", "Schools that do not know how to implement psychological consultation service → cannot address the need of students and parents, find trouble in dealing with mental issues or bullies/ suicide.", "Prolonging the issue of long-term depression, affecting youth in learning/ focusing/ absorbing knowledge.", "Long-term impacts", "Create a safe environment for schools → Student feel safe studying", "Avoid and prevent harmful behaviors at school, reduce suicide, depression and bully rates for later generations.", "Raise awareness about the importance of psychological consultation in school", "ON THE OTHER HAND:", "The environment without the service is not suitable for learning", "Suicide rates/ crime rate/ … will not get affected and thus harder to resolve.", "Cannot raise awareness → People will stereotype people seeking psychological consultation services as being crazy/ having severe mental issues OR do not consider it to be important → Avoid addressing heavy mental issues which later affect students’ life.", "Resonates with Vietnamese society", "Help to reduce crime rate/ suicide rate/ drug usage rate in society.", "Increase productivity in learning (Because students now can get help when dealing with mental issues → Have the right mind to study and contribute to society)", "Raise awareness about mental wellbeing.", "Critical Analysis and Personal Commentary (Most important)", "Strength", "Include all relevant agency/ major players - Schools, School facilities, Ministry, specialized agency.", "Detailed guides and instructions on the responsibilities of each agency, including reports, organizing curriculum, training, observation and surveying, …", "Included sending advice to the Ministry and the People’s Committee for changes and reassessment if needed", "Weakness", "Should include KPI/ criteria for a successful implementation", "Reports could be semi-annually → faster updates, placing pressure on making progress.", "Should include cooperation between consultants and heads of schools to reassess school rules to adjust the rules based on the data gathered from surveys → place emphasis on the role of the school management board in creating a safe environment for students as well as raising awareness in the importance of psychological consultation.", "Insights:", "If there’s anything that they could do to reduce stereotyping or change the mindset of parents and the community in general (such as open workshops, raise awareness outside of school, encourage student-led projects regarding psychological wellbeing) → include in this circular to encourage students to have the courage to seek psychological consultation services without facing discrimination or shame.", "Might need to include something related to ensuring there is sufficient staff member from each school to become consultants", "Recommendations and Policy Alternatives", "What should Vietnam change in its policies", "Could have an extra fund for building facilities or for finance → Place emphasis on investment in psychological consultation services in school", "Include a specific part dedicated to raising awareness through different means, not only integrate knowledge into curriculum but also encourage student led groups, psychology consultation projects led by teachers and officials who take on the role, …", "Could include a part that specifically says that it is encouraged to cooperate with national/ international organizations such as UNICEF or NGOs that place focus on the mental wellbeing of students.", "Conclusion", "Main arguments", "Final thoughts, rhetoric question", "References", "All sources cited in your paper must be meticulously documented, following a recognized citation style.", "Appendices (If Necessary)", "Include any supplementary materials such as extended data, graphs, or relevant documents in this section.", "1, NGHIÊN CỨU TOÀN DIỆN VỀ CÁC YẾU TỐ LIÊN QUAN ĐẾN TRƯỜNG HỌC ẢNH HƯỞNG ĐẾN SỨC KHỎE TÂM THẦN", "2, Điều gì gây cản trở hoạt động tư vấn tâm lý học đường?", "3, Thông tư 31/2017/TT-BGDĐT hướng dẫn công tác tư vấn tâm lý cho học sinh trường phổ thông mới nhất", "4, file:///G:/Downloads/qd-4216 phe-duyet-so-tay-tvtl bgddt.pdf", "5, Đẩy mạnh công tác xã hội, tư vấn học đường trong trường học", "6. Hội nghị sơ kết ba năm thực hiện Thông tư 31/2017/TT-BGDĐT và Thông tư số 33/2018/TT-BGDĐT", "7, Để mỗi ngày đến trường là một ngày vui"]}];</script><script src="app.js"></script></body></html>
