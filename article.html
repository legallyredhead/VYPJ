l punishment. There is also a glaring absence of adequate education and training on positive parenting practices and non-violent disciplinary techniques for parents and caregivers. Without such education, they may continue to rely on corporal discipline as a method of behavior correction. Additionally, the lackluster education system contributes to children not reporting instances of corporal punishment, hence many incidents may go unreported or be culturally justified, thereby hindering efforts to effectively address the issue.", "Policy Recommendations", "To effectively address the deficiencies in current policies and combat the issue of corporal punishment in Vietnam, a comprehensive set of innovative and practical policy recommendations is essential:", "Strengthen legal frameworks by enacting comprehensive legislation explicitly prohibiting corporal punishment in all settings. Clear and unequivocal guidance on the rights and protection of children against all forms of violence is indispensable for ensuring their safety and well-being.", "Strengthen enforcement mechanisms to ensure compliance with existing laws prohibiting corporal punishment. This entails implementing regular monitoring and supervision protocols in schools and households to detect and address instances of physical discipline promptly.", "Promote positive discipline practices. This involves developing and disseminating guidelines and training programs for parents, educators, and caregivers on non-violent disciplinary techniques. This can help shift societal norms towards more compassionate and effective approaches to discipline.", "Enhance support services for families at risk of resorting to corporal punishment. Expanding access to counseling, support groups, or at least contact information to equip paảents and children with the necessary skills and reéources.", "Incorporate children's voices into policy-making processes. Ensuring children's active participation in decisions related to policies D: Sexual Abuse: When Legal Prejudices Leave Children Behind", "FINDING AN IDEAL VICTIMS", "A United Nations study on gender stereotypes in the laws and court decisions in Southeast Asia notes that misconceptions about who a \"real\" or \"ideal\" victim is worsen criminal justice officers' perceptions of how an \"ideal\" victim should behave. For instance, findings from Vietnam show that criminal justice officers believe a \"real\" victim needs to show extreme fear, helplessness, or terror or have a state of panic. A victim who recounts their abuse calmly or coldly is not seen as behaving appropriately and their story might be considered unreliable.", "In Vietnam, this narrative of finding the “right” victim is especially problematic when it comes to cases involving young boys. This oversight stems from entrenched gender stereotypes that paint men as the strong, active participants in sexual activity, thereby making it harder for boys to disclose abuse. This stigma is further compounded by societal taboos surrounding same-sex relations, especially in cultures where homosexuality is frowned upon.", "Boys sexually abused by women might remain silent due to the societal belief that men cannot be victims. When boys are abused by men, the situation becomes even more complex due to the prevailing misconceptions about same-sex relations. These stereotypes not only force boys into silence but also lead to less sympathy and support compared to female victims.", "Therefore, it is essential to review and revise laws to recognize all victims of abuse, regardless of gender by setting specific definitions. All victims are victims, and their experiences and behaviors in the aftermath of abuse should not be judged based on preconceived notions of what an \"ideal\" victim looks like.", "ABANDONED VICTIMS", "The child protection system in Vietnam is riddled with inadequacies. Minister of Public Security To Lam, during a National Assembly session in June 2018, proposed a special handling process for child sexual abuse cases. Yet, no concrete solution has been implemented. This lack of action leaves many victims feeling abandoned by the very system meant to protect them.", "The dropout rate at the reporting stage is alarmingly high. Victims often face multiple recounts of their traumatic experiences, disrespectful treatment, and a lack of sensitivity from authorities. Dropout can occur at various stages of the criminal justice process: reporting, investigation, prosecution, and trial. The dropout rate at the reporting and initial contact stage is very high. Many victims are abandoned and “encouraged” towards reconciliation or other forms of resolution outside of formal judicial procedures. Victims often have to recount their story multiple times and are treated disrespectfully and insensitively, even though sexual abuse is one of the most severe physical and psychological violations against children.", "If the family chooses to report the case to the police and pursue the criminal justice process (investigation, prosecution, and trial), the child will have to recount their story multiple times, each time potentially reliving the traumatic events, thus becoming a victim again. Girls/female victims may be subjected to multiple rigorous, invasive, and disrespectful physical examinations.", "It is essential to apply appropriate and flexible measures, taking into account all aspects to protect the rights of children. Victims should have the right to refuse requests for questioning, taking statements, or direct contact or confrontation with the suspect, or any other person representing the suspect.", "A case is dismissed when authorities decide not to pursue it, and it is deemed non-existent if the police fail to seriously investigate, cannot identify the suspect, or if the victim withdraws their complaint. In assessing voluntary withdrawal from victims, it is crucial to recognize that early negative assessments by the police about prosecution challenges can discourage victims. This indicates a need for systemic reforms to ensure that all reported cases of abuse are thoroughly investigated and pursued without bias. To address this, law enforcement and prosecutorial bodies must adopt more supportive approaches, with enhanced training for officials and improved support systems for victims. There should also be investigation relating to early case dismissals and premature withdrawals.", "Another unreasonable aspect of criminal investigation of child sexual abuse cases in Vietnam is the rigid application of the principle of evidence over testimony, due to stereotypes about age and the truthfulness of children’s statements, without considering psychological factors, methods, and the child's rights during evidence provision. This results in cases with weak evidence often ending in suspended sentences to avoid large compensation claims for wrongful imprisonment, or lighter sentences within the lowest penalty range.", "FAILS OF CHILD PROTECTION AGENCY", "Vietnam’s child protection framework involves 15 different agencies and organizations, from the People's Courts to the Ho Chi Minh Communist Youth Union. Despite this extensive network, the system often fails to provide adequate protection for children. Policies intended to protect children are frequently seen as mere programs chasing annual targets rather than providing sustainable solutions.", "A child protection system is essential not just for addressing current cases but also for preventing future abuse. The 2015 and 2017 amendments to the Penal Code have been steps in the right direction, but continuous adjustments are needed to ensure that the law effectively protects all children. Society's assumptions can be flawed. Public anger can quickly shift to new cases. The measures of justice standards can be skewed. Only the trauma remains with the victims.", "SOURCE", "Song, N. (2018, September 4). Nhân viên bể bơi sờ ngực bé gái: “Tôi chỉ coi cháu như cháu ngoại tôi thôi.” Retrieved from Soha.vn website: http://soha.vn/nhan-vien-be-boi-so-nguc-be-gai-toi-chi-coi-chau-nhu-chau-ngoai-toi-thoi-20180905001127227rf20180905001127227.htm?ref=luatkhoa.com", "tiengchuong.chinhphu.vn. (2018, March 22). Những quan điểm không đúng về hiếp dâm. Retrieved from tiengchuong.chinhphu.vn website: http://tiengchuong.vn/Utilities/PrintView.aspx?id=26983&ref=luatkhoa.com", "TÙNG, T. (2017, March 17). Trị tội ấu dâm: Cần quy trình đặc biệt. Retrieved from Báo Pháp Luật TP. Hồ Chí Minh website: https://plo.vn/phap-luat/tri-toi-au-dam-can-quy-trinh-dac-biet-689519.html?ref=luatkhoa.com", "VnExpress. (2018, June 5). Bộ trưởng Công an đề xuất quy trình đặc biệt xử lý tội phạm xâm hại trẻ em. Retrieved from vnexpress.net website: https://vnexpress.net/phap-luat/bo-truong-cong-an-de-xuat-quy-trinh-dac-biet-xu-ly-toi-pham-xam-hai-tre-em-3759400.html?ref=luatkhoa.com"]}, {"slug": "myth-vs-reality-unpacking-the-us-china-trade-war-s-impact-on", "title": "Myth vs. Reality: Unpacking the US-China Trade War’s Impact on Local Economies", "author": "Trang Linh", "type": "Journal", "source": "TRANG LINH/Myth vs. Reality_ Unpacking the US-China Trade War_s Impact on Local Economies.docx", "paragraphs": ["Trade liberalization is generally argued to lead to both an improvement in economic efficiency when countries concentrate on their comparative advantages and to a rise in overall growth as the size of the market expands, evidently through relative price changes and corresponding increases in real wages for consumers (Muendler, 2017).", "Yet, in February 2018, the United States issued massive trade restrictions towards China, its biggest trading partner, with the pretext of softening the trade deficits - an uncharacteristic protectionist policy that goes against the commonplace benefits of trade liberalization.", "This unprecedented trade action raised many questions. How has the U.S. economy been hurt, especially in Chinese-reliant industries like manufacturing and high-tech? How have these impacts translated for average consumers, as reflected in their real wages and inflation levels. How this translated into like impacts for normal consumers, reflected in their real wages, inflation levels?", "Overall, the US Economy is worse off", "Most of the economic literature predicts that trade wars will damage growth, income distribution and employment in all countries (Erken et al., 2017, and 2018; Bollen and Rojas-Romagosa, 2018; UNCTAD, 2018).", "The scale of the tariffs towards China was vast, encompassing significant portions of the U.S.'s total imports and exports – approximately $350 billion of imports from China and, as a retaliatory measure, around $100 billion of U.S. exports were targeted. Cumulatively, the tariffs targeted imports and exports amounting to 3.6% of US GDP, hurting all sectors from manufacturing, agriculture, to electronics and energy.", "Contrary to the objectives, the trade war did not reverse the trade imbalances. Instead, it resulted in lower US GDP growth, welfare, and employment. Caliendo and Parro (2022) find aggregate manufacturing imports declined by 6.5 percent and manufacturing exports by about 8 percent as a result of the trade war. Estimated costs to the US economy range from $6.9–7.2 billion by the end of 2018 (Fajgelbaum et al., 2020), with the trade war costing US firms $1.7 trillion in market capitalization (Amiti et al., 2019) and reducing investment growth by 1.9 percentage points in 2020 (Amiti et al., 2020).", "US exports to China fell by 18% from 2017 to 2019, while imports fell by 11% over the same period. This resulted in an estimated peak loss of 245,000 jobs in the US and real household income being $88 billion lower over 2018–2019 (in 2020 prices), or around $675 per household. The extensive tariffs led to a reconfiguration of supply chains, especially in Chinese-reliant industries like electronics, machinery, motor vehicles, experienced heightened production costs, and forced many leading US firms to seek alternative, oftentimes more expensive sources for materials.", "US firms are bearing the brunt of increased costs and policy uncertainty", "The extensive tariffs led to a drastic reconfiguration of supply chains, especially in Chinese-reliant industries like electronics, machinery, motor vehicles, that led to heightened production costs. Handley, Kamal, and Monarch's 2020 study reveals that the firms affected by the tariff changes make up a significant U.S. economy, accounting for 84 percent of U.S. exports and 65 percent of manufacturing employment. Complementing this, Flaaen and Pierce's 2019 research highlights that while U.S. manufacturing industries did receive some protection from the increased tariffs, this was counterbalanced by greater negative impacts due to rising input costs and retaliatory tariffs. Furthermore, Amiti et al. (2019) estimated that trade diversion due to these tariffs accounted for approximately USD 165 billion in 2018 alone, including USD 136 billion in US imports and USD 29 billion in US exports, imposing significant costs on multinational enterprises. Fajgelbaum et al. (2019) suggest that these producer and consumer losses amount to approximately USD 68.8 billion per year or 0.4% of U.S. GDP.", "Particularly impacted by the bilateral restrictions is the U.S. technology sector, home to giants like Intel and NVIDIA, which are integral to the burgeoning technology competitive edge of the U.S. Economy. According to Counterpoint Research, the restrictions are expected to affect only about 10% of China's logic chip production through 2025. However, for the U.S, these restrictions have led to a drastic reduction in semiconductor exports to China, with a 50.7% drop to $3.1 billion in the first eight months of 2023, compared to $6.4 billion during the same period in 2022. This decline highlights the vulnerability of U.S. semiconductor supply chains, heavily reliant on Chinese production of critical minerals like gallium and germanium as China accounts for 53 percent of the United States’ supply of raw gallium metal and 54 percent of its germanium imports, essential for high-performance semiconductors.", "Prices increases borne primarily by consumers:", "When import tariffs are imposed, a loss in deadweight and welfare occurs due to a shift to less efficient market outcomes as the participants are forced to waste or underutilize resources.", "Indeed, the most important channel of protectionist trade measures would run through price effects, impacting households (workers) through the real wage channel. A key aspect of the tariffs' impact is on prices borne by consumers. Research by Cavallo, Gopinath, Neiman, and Tang, using Bureau of Labor Statistics data, indicates that tariff revenue was largely absorbed by US importers, leading to a significant increase in post-tariff import prices borne primarily by consumers. This effect is corroborated by Amiti et al. (2018), who found that the full burden of increased tariffs fell on US consumers, resulting in a monthly reduction of real income by USD 1.4 billion, in addition to USD 3 billion in added tax costs monthly.", "On average, real wages fell by 1%, but this varied greatly, with a standard deviation of 0.5% across counties. This variation is linked to regional specialization: while the Great Lakes region and the Northeast, known for industrial activity, received higher tariff protection, agricultural areas like the Midwestern plains and Mountain West were more affected by China's retaliatory tariffs, which targeted about 27% of U.S. agricultural goods.", "Heterogeneous impacts on real wages and consumptions ability:", "Research by Michael Waugh found that counties that were more exposed to Chinese retaliatory tariffs experienced a reduced ability to export, which fed into the labor market (both tradable and non-tradable), and this mechanism reduced consumption. This disparity in economic impact is further illustrated in consumer behavior, with a marked decline in auto sales in counties more exposed to tariffs. High-tariff counties experienced a 2 to 5.5 percentage point reduction in auto sales growth compared to low-tariff counties, according to county-level analysis.", "Clearly, the impact of job losses and reduced wages post-tariffs tend to be geographically localized and limited to certain sectors and occupations, affecting the already worse-off states and Americans who are structurally disadvantaged in the labor market. The trade war's harmful effects, such as increased unemployment, lower wages, and reduced labor force participation, have disproportionately impacted manufacturing workers (Autor et al., 2013, 2014; Pierce and Schott, 2016a), individuals in lower-income brackets (Chetverikov et al., 2015), and the less educated (Greenland and Lopresti, 2016). These demographic groups have faced not only economic challenges but also declines in physical and mental health (McManus and Schaur, 2016), and an increase in mortality rates (Pierce and Schott, 2016b). Furthermore, Feler and Senses (2017) highlight the broader societal impacts, such as reduced tax revenues leading to decreased government budgets and public services.", "Trade war's impact extends far beyond mere trade figures, deepening pre-existing U.S. inequalities. The localized nature of job losses and wage reductions in high-tariff counties has disproportionately impacted those in lower-income brackets and less educated demographics. Such a widening gap underscores a critical aspect of trade conflicts: they often hit those who are least equipped to absorb the shock, thereby contributing to a cycle of increasing inequality.", "Policies recommendations:", "Implementing phased tariff reductions between the US and China can substantially improve economic outcomes. A proposed reduction of 7.5% on $112 billion worth of imports from China in 2021, followed by a further 12.5% reduction on $250 billion worth of imports in 2022, can significantly enhance US GDP by 2025. This strategy should be accompanied by reinforcing economic cooperation, particularly in addressing global economic challenges and reinvigorating trade agreements. Fostering this cooperative stance can lead to mutual economic growth and stability, benefiting industries from agriculture to high-tech sectors, including semiconductors. Escalating tariffs, such as imposing a 45% tariff on all Chinese imports, would have detrimental effects on the U.S. economy.", "In protecting strategic industries, the US should adopt a strategy that safeguards sectors like semiconductors and AI without resorting to broad economic decoupling with China. This involves enhancing measures for cybersecurity and intellectual property rights protection, while still encouraging technological exchange and cooperation with China. Such a strategy can help maintain the competitive edge of US high-tech firms, like Intel and NVIDIA, in the global market. Additionally, it is vital to promote research and development within these sectors to ensure continuous innovation and to mitigate any negative impacts from trade restrictions. This balanced approach not only secures key national interests but also fosters a conducive environment for technological and economic advancement.", "References", "Amiti, M., Itskhoki, O., & Konings, J. (2019). International Shocks, Variable Markups, and Domestic Prices. The Review of Economic Studies. https://doi.org/10.1093/restud/rdz005", "Autor, D. H., Dorn, D., & Hanson, G. H. (2013). The China Syndrome: Local Labor Market Effects of Import Competition in the United States. American Economic Review, 103(6), 2121–2168. https://doi.org/10.1257/aer.103.6.2121", "Caliendo, L., & Parro, F. (2022). Lessons from U.S.-China Trade Relations. SSRN Electronic Journal. https://doi.org/10.2139/ssrn.4184322", "Cerutti, E., Gopinath, G., & Mohommad, A. (2019, May 23). The Impact of US-China Trade Tensions. IMF. https://www.imf.org/en/Blogs/Articles/2019/05/23/blog-the-impact-of-us-china-trade-tensions", "Chetverikov, D., Larsen, B., & Palmer, C. (2016). IV Quantile Regression for Group-Level Treatments, With an Application to the Distributional Effects of Trade. Econometrica, 84(2), 809–833. https://doi.org/10.3982/ecta12121", "Economics, O. (2023, November 9). The Impact of China PNTR Repeal and Increased Tariffs on the US Economy and American Jobs | US-China Business Council. Www.uschina.org. https://www.uschina.org/reports/impact-china-pntr-repeal-and-increased-tariffs-us-economy-and-american-jobs", "Ernst, E., Merola, R., & Samaan, D. (2019). Trade wars and their labour market effects. https://www.ilo.org/wcmsp5/groups/public/---dgreports/---inst/documents/publication/wcms 723440.pdf", "Fajgelbaum, P., Goldberg, P., Kennedy, P., & Khandelwal, A. (2019). NBER WORKING PAPER SERIES THE RETURN TO PROTECTIONISM. https://www.nber.org/system/files/working papers/w25638/revisions/w25638.rev0.pdf", "Feler, L., & Senses, M. Z. (2017). Trade Shocks and the Provision of Local Public Goods. American Economic Journal: Economic Policy, 9(4), 101–143. https://doi.org/10.1257/pol.20150578", "Garfinkel, C. I., & Waugh, D. W. (2019). Corrigendum. Journal of Climate, 32(7), 2167–2167. https://doi.org/10.1175/jcli-d-18-0850.1", "Greenland, A., & Lopresti, J. (2016). Import exposure and human capital adjustment: Evidence from the U.S. Journal of International Economics, 100, 50–60. https://doi.org/10.1016/j.jinteco.2016.02.002", "Greenland, A., Lopresti, J., & McHenry, P. (2019). Import Competition and Internal Migration. The Review of Economics and Statistics, 101(1), 44–59. https://doi.org/10.1162/rest a 00751", "Handley, K., Kamal, F., & Monarch, R. (2020). Rising Import Tariffs, Falling Export Growth: When Modern Supply Chains Meet Old-Style Protectionism. International Finance Discussion Paper, 2020(1270). https://doi.org/10.17016/ifdp.2020.1270", "Kelly, B. R. (2019). Trade War Results in Substantial Losses for U.S. & Other Countries. Princeton School of Public and International Affairs. https://spia.princeton.edu/news/trade-war-results-substantial-losses-us-other-countries", "McManus, T. C., & Schaur, G. (2016). The effects of import competition on worker health. Journal of International Economics, 102, 160–172. https://doi.org/10.1016/j.jinteco.2016.06.003", "Oxford Economics, & US-China Business Council. (2021, January 14). The US-China Economic Relationship. US-China Business Council; OXFORD ECONOMICS. https://www.uschina.org/reports/us-china-economic-relationship", "Pierce, J. R., & Schott, P. K. (2016). The Surprisingly Swift Decline of US Manufacturing Employment. American Economic Review, 106(7), 1632–1662. https://doi.org/10.1257/aer.20131578", "Sang, M., Kong, H., & Weinstein, D. (2020). THE EFFECT OF THE U.S.-CHINA TRADE WAR ON U.S. INVESTMENT. https://www.nber.org/system/files/working papers/w27114/w27114.pdf", "TING-FANG, C. (2022, November 30). China’s chip industry fights to survive U.S. tech crackdown. Nikkei Asia. https://asia.nikkei.com/Spotlight/The-Big-Story/China-s-chip-industry-fights-to-survive-U.S.-tech-crackdown#:~:text=In%20the%20logic%20chip%20sector"]}, {"slug": "rethinking-rural-education-in-vietnam-a-call-for-quality-and", "title": "Rethinking Rural Education in Vietnam: A Call for Quality and Relevance", "author": "Trang Linh", "type": "Journal", "source": "TRANG LINH/Rethinking Rural Education in Vietnam_ A Call for Quality and Relevance.docx", "paragraphs": ["Rethinking Rural Education in Vietnam: A Call for Quality and Relevance", "This piece aims to question the supposed impacts of rural education investment prioritization strategies and thus argues for new quality-oriented education policies for Vietnam rural areas that prioritize students at the foremost.", "Note that my primary stance here is that existing forms of investment priorities like infrastructures investment, enrollment rates, returns to schools are crucial and remain very much so deserving of education investment budgets. However, I believe that the shift now needs to be towards improving the quality and the tangible gains a student from these areas can receive from education, rather than bigger schools or more students when the education quality itself in these areas suffer immense deficiencies.", "Introduction", "The widely celebrated narrative of rural students relocating to cities, securing university degrees from prestigious urban universities, and landing lucrative jobs, as rural students best outcomes from further education, represents an elitist and urban-centric approach. This narrative in education policies not only marginalizes those unable to achieve this ideal due to various constraints—be it capacity, resources, or circumstances—but also overlooks the realities and the need for quality education of millions of rural students.", "My motivation to address this issue stems from observing how education for rural students is idealized and promoted by governmental advocacy as a vehicle for urban-centric social mobility through university education and urban relocation. This perspective is inherently elitist and saturated with urban bias, given that nearly 70% of our population resides in non-urban areas. Such a narrow view of education's role translates into policies and objectives for rural regions that adopt a one-size-fits-all approach, suitable only for urban contexts. The skills necessary for rural development and contribution are markedly different, demanding an education system that fosters skills relevant to rural economies, such as agriculture and local industries, beyond just academic knowledge aimed at urban integration. Expecting rural students to invest years in an education system fantasizing about improbable outcomes of urban social mobility is fundamentally unjust. Education should empower individuals with practical skills for tangible benefits, not lead them on a futile chase for improbable outcomes. The harsh truth is that despite the push for high school completion under the guise of meeting top-down government targets, the quality of education often falls short of enabling rural students to access prestigious urban universities.", "Consequently, many find themselves in the same position as their predecessors: engaged in agriculture or factory work with no significant returns on their years of educational pursuits. We must advocate for education policies that genuinely serve rural students, providing them with relevant skills and knowledge that enhance their lives and contribute to their communities, rather than perpetuating a cycle of unfulfilled aspirations and wasted resources.", "The challenge, then, is to reimagine an educational framework that values and cultivates the rich potential of rural areas. This involves moving beyond traditional knowledge acquisition to embrace a curriculum that prepares students for tangible achievements in their communities. By doing so, education can become a cornerstone of rural development, tailored to the specific needs of these areas and aligned with the broader goals of economic restructuring and rural revitalization.", "The current state of rural education in Vietnam", "This brings me to dissect the current issues, challenges identified with Vietnam rural education policies, and to give more specific analysis with the examples that I just bring forth. These challenges will primarily deal with the scope of quality of rural education.", "EXISTING POLICIES", "If general education is viewed under its four dimensions, i.e., access, quality, efficiency, and equity, then it can be said Vietnam has made significant strides in access development, but remained weak in improving quality, efficiency, and equity. These shortcomings persist chiefly and significantly in rural education. The country now has a very high literacy rate; in 2015, 94.5 percent of the Vietnamese population aged 15 and over could read and write (Central Intelligence Agency, 2019). The country also has the highest level of public spending on education of any other ASEAN countries (Rynhart & Chang, 2014). Previous studies show that there was an increasing rate of return to education from 1993 to 2008 (Doan & Gibson, 2012; Gallup, 2004; Liu, 2004; Pham & Reilly, 2007).", "The current education administrators are well-aware of the needed improvements and the approach towards better quality, though the primary focus has always been access to education.", "The most recent phase of education reform in Vietnam has centered around the 2011–2020 Education Development Strategic Plan. The strategic plan aimed to improve access to and the quality of all levels of education, including preschool, general education, vocational education, and continuing education. Eight key solutions were proposed to address the main challenges identified: (1) renovating education management and administration; (2) promoting teachers and education managers’ development; (3) renovating content and teaching methods, examination, testing, and education assessment; (4) increasing investment of resources and renewing education finance distribution mechanisms; (5) strengthening the link between universities and the labor market as well as scientific research and technology transfer to meet societal needs; (6) fostering educational development for disadvantaged areas, ethnic minorities, and social policy beneficiaries; (7) promoting education science; and (8) expanding and improving the effectiveness of international cooperation in education.", "Many past progress has been made towards quality teaching, especially the adoption of Dakar Education for All (EFA) Framework for Action – an initiative with greater focus on quality than those set out in the Millennium Development Goals for the 2015 curriculum reforms initiatives. The key transformations of this new curriculum was the approval of a new competency-based curriculum that has been implemented ever since the beginning of 2020. This curriculum renovation is following a competency-based approach, according to which the post-2015 curriculum of general education will aim at nurturing and developing the generic core competencies for students in school and in life, including: (a) competencies for self-development (self-learning, problem-solving, critical thinking, creativity and innovation, and self-management); (b) competencies in social relations (communication and cooperation); and (c) competencies in using tools interactively (language, media, information, communications, and technology).", "Despite the government's dedication to enhancing education quality through competency-based teaching methods and curriculum reforms, there is a stark need for clearer guidelines and support to actualize these competency-based approaches, particularly in rural areas. Here, the implementation of these well-intentioned policies often ends up being incomplete, caught in a limbo that is 'neither fish nor fowl'. This ambiguity significantly hampers the effectiveness of educational reforms in rural settings, where the gap between policy and practice becomes most evident, posing substantial challenges in delivering genuine value to students.", "In recent years, concerns have surfaced regarding the efficacy and direction of Vietnam's education investments, particularly in light of findings from two pivotal studies. The research conducted by Doan et al. in 2018 and McGuinness et al. in 2021 highlights a troubling trend: the rate of return on educational investments has been on the decline since the period of 2008 to 2010. This downturn suggests a growing discrepancy between the output of the education system and the demands of the labor market, and the current issues of insufficient returns for rural students.", "CHALLENGES:", "A misguided dream", "In the distinctive context of Vietnam's rural, agriculture-heavy landscapes, the true test of education lies in its ability to deliver visible, tangible benefits to students—manifested through money in hand, real-world experiences, and viable career paths. The luxury of education as an end in itself, a notion often entertained in urban, elite circles as learning for the sake of learning, is a concept rural Vietnam simply cannot afford as it risks undermining all decades-long progress made in boosting enrollment and advocating for education, as students will inevitably disengage if they perceive their learning does not translate into these tangible means. Particularly in these rural settings, the opportunity cost of education soars, given the predominance of low-skilled labor opportunities nearby. Education must therefore ideally offer concrete, practical benefits, ensuring rural students are not merely schooled but truly educated for their own success of social mobility, and further, the development of non-urban communities altogether.", "Firstly, this is due to the lack of tailored career pathways and alternatives for rural students. The prevailing educational strategies devised by policymakers and non-profit organizations for rural students are founded on a fundamentally flawed premise of university: that all students, by virtue of completing their education, will be (only) equipped to pursue education training, secure gainful employment, and thereby ascend the social ladder. This assumption is rooted in an urban-centric worldview where the ultimate measure of success is admission to prestigious urban colleges, leading to well-paying jobs and a transformative life trajectory. However, this approach is deeply problematic—it overlooks the needs of those students who, for various reasons, and mostly of it structurally, will be unable to gain university admission. These students, upon completing high school, find themselves without support or direction because the education they received did not prepare them for anything but college.", "The idea that university education is the singular goal for all. It's imperative now, more than ever, to pivot away from this narrow conception of university “overemphasis\", to protect rural education simply because of how unrealistic, exclusive, and ineffective that goal is to the majority.", "This is my reasoning so as to why such final end goal for these students to get into universities are misguided, ineffective and realistic are so forth:", "Firstly, the quality of education in rural areas starkly contrasts with that in urban centers. Rural schools lag in teacher expertise, infrastructure, and peer support networks, all of which are critical for success in National Standardized Exams that dictate university admissions. The intensity of academic pressures is also markedly different; rural families often prioritize agricultural work over educational attainment, which fundamentally impacts students' academic engagement.", "Secondly, imagine the scenario of thousands of rural students, already structurally disadvantaged with lower quality of education, fewer qualified teachers, and limited access to educational resources, now competing for university slots against their urban counterparts. Given the increasing reliance on elitist admissions criteria, such as IELTS scores, the stark reality is that the odds are heavily stacked against rural students. The competitive disadvantage is further exacerbated by the growing disparities in admission processes, making their prospects of entering prestigious universities increasingly improbable.", "Moreover, the structural differences extend way beyond education quality. Household economics play a significant role in defining educational opportunities. The economic landscape for rural families often encompasses immediate monetary needs, job lresponsibilities, and familial obligations, limiting students' ability to engage fully with their educational pursuits. Ethnic minority children, for instance, are more likely to drop out due to the necessity of contributing to agricultural work, a factor compounded by the lower quality of available education as cited by the World Bank in 2019.", "Geographical challenges also play a crucial role. Rural students are geographically isolated, which not only restricts their access to quality educational resources but also exists within a community context that may not fully support or value academic achievement. This isolation, combined with lower internet penetration and a community dynamic that often prioritizes immediate economic contributions over educational success, further diminishes their competitive standing in the race for university admissions. These factors collectively highlight the profound systemic issues within the current educational framework. A pivot towards more inclusive and realistic educational goals is essential to protect and enhance rural education, ensuring it is both accessible and relevant to all Vietnamese students, regardless of their geographic or economic background.", "And even if rural students can pass these testing points and are thus now qualified enough to access university education and the subsequent career options, this is definitely the small minority of students as the likelihood of achieving such educational and professional heights is markedly slim. Consequently, framing university attendance as the normative goal within teaching practices is not only misguided but also detrimental for all the students who did not have enough luck to achieve that end goal. A shift in focus is needed—one that emphasizes rural-centric educational approaches such as enhanced vocational training, social enterprise education, and specialized agricultural instruction. These alternatives are better aligned with local contexts and can significantly contribute to the development of rural regions by providing practical career paths that are achievable and relevant.", "Inadequacy of vocational training and employment-oriented education", "The second way, the system fails to improve the future prospects for the majority of their students because of the lack of alternatives and safety nets, other than this very unlikely pathways of continuing their university education.", "I argue that the subparness of vocational training education is due to two-fold: (1) Ingrained norms towards the importance of university that leads to the lack of popularity of these program (2) Lack of investment, resources and outdated curriculum that does not serve the students.", "Vietnamese culture traditionally places a high value on academic success, often equating it with white-collar jobs seen as more prestigious. This cultural norm tends to overshadow the importance of vocational education, leading to its undervaluation and underinvestment. Rural areas, in particular, suffer from this bias, compounded with the popular narratives coming from government, NGOs glorifying universities, as vocational training is not perceived as a legitimate pathway to success compared to university education. This societal undervaluation creates a lack of interest and motivation among students to pursue vocational tracks, even when they are more practical and aligned with local job market needs. Geographical isolation and limited information dissemination in rural areas also meant that students often have little awareness of potential vocational and technical career paths, especially when it is not being formally pushed as a legitimate option. Without exposure to the range of available options, rural students are likely to overlook vocational training as a viable educational route.", "Vocational training centers in rural areas often lack the necessary funding and resources to provide high-quality education. There is a shortage of modern equipment, updated training materials, and qualified instructors who can provide students with the hands-on experience and current industry knowledge they need to be job-ready upon completion of their programs.", "Many vocational training programs suffer from outdated curricula that do not match the evolving demands of the job market. The skills taught are often not in sync with the needs of local industries, leading to a mismatch between graduates' skills and available jobs. This misalignment not only hampers students' employment prospects but also fails to support the economic development of the area.", "Thirdly, the reasons why I argue that the system fails to serve is because of the inherent failures within the way it operates.", "The inadequacy of the current education system in rural areas extends far beyond the mere acquisition of skills and knowledge; it fundamentally fails to foster the intangible qualities that are essential for personal development and social mobility. These qualities, including critical thinking, a mindset geared towards lifelong learning, and the ability to adapt and innovate, are crucial for students to thrive in a rapidly changing world. Unfortunately, for rural students, the education received is often subpar, lacking in both depth and breadth, and fails to instigate the cognitive and attitudinal shifts necessary for meaningful personal and community development. The prevailing educational paradigm falls short of being the revolutionary force necessary to profoundly awaken consciousness or implement the problem-posing education model, as advocated in Paulo Freire's \"Pedagogy of the Oppressed.\" It does not equip students with the critical awareness needed to transcend the confines of their immediate environments—environments often characterized by the reinforcing echo chambers of conventional thought, familial expectations, and societal temptations. True social mobility requires navigating through and beyond these storms of circumstance, a journey that demands a critical and reflective engagement with the world, rather than passive absorption. Yet, this journey becomes formidable within the confines of the \"banking model\" of education, where knowledge is deposited rather than co-created, leaving little room for the development of the critical consciousness necessary to challenge and change one's socio-economic destiny.", "Several factors further impede the quality and tangible benefits students receive from their education:", "Lack of quality resources", "One of the most critical issues facing rural education is the glaring shortage of skilled educators and quality teaching resources, which are quintessential for delivering a comprehensive education. Rural areas often struggle to attract and retain qualified teachers due to lower salaries, fewer professional development opportunities, and the perceived hardship of working in isolated or less developed areas. Additionally, schools in these regions frequently lack the modern teaching materials and technological tools that can enhance learning experiences and engagement. This resource deficit not only hampers the delivery of curriculum but also significantly affects the ability of students to engage with and absorb complex subjects, ultimately stunting their educational growth and readiness for further education or entry into the workforce.", "Problematic ministry culture:", "The prevailing ministry culture, focused on superficial metrics such as enrollment rates and standardized test scores (\"Chạy theo hình thức\"), often diverts attention from more substantive measures of educational quality and the actual impact on an average person’s life. This emphasis on quantitative metrics can lead to policies that prioritize the appearance of success over genuine improvements in educational delivery and outcomes. For instance, schools might be driven to boost graduation rates by any means necessary, which can include lowering standards or neglecting the needs of struggling students, rather than implementing more robust support systems.", "This metric-focused approach fails to account for the nuanced realities of rural education, where broad educational engagement and genuine skill acquisition are needed to transform communities. Shifting this culture requires a fundamental change in policy evaluation, moving towards a model that values qualitative assessments of student growth, teacher effectiveness, and community impact. Educational success should be measured not just by the number of students who pass exams, but by how well students are prepared to lead productive and fulfilling lives post-graduation.", "—", "Despite governmental commitments to enhancing education through competency-based practices and curriculum reforms, a gap remains in the actualization of these intentions. The Ministry of Education and Training (MOET) has identified changes in exam content as a significant hurdle, particularly with the 2015 PISA rankings drop, underscoring a need for curriculum that resonates with modern contexts unfamiliar to Vietnamese students. Associate Professor Tran Kieu highlights a shift towards a learner-centered approach that emphasizes the development of core competencies as crucial for modern education. However, inconsistencies in training quality and implementation capacity persist, partly due to infrastructural and resource limitations. For instance, the introduction of the \"whole school\" reform showed potential in enhancing cognitive and non-cognitive achievements, yet the variation in student performance underscores disparities in educational engagement across regions.", "To bridge these gaps, Vietnam has initiated several teacher training programs and reforms aimed at bolstering competency-based education. Nevertheless, widespread challenges remain in ensuring these programs' effectiveness, largely due to insufficient funding for upgrading educational facilities and a lack of comprehensive guidance on implementing competency-based teaching. The need for more equitable investment in educational infrastructure and materials is paramount for enhancing the overall quality of education across the country. Ultimately, for these reforms to bear fruit, the government must ensure the effective implementation of ongoing policies and programs, such as the Renovation of General Education Project and the Enhancing Teacher Education Program-for-Results. Exploring innovative solutions, such as adaptive learning technologies and high-tech management systems, could further revolutionize the educational landscape, making quality education more accessible and relevant to all students, especially those in rural areas.", "Policy recommendations", "In Vietnam, a massive increase in intakes of tertiary education was observed in the middle and third parts of 2000s (see Figure 1). The gross enrolment rate of tertiary education stayed stable around 10 per cent for many years prior to 2003 and then increased to 15.9 per cent in 2005. The enrolment rate again increased from 15.9 per cent in 2005 to 24.4 per cent in 2011. Between 2003 and 2011, the gross tertiary enrolment rose by 144 per cent. The increase in the uptake beginning in 2004 would start having an effect in 2008 onwards as the additional students graduated after three or four years of training. The effect in the following years would be stronger because of the incremental number of the graduates. Pressure of oversupply of higher education graduates has led to lower wage rate or higher unemployment rate amongst the graduates (Chevalier and Lindley, 2009; Pecoraro, 2014). The declining returns to education would thus discourage education investment and then harm human capital formation, leading to slowdown of the sustainable economic growth (Booth, 2003). This is a real big risk for sustainable economic growth as the economic growth in the long run relies on productivity (Krugman, 1992)", "In addition, quality of the training in Vietnam has not always been followed with the same pace of enrolment scale expansion (Christian, 2014) and the economic growth has been sluggish since the GFC. Therefore, Vietnam’s economy has not been able to take in fully the extra graduates. There is evidence that workers with university degrees have the second highest unemployment rate just after the non-educated group in recent years.3 This is unusual and may suggest an oversupply of the higher education graduates. In addition, the qualifications of higher educated workers are not as high level of quality as they should be. Christian (2014) indicated the unbalanced training in Vietnam education, which has focused mainly on scale expansion, but not the quality of the education per se. The need to focus on both scales including the expansion and the quality of education is raised. It is suggested that it is not just expanding scale attainment, but it is important to provide the right skills to meet Vietnam’s continued economic modernization in the coming decades. Apart from job-specific skills, Vietnamese employers value cognitive skills, such as problem solving and critical thinking, and behavioural skills, such as teamwork and communication. The current tertiary training in Vietnam lacks these skills.", "Enhancing vocational education", "De-stigmatization of vocational schools: Actively work to remove the stigma associated with vocational education. Promote vocational schools as viable and prestigious alternatives to university education, emphasizing their role in successfully training skilled workers across various sectors.", "Curriculum relevance: Ensure that vocational school curricula are closely aligned with real-world demands and local economic needs. The curriculum should be dynamic, student-oriented, and directly linked to actual career opportunities, providing practical skills that meet the current market demands.", "Increased investment in vocational education: Redirect a significant portion of the current educational budget towards vocational schools. Focus on enhancing the quality of facilities, equipment, and teaching resources to provide high-value education that offers tangible returns on investment for rural students.", "Diversifying educational pathways", "Establish clear and respected alternative educational pathways that provide robust training and education. These pathways should offer certifications and qualifications that are recognized by industry and provide real economic opportunities.", "Strengthen ties between educational institutions and local industries to facilitate practical training, apprenticeships, and job placement, ensuring the students have secure pathways into the workforce.", "Develop support systems that assist students who opt for non-traditional paths or who enter the workforce earlier. This includes career counseling, job placement services, and continuous education opportunities to help them advance in their careers without a traditional university degree.", "The plan should also outline the key enabling reforms that are needed to establish appropriate conditions for the effective operation of the existing HEIs from the viewpoint of favorable governance and sustainable financing. The strategic vision accompanied by a fully costed implementation road map should address the following questions: y How will higher education support Vietnam’s socio economic development? y What quantitative targets will the Government pursue with regard to overall enrolment growth, providing equal opportunities of access and success for students from underrepresented groups, raising educational attainment among the adult population, and strengthening the research output and technology transfer results? y What level of public and private resource mobilization would be necessary to achieve the Government’s objectives in a sustainable manner? y Is the current balance between universities, teacher training colleges, and TVET institutions appropriate, considering Vietnam’s human capital requirements and long-term development objectives? Does the system allow students to move easily between subsectors and institutions? y Would Vietnam benefit from establishing a small number of high-quality universities designed to conduct leading-edge research in priority areas? y Are the higher education system’s current QA mechanisms adequate? If not, how can they be improved? y Do the system’s governance arrangements create an appropriate regulatory framework to support innovation and the adoption of international best practices?"]}, {"slug": "vietnam-s-semiconductor-ambitions-capabilities-and-challenge", "title": "Vietnam’s Semiconductor Ambitions: Capabilities and Challenges Amid Geopolitical Tension", "author": "Trang Linh", "type": "Journal", "source": "TRANG LINH/Vietnam_s Semiconductor Ambitions_ Capabilities and Challenges Amid Geopolitical Tension.docx", "paragraphs": ["Industry Outlook:", "The global semiconductor industry is experiencing rapid growth, driven by increasing demand for advanced technologies such as artificial intelligence (AI), autonomous vehicles, and 5G connectivity. This surge has led to heightened competition among nations to establish themselves as leaders in chip production. Vietnam is projected to see its high-tech export revenue reach $135 billion by 2024, accounting for over 30% of total exports, positioning it as a major player in ASEAN. With ambitions to move further up the tech value chain, the Vietnamese government has set ambitious targets, aiming to train at least 50,000 chip engineers and designers by 2030 to meet the rising global demand.", "Vietnam's strategic location and cost advantages make it a prime candidate for further growth. The increasing appeal of Vietnam’s talent is largely driven by the global surge in demand for chip engineers, spurred by the AI boom and supply chain shifts caused by U.S.-China tensions. The country aims to capitalize on these trends by attracting more investments and solidifying its place in the semiconductor sector.", "World-wide semiconductors “race\"", "Nations worldwide are launching comprehensive strategies to secure their positions in the global semiconductor market:", "European Union: The Digital Compass Plan aims to produce 20% of the global semiconductor output by 2030, with a focus on increasing manufacturing value by 6-44%. Incentives such as 50% R&D tax credits and projected investments between $20 to $35 billion over the next decade are encouraging growth.", "South Korea: The K-Belt National Chip Plan seeks to create a \"K-semiconductor belt,\" doubling its workforce and securing a leading position in chip production by 2030. Supported by a $55 to $65 billion budget over three years, the plan offers tax credits of 25% and other incentives.", "China: As part of its 14th Five-Year Plan, China aims for chip self-sufficiency by 2025. With national and local funds totaling $100 billion, alongside tax exemptions and state financing initiatives, China is investing heavily in R&D to bolster its capabilities.", "These global policy shifts reflect a drive to secure semiconductor supply chains, highlighting the strategic importance of the sector amid geopolitical concerns. Vietnam's proactive efforts to build its tech sector offer opportunities to attract investments from companies looking to diversify away from other major hubs.", "Dissecting Vietnam's potential to participate in this semiconductor “rush\"", "Vietnam has several strengths that contribute to its emerging role in the semiconductor industry. Its favorable geographical location, stable political environment, and strong electronics industry are assets. However, there are also challenges and opportunities that must be considered.", "Strengths:", "Vietnam has a young, skilled, and high-quality workforce, with over 70 universities focusing on STEM. Companies like Samsung, Intel, LG, and Foxconn have established significant operations, helping to build a foundation for further growth. Vietnamese firms such as FPT and Vingroup are also expanding their technology capabilities", ".Vietnam has a stable political environment, favorable logistics, and a young, skilled workforce. Over 50% of the population is under 30, creating a \"golden demographic period\" that is expected to last until 2039. With around 1.8 million university graduates annually, Vietnam has a robust talent pool, many of whom specialize in science and technology. The government has pledged to train 50,000 semiconductor engineers by 2030, further bolstering the workforce. Vietnam's relatively low labor costs (ranging from $3,100 to $3,800 per person per year as of 2023) make it an attractive option for foreign companies looking to establish cost-effective production facilities.", "Vietnam's strategic location also enhances its appeal. Situated in the heart of Southeast Asia, it offers easy access to major markets such as Singapore, Malaysia, Thailand, and Indonesia. Its proximity to China and India allows Vietnam to serve as a bridge for companies looking to reach these vast markets. Additionally, Vietnam’s position in the global supply chain is being strengthened through strategic partnerships with the U.S., Japan, South Korea, and others, with recent agreements focusing on high-tech collaboration and talent development.", "Weaknesses:", "Despite its advantages, Vietnam faces significant challenges, including infrastructure constraints. According to the Global Innovation Index 2023, Vietnam ranks 71st out of 132 countries in infrastructure, reflecting ongoing issues with transportation and logistics. While there have been improvements, Vietnam still grapples with congested roads, underdeveloped rail networks, and limited port capacity, increasing costs and reducing efficiency. Additionally, Vietnam's R&D capabilities remain limited. The country spends only 0.42% of its GDP on R&D, which is lower than that of developed semiconductor nations like South Korea and the U.S., constraining its ability to innovate and compete globally.", "Another critical challenge is the need for better integration into the global tech ecosystem. Vietnam's companies often struggle to access advanced technologies due to high costs and legal complexities, impeding their ability to develop competitive products. Furthermore, Vietnam's education system is still catching up to the demands of the tech sector, producing fewer STEM graduates than required to sustain growth in the semiconductor industry.", "Opportunities:", "There is significant foreign interest in Vietnam’s semiconductor sector. Companies like Alchip Technologies plan to expand their engineering staff, specializing in AI chip design. Synopsys has positioned a team of 500 engineers to lead advancements in chiplet and multi-die chip design. Marvell aims to make Vietnam its third-largest global hub for chip design, growing its workforce to around 500 by 2026. Additionally, South Korean firms are converting their Vietnamese branches into major R&D centers, particularly for AI chips in autonomous vehicles. These companies are investing in local talent through scholarships, internships, and collaborations with universities, ensuring a steady supply of skilled engineers. These moves could help Vietnam realize its ambition of moving up the tech value chain.", "During President Biden's visit in September 2023, many companies listed above committed to expanding operations in Vietnam, focusing on Assembly, Testing, and Packaging (ATP)—a crucial sector of the semiconductor supply chain where Vietnam can capitalize on its competitive costs and skilled labor.", "Vietnam's reserves of rare earth elements, the second-largest globally, further enhance its appeal. These minerals are essential for producing high-tech products, from semiconductors to electric vehicle batteries. Vietnam has already signed agreements with countries like South Korea to develop a rare earth supply chain, securing an essential position in the global tech industry.", "Threats:", "Vietnam’s rapid growth in the semiconductor sector could be hampered by serious infrastructural limitations and rising competition from other countries like India and Thailand, which offer lower labor costs or larger markets. The competition is fierce, with countries worldwide racing to develop their semiconductor capabilities and attract investment. Vietnam must address these challenges quickly, as noted by Deputy Minister Trần Duy Đông, who emphasized the need for rapid infrastructure improvements and policy reform within the next 24 months to ensure competitiveness.", "Additionally, Vietnam's ability to sustain growth depends on its capacity to enhance its R&D capabilities. Without substantial investments in innovation, Vietnam risks becoming a low-cost manufacturing hub rather than an integrated player in the global tech ecosystem.", "Current regulatory movements within the industry in Vietnam", "The global race in the semiconductor industry sees top companies actively investing in Vietnam. Examples include:", "Samsung's two mobile phone manufacturing plants in Bac Ninh and Thai Nguyen.", "Intel's chip assembly, packaging, and testing plant in Ho Chi Minh City.", "Amkor’s semiconductor manufacturing facility, worth $1.6 billion, in Bac Ninh (2023).", "Micron Vina’s semiconductor plant, valued at $1 billion, in Bac Giang (2023).", "Companies such as Renesas, Qorvo, Marvell, Synopsys, Ampere, and Infineon are also involved in large-scale R&D for integrated circuit (IC) design in Vietnam. Additionally, Google, Amazon, and Nvidia are providing AI training courses in the country.", "Artificial Intelligence Development Strategy:", "Vietnam’s AI development strategy, outlined in Decision No. 127/QD-TTG, aims to position AI as a significant technological field by 2030. The goal is to make Vietnam a center for innovation and development of AI solutions, contributing to a creative society, an efficient government, national security, and sustainable economic growth.", "Key strategic directions include:", "Administrative reforms and the development of a legal framework.", "Financial investment support.", "Tax and fiscal policy adjustments.", "Assistance for small and medium-sized enterprises.", "Promotion of open manufacturing.", "Coordination and monitoring mechanisms for implementation.", "Vietnam's Semiconductor Industry Growth Plan: Vietnam’s plan for the semiconductor industry is divided into three phases:", "Phase 1: Annual revenue over $25 billion, with local added value reaching 10-15%. The goal is to establish 100 design companies, 1 manufacturing company, and 10 semiconductor packaging and testing firms, supported by a workforce of over 50,000 engineers.", "Phase 2: Annual revenue over $50 billion, with local added value increasing to 15-20%. Expansion includes 200 design companies, 5 manufacturing companies, and 20 packaging and testing firms.", "Phase 3: Annual revenue exceeding $75 billion, with local added value at 20-25%. By this phase, Vietnam aims to develop self-sufficient semiconductor production capabilities with 300 design companies, 5 manufacturers, and 20 packaging and testing firms.", "Human Resources Development in the Semiconductor Industry:", "By 2030, Vietnam plans to train 50,000 engineers for the semiconductor industry and an additional 35,000 for other roles. This includes around 15,000 design engineers and the establishment of 18 national-standard laboratories across the country. The strategy involves setting up 4 national-level labs across the northern, central, and southern regions and expanding training to around 200 locations.", "Foreign corporations and Semiconductors", "The Vietnamese government has initiated comprehensive policies to support the semiconductor industry. Deputy Minister Trần Duy Đông noted that high-level meetings between the Vietnamese Prime Minister and U.S. partners emphasized the need for rapid implementation, particularly focusing on three core areas:", "Completion of a competitive regulatory framework to ensure Vietnam can attract and retain investments.", "Synchronized infrastructure upgrades in electricity, water, transportation, fiber optics, and IT to meet the demands of high-tech industries.", "Development of a high-quality workforce, including investment in education, retraining, and collaboration with international firms.", "The government’s strategy is further articulated through the “Development of Semiconductor Industry Workforce until 2030, Vision to 2045” plan. This proposal, developed by the Ministry of Planning and Investment in collaboration with other governmental bodies, seeks to build a comprehensive ecosystem that includes training programs, R&D, infrastructure development, and international partnerships. It identifies several key tasks:", "Training high-quality engineers: Increasing collaboration between universities, research institutes, and private enterprises to ensure the workforce meets the industry's needs.", "Attracting global talent and expertise: Encouraging the return of Vietnamese professionals working abroad in the semiconductor field.", "Encouraging Public-Private Partnerships (PPPs): Supporting infrastructure development through PPPs and creating incentives for private investments.", "Enhancing international cooperation: Strengthening ties with leading countries in the semiconductor industry, like the U.S., to benefit from technology transfer, joint ventures, and strategic alliances.", "Deputy Minister Đông emphasized that Vietnam could not progress alone; the country must engage in swift and comprehensive cooperation with global leaders in the semiconductor sector. In doing so, Vietnam can \"stand on the shoulders of giants,\" leveraging its demographic advantages and strategic initiatives to emerge as a formidable player in the semiconductor industry.", "The government has identified seven critical tasks for implementing its workforce development plan:", "Training formal education lecturers and students, as well as short-term courses to meet immediate industry demands.", "Boosting R&D efforts across national labs and private sectors.", "Investing in technology infrastructure, including specialized facilities for semiconductor research and production.", "Attracting international experts and professionals.", "Supporting job creation and the growth of semiconductor enterprises.", "Crafting specific policies to enhance the training and development of the semiconductor workforce.", "Promoting international collaboration and creating awareness about Vietnam’s growing semiconductor industry."]}, {"slug": "what-is-holding-back-the-success-of-educational-psychologica", "title": "What is holding back the success of educational psychological consultation in Vietnam?", "author": "Xuân", "type": "Journal", "source": "Xua#U0302n/Xua#U0302n - Co#U0302ng ta#U0301c tu#U031b va#U0302#U0301n ta#U0302m ly#U0301 ho#U0323c #U0111u#U031bo#U031b#U0300ng.docx", "paragraphs": ["What is holding back the success of educational psychological consultation in Vietnam?", "Abstract", "The psychological counseling services at schools in Vietnam were still struggling to tackle the rising issue of prolonging disorders, stress, depression and other common mental health problems in students. According to UNICEF, reports from the governments proved that although there has been an increase in counseling activities in many provinces, still the need for such service remained high. This essay looks at Circular 31/2017/TT-BGDĐT published by the Vietnamese Ministry of Education and Training as well as other related work from UNICEF and psychological studies to evaluate the effect of actions taken by the Vietnamese government to address the alarming mental health issues. Although the circular had addressed the more significant aspects to mitigate the problems at hand, further investments and amendments could have been made to handle the issue more efficiently and quickly.", "Introduction", "The current mental health quality for students in Vietnam can be said with one sentence: “Improving, but not enough.” According to research taken by Dr. Hoàng Trung Học in 2022, the result of consulting with a sample of 20,000 students from all three regions of Vietnam proved the situation to be quite alarming (Sỹ, 2022). 60.5% of students went through stress in different levels, 38.1% suffered anxiety disorder and 30.4% underwent Major Depressive Disorder. Each year, there are around 36,000 to 40,000 suicidal cases related to mental health issues. These numbers got even more severe during and after the Covid-19 pandemic due to the lack of social interaction and proper educational methods. This begs a question regarding psychological consultation in schools, especially in secondary and high school in Vietnam: Aren’t there supposed to be psychological consultation facilities in Vietnamese public and private schools?", "In December 2017, the Vietnamese government released Circular 31/2017/TT-BGDĐT, titled “Guidelines for Implementing Psychological Counseling for High School Students” (Thư viện Pháp luật, 2017). This circular was made to address the lack of psychological support for high school students from across all three regions of Vietnam, especially those who suffered peer pressure, heavy stress, depression, bullying and other school-related mental issues. After Covid-19, the role of counseling seems to be even more important to help students re-establish social networks, re-learn skills and recreate a sense of belonging again. Has this circular helped to reduce the impact of Vietnamese students' mental health issues? How will this circular change the high school student’s life? To answer such a question, an analysis of this circular with both advantages and drawbacks as well as some further recommendations will be made in this essay.", "Circular Overview", "The primary aim of Circular 31/2017/TT-BGDĐT is to provide aid for students who are suffering mental issues such as depression, stress, or disorders while studying. The role of psychological counseling according to this circular is to resolve issues and reduce the effect made by them to create a safer education environment for high school students in Vietnam. Other than that, psychologists and advisors can teach students life skills such as communication, emotional control and regulating feelings or stress, as well as nurturing a strong will, confidence and bravery. This service also aids students in determining suitable behaviors in social connection and networking, while encouraging personal growth with better mental and physical health after therapy. Circular 31/2017/TT-BGDĐT also urged to increase activity in psychological consultation in Vietnamese schools, aiming to make beneficial and positive consultation service accessible for all students.", "The way to implement this circular is first, schools and especially head of schools must establish a consultation department, set out rules and systems to provide counseling services for students. Survey and analyzed data of psychological issues or concerns from students is needed to observe, follow through and update to the local government. After concluding a report, head of schools must submit it to head departments on a regular period for check up and open conferences to discuss any new occurrence of issues. Heads of the educational systems must also implement this circular in all schools under their control, and they play an important role to instruct, check up and observe the progress during the implementation process. Furthermore, schools and heads of educational systems must research and advise the People's Committee about relevant policies to aid or motivate consultants and teachers providing the service with consideration to the financial and social condition of the region. In addition, education facilities must open training sessions for consultants and teachers to make sure they have sufficient skills to consult students, as well as communicate between higher ups and the schools under supervision to quickly update progress and report any sudden problem. The Ministry of Education and Training also has to play their part in cooperating with relevant agencies to implement, monitor and check up this circular in facilities, while earning reports from education facilities and organizing training or certificates for teachers and consultants. The ministry must also integrate information regarding psychological consultation into the curriculum and activities of schools and facilities to raise students’ awareness. Another role that is mentioned in Circular 31 are facilities specialized in training psychological consultation. They must survey, organize training plans and curriculum to address the need in the region and/or facility, while also create necessary documents and provide certificates for teachers and consultants who meet the requirements.", "The result was not that promising. Some schools do not have sufficient staff members who are well trained for such a role, meanwhile students are still holding back because they want to avoid meeting teachers who teach them in class as well as being afraid of being discriminated against (Mai, 2022). Policy mechanisms are not satisfactory, and some schools did not acknowledge the importance of psychological consultation, thus leading to the fact that some students receive help later than expected. Service rooms are not suitable (due to the lack of aesthetic and care, continuity, confidentiality, stability, support, or other aspects of a consulting room that plays an important role in helping students to process emotions, open up and engage attentively with the clinicians (Punzi & Singer, 2018)) or not provided, and consultants or teachers are lacking relevant documents, handbooks and guidelines. On December 22, 2021 - 3 years after implementing Circular 31 and 33, there were 40 over 53 local Ministry of Education and Training (75%) raised written plans to implement Circular 31; 35 over 53 local ministries (66%) divided works to teachers to organize psychological consultation service; and 28 over 53 (52%) built and incorporated policy framework for teachers and consultants (including reducing teaching hours for teachers who were assigned both jobs) (Báo Nhân Dân, 2023). While the numbers are promising, it is highly possible that the majority of them were big cities, while the issue of mental illness is more perturbing in the rural or less developed regions. According to a report made by UNICEF Vietnam in 2018 and 2022, in 2018, there were 12% of students in need of psychological counseling services (UNICEF Việt Nam, 2018b), but in 2022, data given by the Vietnamese government as well as private studies have concluded that the number stays the same even after 4 years, which is still alarming for the least (UNICEF Việt Nam, 2022b).", "Circular 33 in 2018 was made after Circular 31 that includes instruction for social activities in schools. The Ministry of Education and Training also cooperated with global organizations such as UNICEF, Good Neighbours International (GNI), Room to Read (RtR), or national committees like Ministry of Labour - Invalids and Social Affair, the Central Executive Committee of the Ho Chi Minh Communist Youth Union, …(Báo Nhân Dân, 2023). Psychological consultation for highschool student handbooks by famous doctors like Trần Thành Nam were also made to better guide consultants to aid students in any and all circumstances. In June 2023, the Ministry of Education and Training successfully organized training on using documents and skills for psychological consultants (which focused mainly on self-harm behavior and prevention), as well as included hotline 111 for children protection and website of the facilities to further reach students who are not available for face-to-face consultation. There were consulting groups that were established in both public and private schools, consultation services were also intertwined into extracurricular lessons, as well as weekly community gatherings that taught knowledge and skills for the major population.", "Impact on Vietnamese Youth", "The Circular provided accessible consultation service to help students feel safer while studying at school, and focuses specifically on preventing bullies or self harm behavior, while helping students to get through trauma and reintegrate back into their school life. Other than that, the circular pushes school consultants to teach and expose students to new soft skills, attention skills, independence, and strong will. Without this circular, schools that were struggling to implement psychological consultation services cannot address the need of improving mental health during stressful periods from students and parents, or find trouble in dealing with mental issues, bullying and suicidal cases. The lack of guidelines would also prolong the issue of long-term depression, affecting youth in learning, focusing and absorbing heavy knowledge during studies.", "On a long term note, the circular helps schools to create a safe environment in which students will feel safe studying, including avoid and prevent harmful behaviors at school, reduce suicidal, depression and bully rates for students and ensure that the consultants as well as other school workers have experiences to deal with mental health issues and related causes or consequences. The circular also raises awareness about the importance of psychological consultation in school, and mitigate the high suicide and crime rate of students in Vietnam to aid the government in resolving the issue altogether. The environment without awareness about mental wellbeing will see the increase of people stereotyping seeking psychological consultation services as being crazy or having severe mental issues, otherwise they do not consider psychological counseling to be important, thus failing in addressing heavy mental issues which later can pose a major threat in any students’ life. Finally, the circular encouraged the increase of productivity in learning because students no longer have to suspend or deal with mental health issues while struggling to learn and do schoolwork, thus giving them more chances to study better, more efficiently and contribute to Vietnamese and global society.", "In actual practice, there are three reports, from Cương Gián 1 primary school in Hà Tĩnh, Bình Xuân primary school in Tiền Giang and Minh Lập secondary school in Đồng Nai which detailed the progress of implementing psychological consultation in three years after Circular 31 publication. These reports are not promising, and show a major problem regarding the process of training and recruiting teachers and consultants for the service as well as opening consultation rooms.", "For Minh Lập secondary school in Đồng Nai, there were no reports of counseling cases, while related activities and organization works are average without anything noteworthy (Đặng, 2021). The reports claimed that teachers who took this role were busy and the consultation process were deemed unprofessional, while also mentioned the unwillingness of students to open up for discussion. The school stated in the report that they did not have a specialized consultant nor counseling room, but the general evaluation seems superficial, the limits are unclear or were not considered, which hinted at the lack of any actual progress made for the implementation process. The solutions and future plans are not insightful - it only stated that the counselor' works will be maintained and there will be coaches for training, as well as a general mention of campaigns to spread awareness.", "In Cương Gián 1 primary school, 23 cases have been reported for three years of implementation, which is quite a significant number, but in detail, 12 of such cases were disabled children who struggled with learning, 4 cases were related to health issues, 4 cases of parent consultation and 3 specific cases in which students abandoned schoolwork for games (Hoàng Thị, 2021). Through this number, it seems as though the majority of the cases which went through psychological consultation was mostly about disabled students. The report also stated tha
