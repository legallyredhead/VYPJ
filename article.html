<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYPJ — Publication</title><link rel="stylesheet" href="styles.css"></head><body data-page="article"><div class="site"><header class="top"><div class="brand"><a class="logo" href="index.html">VYPJ</a><div class="tag">Vietnam Youth Policy Journal</div></div><nav class="nav"><a href="index.html">Home</a><a href="index.html#publications">Publications</a><a href="about.html">About</a></nav></header><main id="content"></main><footer><span>Vietnam Youth Policy Journal</span><span>Youth-led policy writing from Vietnam</span></footer></div><script>window.VYPJ_DATA=[{"slug": "failure-of-education-system-delivering-language-studies", "title": "Failure of Education System: Delivering Language Studies", "author": "Anna", "type": "Journal", "source": "Anna/Failure of Education System_ Delivering Language Studies.docx", "paragraphs": ["Failure of Education System: Delivering Language Studies", "Abstract", "This paper:", "delves into a critical analysis of Vietnam's educational system, with a focus on language studies.", "looks into the difficulties and flaws that prevent language education from being delivered effectively, which affects both the standard of instruction and the general results of learning.", "examines the current curriculum, instructional strategies, and institutional frameworks, this study seeks to illuminate the structural shortcomings that obstruct Vietnamese students' language learning.", "examines the intricate interactions between several factors that lead to the shortcomings in language teaching, including teacher preparation, resource distribution, and cultural effects.", "through Decision No.2080/QD-Ttg published in 2017 by the Vietnamese Prime Minister.", "Introduction", "As it shapes the intellectual capital and competencies of a country's populace, education is a key factor in the socioeconomic development of that country. In Vietnam, a country experiencing rapid economic expansion and increased international integration, the effectiveness of its educational system becomes critical. With such a development, language proficiency becomes even more essential to the success of cross-cultural communication and global participation. However, there are many apparent areas for improvement in language instruction, as presented currently in Vietnam, as many other factors such as competition and underqualified teachers complicate the matter. This article seeks to carefully look into the structural flaws in the educational model, particularly as they relate to language studies through the standards agreed upon by Decision No.2080/QD-Ttg published in 2017 by the Vietnamese Prime Minister.", "Through a detailed analysis of components such as curriculum design, instructional strategies, institutional structures, and socio-cultural agents, this study aims to clarify the complex variables that lead to the subpar effectiveness of language instruction in Vietnam. Beyond simply identifying problems, the ultimate goal is to provide insightful analysis that could guide wise reforms and innovative interventions, creating an atmosphere that supports the effective teaching of language studies in the Vietnamese educational system.", "Policy Overview", "No. 2080/QĐ-TTg: DECISION on the approval of adjustments and additions to the Project entitled “Teaching and Learning Foreign Languages in the National Education System, Period 2017-2025”", "Guideline:", "In pursuit of enhancing foreign language education across the nation, the Vietnamese government has embarked on a comprehensive set of strategic initiatives, outlining the direction of these improvements. These actions, carefully designed and implemented, aim to elevate language teaching and learning at every level of the education system. Through this legislation, eight concise points have been created as an outline for the education system:", "Making significant progress in the quality of foreign language instruction and learning at all educational levels and training programs, and promoting the teaching of foreign languages in social studies and early childhood education;", "Encouraging the integration of teaching foreign languages (FLs) with other topics (such as math, science, and specialized majors), all while utilizing English as the primary language of instruction;", "Encouraging the use of cutting-edge technologies in the teaching and learning of foreign languages by implementing e-learning platforms that are appropriate and available to everyone, enabling them to learn languages on any device, at any time, and with a focus on improving speaking and listening abilities;", "Establish environments that support the learning of foreign languages in families, schools, and the community so that students, instructors, and family members can all study these languages together;", "Assure the pedagogical competence and competency in foreign languages of foreign language instructors in schools and universities, as well as those who instruct in other topics and provide foreign language majors;", "Enhance the capacity for national testing and assessment in the teaching and learning of foreign languages;", "Provide prioritized support in improving foreign language teaching and learning in disadvantaged areas;", "Encourage and publicize the use of foreign language centers for instruction and learning of foreign languages outside of the classroom;", "Improve management of the Project to ensure its practicality, feasibility, and effectiveness.", "Impact on Youth and Critical Analysis", "In addressing this decision, this journal will disseminate the listed outlined directory for foreign studies in the following years in the context of events leading up to 2024.", "Achieved", "Making significant progress in the quality of foreign language instruction and learning at all educational levels and training programs, and promoting the teaching of foreign languages in social studies and early childhood education.", "According to the annual report, the Ministry of Education and Training completed developing and disseminating the foreign language curricula for the 2018 general education program. To date, all 63 provinces and centrally controlled cities in the country have adopted the English curriculum for Grades 1, 2, 3, 6, 7, and 10. English language learning activities are available to preschoolers in 53 out of 63 provinces and centrally controlled cities for the 2022–2023 school year.", "According to the survey, 84% of English language teachers in primary schools, 87% in secondary schools, and 77% in high schools in Vietnam meet the requirements for foreign language competency in order to implement the new foreign language teaching programs.", "Encouraging the integration of teaching foreign languages (FLs) with other topics (such as math, science, and specialized majors), all while utilizing English as the primary language of instruction.", "With its emphasis on a comprehensive approach to learning that incorporates foreign languages into core topics, the Revised General Education Curriculum (2018) represents a momentous milestone in Vietnam's educational environment. The goals, methods of implementation, and effects on the educational system of Vietnam's Revised General Education Curriculum (2018) have been examined in light of its critical role in advancing the country's efforts to integrate foreign languages into core curricula.", "The 2018 Revised General Education Curriculum incorporates foreign languages into core disciplines in a variety of ways. First of all, it places a strong emphasis on the development of communicative competence in foreign languages, giving learning language skills like speaking, listening, reading, and writing first priority. This communicative method guarantees that language acquisition is useful and adaptable to actual circumstances.", "The curriculum also encourages the use of real-world resources and activities that place language learning within the framework of fundamental topics. Teachers can construct meaningful learning experiences that engage students and encourage language acquisition by utilizing multimedia tools, authentic texts, and project-based activities.", "Additionally, the curriculum promotes collaborative teaching methods in which language and subject matter experts collaborate to create cohesive lesson plans and educational activities. By ensuring that language learning objectives and subject-specific goals are in line, this cooperative method boosts the efficacy of integrated language training.", "This Revised General Education Curriculum held its position as a significantly binding structure of the Vietnamese education system and showed the nation’s furthered steps toward the direction and aim that it has announced, especially within this sub-topic of decision No. 2080/QĐ-TTg.", "Encourage and publicize the use of foreign language centers for instruction and learning of foreign languages outside of the classroom.", "Under the 1986 Đổi Mới (Renovation) strategy, Vietnam underwent a period of economic and social transition that had a significant impact on many facets of society, including education. As Vietnam continues to integrate into the global world, there have been considerable improvements and advancements in language instruction in particular.", "Bringing the growth of knowledge and spurts of learning outside of the classrooms, a wide variety of language centers have spread across the cities of Vietnam, differing with regard to scope, intended audience, pedagogy, and cost. Offering established curricula, state-of-the-art facilities, and licensed instructors, large multinational chains like Wall Street English, ILA Vietnam, and Apollo English have a substantial presence in key cities like Hanoi and Ho Chi Minh City. Smaller independent language schools, on the other hand, concentrate on conversational skills or test preparation, catering to specialized markets or language demands. Furthermore, online platforms and apps have grown in popularity, offering busy professionals and students flexible and easy learning options.", "Encouraging the use of cutting-edge technologies in the teaching and learning of foreign languages by implementing e-learning platforms that are appropriate and available to everyone, enabling them to learn languages on any device, at any time, and with a focus on improving speaking and listening abilities.", "The current state of e-learning platforms for language learning in Vietnam is characterized by a wide range of options that cater to different needs and preferences. Prominent global platforms like Duolingo, Rosetta Stone, and Babbel are easily accessed and provide Vietnamese language learners with an extensive selection of language courses available in different languages. Furthermore, there exist locally created platforms and programs designed exclusively for Vietnamese language learners, offering Vietnamese-language information while emphasizing often-encountered foreign languages including English, Chinese, Japanese, and Korean.", "E-learning platforms in Vietnam are increasingly prioritizing the development of speaking and listening abilities through innovative features and interactive exercises, allowing learners to practice speaking in real-world contexts through virtual speaking partners and conversation simulations.", "2. To be improved on/Unachieved", "Establish environments that support the learning of foreign languages in families, schools, and the community so that students, instructors, and family members can all study these languages together.", "A deeper look reveals a number of obstacles and constraints with the idea of creating settings that support foreign language acquisition in Vietnamese families, schools, and communities. Efforts to encourage language acquisition in diverse contexts are definitely underway, but the existing state of affairs in Vietnam poses challenges to their successful execution.", "A centrally recurring theme in regards to this outlined incentive lies deep within the core values and beliefs of the Vietnamese society, though this is a means of generalizing or stereotyping, these views are those “traditional”, and evidently present amongst many citizens here.", "In Vietnamese culture, the family plays a central role, and while familial support for education is valued, the emphasis is often placed on traditional subjects such as mathematics and sciences rather than foreign languages. Many families prioritize academic subjects perceived as directly contributing to career prospects and economic stability.", "Even in cases opposing those above, not all families have the means or educational background to actively encourage learning a foreign language at home due to socioeconomic gaps, even if they were in agreement with the more open-minded views of language studies presented now.", "Though there have been efforts of encouragement and promotion to create environments of engaged foreign language activity, the realistic outcomes prove feeble and unyielding, and a field much needed to be further invested in and improved on.", "Assure the pedagogical competence and competency in foreign languages of foreign language instructors in schools and universities, as well as those who instruct in other topics and provide foreign language majors.", "The importance of pedagogical competence in foreign language instruction cannot be overstated, especially in a country like Vietnam where language proficiency is increasingly valued for academic, professional, and personal advancement. In not only regions nearing this country but internationally as well, tests and degrees have been a long-standing method of certification of competence in specialized fields or expertise.", "Though many of these tests are internationally accredited and used as an applicable form of criteria, it is extremely difficult to take into account the matter of language fluency and cogency in areas where a specific language is not common and used primarily, especially in the case of English.", "In foreign language studies, education in these areas, writing, reading, and listening are the most commonly prioritized above all. This is mainly due to the “textbook” nature of these skills, where an instructor merely has to teach a rigid set of rules and patterns of said language. What these responsible individuals may lack just as much as their pupil does, is verbal language fluency. Once taking languages off of paper and into verbal dialogue, even the studied educator can have a hard time with their language flow, taking into account the difficulties in learning rhythmic patterns, intonation, and annunciation that one usually acquires from direct interactions.", "This is primarily due to a lack of exposure to proper exchanges of the language, where additional senses are now needed instead of merely using sight to read up on a topic. With dialogue, you must listen and mutually converse with someone fluent in order to correctly learn.", "Without this reassurance in correct pronunciation and tone, many educators, co mmonly those in the public education system, end up with a shot in the dark. There is no one around to correct them, and so misinformation and miscommunications are passed down to their students, who are also now adhering to improper verbal language.", "Even if they are eloquent in all other skills needed in a language, speech remains one of the most, if not the most, crucial, seeing as language, at its core, is a means of communication, one that is most prevalently verbalized.", "Enhance the capacity for national testing and assessment in the teaching and learning of foreign languages.", "With a primary focus on evaluating English proficiency, Vietnam has constructed a national testing framework for foreign languages. The National Foreign Language Project 2020 (NFLT), the Cambridge English Qualifications, and standardized assessments like the TOEFL and IELTS are the most well-known English language exams. With the goal of evaluating students' speaking, listening, reading, and writing abilities, these tests offer standardized, nationally and internationally accepted measures of competency.", "Yet, the foreign language tests that need to be discussed are those accredited only nationally, otherwise known as tests and exams made by the Vietnamese Ministry of Education and Training in the public education system. These tests are incorporated directly as a grading mechanism for public academic records, and so are developed and created nationally instead of having an international system of credit.", "Despite the existence of standardized tests, several challenges persist in the assessment of foreign language proficiency in Vietnam. The emphasis on rote memorization and exam preparation, which might not fairly represent students' communicative ability or practical language abilities, is one major obstacle. Furthermore, differences between classroom instruction and test expectations might arise from an inconsistency between assessment techniques and pedagogical approaches, which can result in test-oriented teaching as opposed to meaningful language learning.", "Provide prioritized support in improving foreign language teaching and learning in disadvantaged areas.", "The current situation of foreign language teaching and learning can be defined of their lack of basic infrastructure and resources necessary for effective language education. Textbooks, teaching materials, and audio-visual resources essential for language learning are harder to come by for schools in rural and isolated locations. The difficulties these groups encounter are further compounded by the lack of certified language teachers, as many schools use inexperienced or underqualified teachers to teach foreign languages.", "In these environments, a lot of families find it difficult to prioritize language education over more pressing financial issues or to finance additional language learning tools. Furthermore, migration patterns may interfere with kids' education, increasing the likelihood of dropouts and causing uneven access to language learning.", "In response to this continued state, the Vietnamese government has put in place a number of initiatives and regulations targeted at enhancing language instruction in underprivileged communities. For instance, there are provisions in the National Target Program on New Rural Development for improving language instruction in rural areas. Furthermore, programs like the Vietnam-Korea Vocational Training College in the province of Lao Cai and the National Foreign Language Project 2020 have improved language education possibilities for pupils in underprivileged areas.", "Conclusion", "This examination of the Vietnamese education system's shortcomings in delivering language studies reveals a critical need for reform and innovation. The issues raised—such as outmoded instructional strategies, a lack of resources, and little exposure to real-world language use—highlight how urgently radical reform is needed. In order to address these problems, legislators, educators, parents, and students must work in collaboration.", "Prioritizing student-centered strategies that encourage active learning, critical thinking, and linguistic competency in everyday situations is essential going forward. The effectiveness and quality of language instruction can be improved by making investments in technological integration, current teaching materials, and teacher training. In addition, encouraging language exchange and cultural immersion opportunities can broaden students' horizons and improve their language proficiency.", "References", "en.baochinhphu.vn (2022). National target program on new-style rural area building for 2021 - 2025 approved. [online] en.baochinhphu.vn. Available at: https://en.baochinhphu.vn/national-target-program-on-new-style-rural-area-building-for-2021-2025-approved-111220302153824447.htm [Accessed 3 Mar. 2024].", "Thanh Nien Newspaper. (2023). Top 5 popular online learning programs today - Vietnam.vn. [online] Available at: https://www.vietnam.vn/en/top-5-chuong-trinh-hoc-truc-tuyen-duoc-ua-chuong-hien-nay/ [Accessed 3 Mar. 2024].", "Van, V.H. (n.d.). Interpreting MoET’s 2018 General Education English Curriculum. [online] Available at: https://www.researchgate.net/publication/368789734 Interpreting MoET%27s 2018 General Education English Curriculum [Accessed 3 Mar. 2024].", "VNA (2023). Annual report on teaching and learning of foreign languages in Vietnam published. [online] SGGP English Edition. Available at: https://en.sggp.org.vn/annual-report-on-teaching-and-learning-of-foreign-languages-in-vietnam-published-post107268.html [Accessed 3 Mar. 2024].", "Summary (For PR)", "Author: Lê Hồng Hà Anh", "With rapid economic expansion and growing international integration, the flaws in Vietnam's language education system have never been more apparent.", "The paper examines the shortcomings in Vietnam’s approach to language education. Despite policy efforts like Decision No.2080/QD-Ttg, the system struggles with pedagogical competence, underqualified teachers, and unequal access to resources. The paper calls for urgent reforms, emphasizing the need for improved teacher training, technological integration, and better support for rural areas to ensure effective language education nationwide.", "Achieved:", "Improving teaching standards: 83% of teachers across primary, secondary and highschools now meet foreign language competency requirements", "English curriculum: Adopted in all 63 provinces for Grades 1, 2, 3, 6, 7, 10", "Revised General Education Curriculum (2018): Foreign languages integrated into core subjects like math and science", "Growth in language centers and e-learning platforms: Duolingo, Wall Street English, Apollo English => Learning outside of traditional classrooms", "Unachieved:", "Technological advancements have not been fully leveraged in many areas, and the integration of e-learning remains inconsistent across the country​", "Teachers, particularly in rural areas, often lack fluency and effective pedagogical skills, with many relying on outdated, textbook-driven teaching methods", "While foreign languages are integrated into the curriculum, assessment practices focus too heavily on rote memorization, limiting students' practical language skills​", "Note: Các em xem abstract (trang đầu tiên) nữa nhé!"]}, {"slug": "shock-sex-and-scandal-a-look-at-sensationalism-in-journalism", "title": "Shock, Sex, and Scandal: A look at Sensationalism in Journalism and Media of Vietnam", "author": "Chau Anh", "type": "Journal", "source": "Chau Anh/Policy Journal CA.docx", "paragraphs": ["Shock, Sex, and Scandal: A look at Sensationalism in Journalism and Media of Vietnam", "“Journalists and reporters who want to write well must, first and foremost, write correctly.”", "- Định Nam, Người làm báo", "Introduction", "The media landscape of Vietnam, in general, has always been one of great complexity and controversy. Journalism and media in this nation are woven with deep-rooted social, economical, and political issues that are challenging to both navigate and comprehend. Within this environment, one of the most prominent concerns that, unfortunately, is still on the rise, is the influence of sensationalism.", "Sensationalism, characterized by its penchant for exaggerated or emotionally charged content, has unfortunately entrenched itself within mass media and news outlets in Vietnam. With its roots from tabloid journalism (Wang, 2012), sensationalism prevails - from the purposive selection of emotive language in headlines to the allure of infotainment, where entertainment supersedes information of social significance and value, the act is omnipotent in Vietnam’s mass media.", "Adopting an issue-commentary standpoint, this research endeavors to dissect the underlying mechanisms driving sensationalism, identify the impacts this phenomenon has on Vietnamese youth, and offer solutions and policy recommendations aimed at mitigating the =issue at hand. Even though sensationalism also consists of the purposive use of visual stimuli, this paper will only take into account the textual elements of the news themselves, including the title and the news written, and eschewing visual components. By focusing solely on textual elements and using real-world examples from Vietnamese news outlets to support its arguments, this study aims to provide a comprehensive analysis of the issue at hand.", "All in all, this paper aims to shed light on sensationalism - a critical aspect of Vietnam's media landscape, in hope of laying the groundwork for informed discourse and actionable change in the future for Vietnamese youth.", "Issue overview and analysis", "Sensationalism and infotainment - a two-sided relationship", "It is not difficult to find low-quality and over-sensationalized news on the digital news outlets in Vietnam. Sensationalism, as defined by Otto in his paper “The Softening of Journalistic Political Communication”, in which he presents a multilevel framework model of softening of political communication, is “Coverage with making use of journalistic strategies and verbal/visual production features, aiming at assumed effects on audience.” (Otto, 2016) It is also in this paper that Otto argues it is important to take into consideration both sides of sensationalism - that is, the production side (content, visual style…) and the ‘effect’ side from readers. “Sensationalism represents a specific kind of journalistic coverage aiming at triggering certain recipient reactions (attention, emotions) by using specific sensationalist production features within a single news item.” Thus, in order for sensationalism to be effective, both the audience and the journalist have to play a role: news outlets producing and the audience engaging. Therefore, simply put, sensationalism is the intentional production of news coverage that aims to evoke desired reactions from recipients, which is the average reader or news consumer.", "The main issues of sensationalism in Vietnam media coverage that this paper has identified are over-exaggerated news titles, unverified images and information, and a lack of substantial or valuable news. The latter is especially prominent in ‘infotainment’ - a combination of information and entertainment, a neologism used to refer to the hybrid style of journalism that, according to the Cambridge dictionary, is “the reporting of news and facts in an entertaining and humorous way rather than providing real information”. Smaller digital press agencies are usually guilty of this, however, it is important to note that established news outlets in Vietnam also employ both sensationalist news and infotainment as well; examples of which will be analyzed later in the paper. Infotainment, by its nature, is not harmful - it is simply a tendency of news outlets to produce news that are more ‘celebrity centered’, and Wang divides the definition of ‘Celebrity news” into four subcategories: “, sports, culture (entertainment industry), royalty, and celebrities (celebrities of great notoriety, less famous celebrities, and other) (Wang, 2012).", "Competition and economic pressure", "The problem lies in the tabloid journalism approach that can be seen increasing in Vietnam media due to its extreme competition and growing demand for information by citizens: As of 2023, there was a total of 671 magazines and 127 press agencies; with 41,000 active members of the journalism industry (Infographics, 2023). Fueled by a views-driven motive and to keep their audiences as engaged as possible during this era of mass information, news outlets find themselves pressured to deliver news that tend to the mass’ need for entertainment in such a fast pace that quality is often neglected and entertainment prioritized. In other words, since “[journalists and news managers] are forced to borrow and adapt characteristics from entertainment genres and modes of conversation and communication that privilege an informal style with its emphasis on storytelling skills and spectacle” (Thussu, 2015), this results in a tabloid approach and low-quality infotainment and sensationalized news on the media landscape of Vietnam.", "The overt use of sensationalism is fueled by economic imperatives within the media industry, where agencies resort to sensationalist tactics in a bid to drive up viewership amidst fierce competition and economical changes. “Vietnamese media often attempt to gain profits by publishing sensational content while at the same time abiding by the Communist Party’s interests.” (Yen-Khanh, 2022). This in effect creates a hybrid media environment of Vietnam; a combination of neoliberalism and authoritarianism, of which breeds a commercialized and profit driven industry of mass media.", "Another crucial component that adds to the extreme competition in the news industry is the popularity of social media. According to the statistics by the Ministry of Information and Communications, in 20221, access to digital news systems had decreased by more than 10%, even though there are an astounding 77 million active users of social media in Vietnam as of 2023, which is roughly 71% of the population. With instant and free access to information, it can be observed that the mass now have a tendency to gravitate short and condensed, and usually unverified, information on social media platforms.", "Shock, Sex, and Scandal", "Researcher Nguyễn Đình Hậu at the University of Social Sciences and Humanities coined the phrase \"Shock, Sex, and 'Sến\" (direct translation: cheesy) to describe the tendency of presses to resort to sensational topics that often revolve around shocking news, sexual content, and 'Sến’ - meaning the informal language used in such reports, under economic pressures and competition. This paper proposes that the latter be replaced by another component: Scandal.", "From a linguistic perspective, the media landscape of Vietnam is rife with deliberate use of overly sensitive and strong adjectives to evoke curiosity among readers - a phenomenon that can be viewed as one of the consequences of a views-driven industry.", "According to a study presented in Bao Nghe An (Nghe An News), readers tend to gravitate toward news that contain clickbaiting headlines; in the following order:", "Titles that contain exclamatory words", "Long titles", "Titles that contain adverbs, verbs, adjectives", "Short titles", "Contain questions the audience or use words that suggest questioning in readers", "Adding to this sentiment, Digital Journalism Professor Vũ Cường of Academy of Journalism and Communication argues that though the importance of crafting an engaging title is undeniable in the press industry, many journalists are violating professional ethics by creating sensational titles for topics that are “immoral or of social values”. Though the study by Slattery et al. (2001) argues that topics that are inherently sensational, for instance, crimes and accidents, will inevitably sensationalize the news about them, it is the practice of intentional and at times, immoral title-crafting by journalists in Vietnam that begs the question of unethical practice of sensationalism. In addition, the problem does not solely lie in these titles; it is the presentation of the news itself that is extremely sensationalized and of low-quality. “ [The publications] purvey the weird and the salacious in crime stories culled from police records, all published in the name of exposing social problems.” (Heng, 2000). Below this paper will provide examples and analysis for the three categories of shock, sex, and scandal.", "1c. SHOCK and SCANDAL", "Upon clicking on the tag “Shocking news” (Translation: Tin sốc) of any type of Vietnamese digital newspapers or magazines, one can find a myriad of sensationalized news that offer little value or knowledge to readers, especially news that focus on celebrities. This type of shock-bait is much more common with ‘infotainment’ – the news of celebrities and the ‘showbiz’, or accidents that involve deaths or casualties. These types of news are identifiable in the click-baiting titles, with popular words including “sốc”, “kinh hoàng”, “choáng với” (Tú, 2015). These overly expressive and emotional words suggest a lack of objectivity of the news, which can create a tendency for readers to undermine such news. One concern that arises from these constant use of adjectives is desensitization of readers from emotional news. Administrator of The Forum, Mr. Mai Phan Lợi, proposes a legitimate hypothetical situation: Two traffic accidents, one resulted in 6 deaths, the other 18. Both are reported with the title: Horrifying: traffic accident resulted in 6/18 deaths. This will create confusion for the reader, as they are unable to grasp what qualifies as being ‘horrifying’, and how many deaths can be qualified as such.", "In some cases, the titles do not contain any such adjectives, but are completely misleading and, instead of being a title, it acts as a statement, which parades as legitimate information and can mislead readers if they only skim through the titles - a habit that many have. An absurd example is from 2013, when multiple credible news sites ran titles that concern the health conditions of Superstar Angelina Jolie. “Superstar Angelina Jolie can only live for around 3 more years” was the title of an article on Thanh Niên, a recognizable press with a long history in Vietnam. The declarative tone of the title can actually mislead readers into believing that the information is confirmed and accurate. However, upon clicking on the article, it offers no explanation on why the celebrity could only live for 3 more years, but rather only details irrelevant information about Jolie’s life after her breast surgery. The article shows no evidence or citation that can back up its very much exaggerated and outright misleading claim. In addition, when searching for this title, the average reader will find the nearly exact article posted on multiple other outlets, consequently mistaking the news to be true. To put it shortly, this is borderline misinformation.", "2c. SEX", "Even credential and established news outlets in Vietnam can also sometimes be guilty of tabloid journalism, especially when it comes to the topic of female celebrities. The misogyny are sometimes deep-rooted within the reporting of such topics, and are not hard to identify. These female celebrities are usually painted in a sexual light, with articles that sometimes neglect totally their talent and only focus on their appearance or sexual appeal. In these cases, the average reader can find words meant to pique interest and arousal with high frequency of appearance, including but not limited to: Leaked (lộ/lộ hàng/lộ ảnh), “showing off one’s figure” (khoe/thả dáng) (Hậu, 2015). Another few that this paper has identified are “bỏng mắt với\" (eye-burning), “fiery/on fire\" (bốc lửa), and “provocative\" (gợi cảm).", "Take the article “Loạt ảnh thon gọn sexy của Mỹ Tâm đập tan tin đồn mang thai 4 tháng với \"phi công trẻ” (translation: “My Tam’s sexy figure in recent photos abolished pregnancy allegations with her young lover”), published in 2020 by Dân Việt, for instance. Though the article did briefly mention her talent, the rest of the paper are slideshows of pictures of the artist My Tam in revealing clothes, with little to no captions under each. The article also shows a hint of fatphobia - mentioning how My Tam once accidentally showed her “thick thighs and unflattering waist”, as well as constant praises for the singer’s ‘successful’ weight loss transformation: “The singer has successfully lost weight, hence she can confidently wear tight clothes.” The meaning and message of this article is questionable, non-existent even. It plays two roles: One as a sexually-charged dose of content, and another as insecurity and beauty standards consolidation and reminder for other Vietnamese women. And of course, the news is not substantial in any way, is sexual in nature, and devoid of meaning and knowledge.", "In summary, shock, sex, and scandal are the three most common shortcomings of Vietnam’s production of tabloid journalism and media.", "III. Impact on youth", "There has been little to no research done in regards to the impact of sensational news and titles on the Vietnamese audience. However, various foreign studies have pointed out how the intentional reporting of news, or generally speaking, sensationalism in different media can have an effect on the audience. This paper identifies two main issues arising from sensationalism that can have a considerable impact on Vietnamese youth: Desensitization and Perceived Language Intensity.", "Desensitization", "Repeated exposure to sensationalized news can have desensitizing effects on the audience. (Lowe, 2016) uses prime examples from the past, including 'shocking' events, including the Vietnam War and the First Moon Landing and studies how the press coverage presents such news, and the effects it had on the audience. Through the analyses, it is concluded that the growth of mass production of news also entails the growth of sensationalism, and this, in effect, desensitizes the audience. \"[...] as audiences were exposed to a greater amount of sensational content, they became desensitized to it, which in turn raised the level of shock value a piece of work must possess in order to elicit a response from the audience.\" This constant cycle of repeated exposure of shocking news produced by the press and desensitization of the audience only exacerbate the tendency of presses to resort to sensationalism further as an attempt to draw attention and evoke responses from the audience, hence gaining more profit.", "There have been various studies that suggest a correlation between constant exposure to sensationalized news, especially violent news, and desensitization. (Anderson, 2003) findings reveal that media violence increases aggression and violent behaviors; short-term exposure leads to the \"likelihood of physically and verbally aggressive behavior, aggressive thoughts, and aggressive emotions\", while long-term exposure may result in behavioral aggression later in life, including domestic abuse and assaults. While not concerning the press media but rather video games, a study in 2009 also supports the hypothesis exposure to violent media will decrease helping behavior in people and \"make people numb to the pain and sufferings of others.\" (Bushman, 2009)", "2. Perceived Language Intensity", "One of the effects that sensationalism can have on the audience is manipulating and evoking readers' emotions. Language intensity is a concept whose definition is rather unclear and \"problematic\" (Liebrecht, 2019). In its simplest form, it refers to the intensity of language created by the use of language intensifiers, also known as adverbs. (Renkema, 1997) proposes that language intensity can take the following forms: word replacement (horrible instead of bad), word addition (awfully bad), rhetorical devices (e.g. metaphors), or typographical elements (cool!!! instead of cool).", "Seeing how language intensifiers can influence the audience, (Burgers & de Graaf, 2013) proposes that language intensity has been employed as a feature of sensationalism in print media. Using Perceived Language Intensity (PLI) as the metric, the researchers carried out two experiments to test their hypotheses concerning how the use of intensifiers and framing of news can a) increase PLI b) have an affect on \"newsworthiness, attitude towards the news article and (c) belief content\" and c) how positive/negative framing of content using intensifiers can increase PLI. Overall, the two studies' results mainly confirmed that language intensifiers have in effect on PLI, \"indicating that readers indeed experienced texts with intensifiers as more intense and arousing\". One of the experiments also suggests that the use of intensifiers may decrease the quality and credibility of the news.", "The issue of manipulating the audience through language intensity is that since the majority of sensationalized news is negative, it can also encourage harmful behaviors in readers as well. An article in the ​​Al Jazeera Media Institute gives suggestions on how suicides should be reported ethically, or else it may lead to 'copycat' effects of people imitating the tragic act that they see on the news. \"Including specifics about the method of suicide should be avoided in coverage, as it could potentially serve as a model for others. Furthermore, details concerning the individual's personal life, including images of the suicide location, any notes left behind, or other personal information, should also be omitted.\" (Ayyoub, 2023). However, when reporting cases of suicides, many presses in Vietnam are still guilty of including images, or even videos, of the suicide (or attempts) in the articles. For instance, an article in Thanh Niên: \"Bảo vệ trường kể giây phút cứu nữ sinh lớp 6 treo lơ lửng trên tầng cao\" (Rough translation: School's guard recounts the moment he saved 6th-grade school girl dangling up high) in 2021 includes a 1 minute and 30 seconds video of the girl holding on to the rail of the balcony, with voiceovers reporting the news in the background. This overt use of the medium as a sensational feature undoubtedly would not only cause uneasiness in readers but can also act as a model for many other naive and mentally unstable youngsters.", "3. Narratives and attitudes shaping", "Unfortunately various tabloid reports of scandal or celebrity news, especially female celebrities, reek of misogyny. This might be a result of a deep-rooted patriarchal society that Vietnam developed from, paired with the rigid beauty standards that have been exacerbated by social media and editing apps. News of female celebrities are usually presented in a much sexual light, as well as unnecessary emphasis or commentary on their appearance. The way the press refers to women is also jarring: they are usually defined by their marriage with their (usually more popular) husband, or more surprisingly, their pregnancy or parental status. One of the most popular phrases are “gái một con\", usually followed by a compliment of the celebrities’ body. In fact, an article published by Vietnamnet questionably focused on female celebrities’ breast size after they’ve had children: “Gái một con có vòng 1 đẹp nhất showbiz Việt”. The article is full of praises for the celebrities for having an amazing appearance and body ‘bounceback’ after giving birth. Being constantly spoonfed news that depict women in such shallowness and unrealistically cause harm to both men and women. Firstly, a supposedly serious and matter-of-fact space of the online press becomes sexually charged, -[", "IV. Conclusion and Suggestions", "It might be intuitively suggested to the average reader that in order to minimize sensationalism, press agencies should be controlled more strictly. However, I would argue against this sentiment, as it goes against the free, uncensored spirit of journalism in general and of reporting and crafting of news by journalists. What is needed are not rules - but rather, guidelines and policies for journalists to use as reference. The truth remains that sensationalism will continue to exist as long as there is an audience and its need for provocative, shocking, and scandalous news. It is unavoidable - the tendency for sensational news is and will continue to be the byproduct of this age of mass information where each individual is bombarded with constant stimuli. There are, however, methods to alleviate the phenomenon. Firstly, there should be clear and unambiguous policies and professional ethical codes for journalisms. This would help journalists to navigate the complexities of sensationalism and be aware of ethical reporting practices. Secondly, there should be training and education for ethical reporting for journalists. There can be government-funded training sessions and workshops for journalists to educate them on the topic of ethical reporting and presenting of news. And finally, proper and ethical news outlets that have not ‘degenerated' quality-wise and given in to the trend of sensationalism (which is scarce) should be promoted and recommended to readers in Vietnam.", "Works Cited", "Anderson, Craig A., et al. “The Influence of Media Violence on Youth.” Psychological Science in the Public Interest, vol. 4, no. 3, 2003, pp. 81–110, www.jstor.org/stable/40059680.", "Ayyoub, Abeer. “Ethical Reporting - How to Cover Suicide Responsibly | al Jazeera Media Institute.” Institute.aljazeera.net, 2023, institute.aljazeera.net/en/ajr/article/2327.", "Bách. “Giật Tít Câu View: Hãy Là Nghệ Thuật Làm Báo, Đừng Lừa Dối Độc Giả.” Mic.gov.vn, 2015, mic.gov.vn/Pages/TinTuc/tinchitiet.aspx?tintucid=98411. Accessed 26 Feb. 2024.", "Báo Nghệ An. Giật Tít Trên Báo Điện Tử: Vấn đề Đáng Quan Tâm. 2016, baonghean.vn/giat-tit-tren-bao-dien-tu-van-de-dang-quan-tam-post105902.html.", "Burgers, Christian. Language Intensity as a Sensationalistic News Feature: The Influence of Style on Sensationalism Perceptions and Effects. Communications, 2013.", "Bushman, Brad J., and Craig A. Anderson. “Comfortably Numb: Desensitizing Effects of Violent Media on Helping Others.” Psychological Science, vol. 20, no. 3, 2009, pp. 273–277, www.jstor.org/stable/40575012.", "Định, Nam. Những Hệ Lụy Từ Giật Tít, Câu View... 2022, nguoilambao.vn/nhung-he-luy-tu-giat-tit-cau-view.", "Heng, Russell Hiang Khng. “The Media in Vietnam and Freedom of Information - Not yet a Right : Perhaps a Growing Notion.” Dr.ntu.edu.sg, 2000, dr.ntu.edu.sg/handle/10356/87555. Accessed 25 Feb. 2024.", "Hướng, Thiện. “Journalism in Vietnam: Walking the Tightrope between Communism and Capitalism.” Https://Newnaratif.com/Journalism-In-Vietnam/, 2023.", "Otto, Lukas, et al. “The Softening of Journalistic Political Communication: A Comprehensive Framework Model of Sensationalism, Soft News, Infotainment, and Tabloidization.” Communication Theory, vol. 27, no. 2, 16 Nov. 2016, pp. 136–155, https://doi.org/10.1111/comt.12102.", "Thu, Vân. “Báo Chí Trong Lộ Trình Bước Ra Tự Chủ.” Https://Congly.vn/Bao-Chi-Trong-Lo-Trinh-Buoc-Ra-Tu-Chu-6930.Html, 2018.", "Thussu, Daya Kishan. “Infotainment.” The International Encyclopedia of Political Communication, 6 Nov. 2015, pp. 1–9, onlinelibrary.wiley.com/doi/abs/10.1002/9781118541555.wbiepc152, https://doi.org/10.1002/9781118541555.wbiepc152.", "Wang, Tai-Li. Presentation and Impact of Market-Driven Journalism on Sensationalism in Global TV News. International Communication Gazette , 2012.", "Yến-Khanh, Nguyễn, et al. “Neoliberalism and Authoritarian Media Cultures: A Vietnamese Perspective.” Media, Culture & Society, vol. 44, no. 22, 29 Jan. 2022, p. 016344372110602, https://doi.org/10.1177/01634437211060200.", "The Softening of Journalistic Political Communication: A Comprehensive Framework Model of Sensationalism, Soft News, Infotainment, and Tabloidization - Otto", "Lowe, Lindsey, \"Crying Wolf: An Analysis of the Use of Sensational Content within the Media and the Desensitizing Effects it has on Audiences\" (2016). Master's Theses. 4765.", "danviet.vn. “Loạt Ảnh Thon Gọn Sexy Của Mỹ Tâm Đập Tan Tin Đồn Mang Thai 4 Tháng Với “Phi Công Trẻ.”” Danviet.vn, 26 Aug. 2020, danviet.vn/loat-anh-thon-gon-sexy-cua-my-tam-dap-tan-tin-don-mang-thai-4-thang-voi-phi-cong-tre-50202026811593567.htm. Accessed 29 Feb. 2024.", "thanhnien.vn. “Angelina Jolie Chỉ Còn Sống Được 3 Năm Nữa?” Thanhnien.vn, 19 Sept. 2013, thanhnien.vn/angelina-jolie-chi-con-song-duoc-3-nam-nua-185639838.htm. Accessed 29 Feb. 2024.", "thanhnien.vn (“Bảo vệ Trường Kể Giây Phút Cứu Nữ Sinh Lớp 6 Treo Lơ Lửng Trên Tầng Cao”)", "Summary (for PR only)", "“Journalists and reporters who want to write well must, first and foremost, write correctly.”", "- Định Nam, Người làm báo", "The principles of journalism - reporting true and meaningful information have stood for decades and serve as the foundation of Vietnamese journalism. However, as publishing firms and journalists nowadays are met with an enhanced level of economic stress and competition, sensationalism, characterized by its penchant for exaggerated or emotionally charged content, has unfortunately entrenched itself within mass media and news outlets in Vietnam. This led to multiple adverse effects on journalism itself, such as the using of clickbaits and the reporting of “shock, sex, and scandal” news to attract readers. Moreover, sensationalism leave lasting effects on the youth, as they become desensitized or misguided. Though these effects are undesirable, this report believes control over press agencies is not the answer, but rather a mixture of guidelines and education should be implemented in the press industry."]}, {"slug": "evolution-of-diplomatic-policies-in-vietnam", "title": "Evolution of Diplomatic Policies in Vietnam", "author": "HƯƠNG GIANG", "type": "Journal", "source": "HU#U031bO#U031bNG GIANG/Evolution of Diplomatic Policies in Vietnam.docx", "paragraphs": ["Evolution of Diplomatic Policies in Vietnam", "Vietnam is a country that is extremely rich in history, having successfully defended itself against numerous invaders and secured alliances with many countries ever since its creation. Such development has also prompted the advancement of diplomatic policies in Vietnam, which are flexible and made to be well-fitted to whatever era they are in.", "In wartime and the early nation-building era, Vietnam usually utilized diplomacy to plead for freedom and independence alongside military efforts. After the successful August revolution, President Ho Chi Minh became Vietnam’s first Minister of Foreign Affairs, and it was in these initial years of formation that the basic principles of Vietnamese diplomacy were laid out. The late President believed in a diplomatic approach that is “firm in objectives, flexible in strategies and tactics.” In addition, it is important to note that most of this era’s diplomacy was focused on the justification of Vietnamese independence and the prevention of French re-invasion and re-occupation. Thus, President Ho aligned the Vietnamese revolution with the revolutionary trend that was apparent in the world, while also preaching about amicability and friendliness with the international community, including all democratic countries (Nguyen V. L., 2022). This friendly attitude towards all nations was the start of Vietnam’s participation in the Non-Aligned Movement, which later became fundamental in its diplomatic policies. In the end, by joining the global cause of revolution and making additional efforts to fend off the occupation of the Nazi Japanese, Vietnam’s diplomatic plea for independence was able to appeal to the international community, including Allied countries, and secure support and recognition of independence from many of them. This success was felt in and made clear on the diplomatic table at the 1954 Geneva Conference, where the French colonization of Vietnam was resolved and abolished completely, all thanks to the clever diplomatic strategies of the Vietnamese diplomats: to stay firm with our plea for independence and utilize opportunities such as military victories while also considering other nations’ interests and allowing room for negotiation and compromise.", "In the later period (from the resistance war to the pre-Doi Moi independence era), Vietnam emerged as a new and rural-centric country, operating diplomatically with the aid of its socialist allies only, which proved to be extremely limiting for the newly reunited nation. For starters, Vietnam’s strict conformance to the socialist bloc and ideology meant Vietnam was not able to seek new alliances outside of such a bloc. In fact, Vietnam placed its alliance with the Soviet Union at the cornerstone in this era, fostering a strong yet overdependent bond, both economically and diplomatically, with the Union. In addition, Vietnam’s involvement with the Khmer Rouge and the lasting effects of the resistance war further worsened the state of Vietnamese foreign affairs and diplomacy, as the international community placed severe repression policies and trade restrictions on the young nation. At the end of this period, Vietnam became a diplomatically isolated country in the international political scene. However, this is not to say that Vietnam did not achieve any diplomatic success at this time. One notable achievement was the Paris Peace Accords, which served as the agreement to end the military activities in Vietnam at the time and restore peace in the country. During this meeting, Nguyen Thi Binh, leader of the Vietnamese delegation, rose as an extremely well-spoken diplomatic figure, and later, became the only female signatory of the Peace Accords.", "The isolationist era ended with the commencement of “Doi Moi.” After the aid withdrawal, and ultimately, the fall of the Soviet Union, Vietnam’s economy plunged deeply, while diplomacy, which in the past consisted of mostly socialist countries with the now dissolved Soviet Union being the center, suffered heavily. It was at that moment that the Vietnamese Communist Party decided it was time for a change, thus, the country became more open to the diversification of diplomatic ties with other nations. The highlight of this era is that Vietnam strived to make efforts to normalize relations with ex-Cold War rival countries, forming strategic alliances that proved to be beneficial to both sides, while also establishing new relations with countries worldwide.", "Like most countries, diplomatic policies in Vietnam currently serve 02 main purposes: defending the nation’s sovereignty and cooperating with the world. According to the Diplomatic Academy of Vietnam, the 4 words used to describe this goal are independence, self-reliance, diversification, and multilateralization (Diplomatic Academy of Vietnam, 2022). Nowadays, Vietnam continues to follow the teachings of President Ho, thus staying firm in protecting national interests while being flexible in approaches, and this later becomes what is known as “bamboo diplomacy” (or “ngoại giao cây tre”). Moreover, having joined the Non-Aligned Movement officially in 1976, Vietnam established the “4 No’s” in diplomacy, which include: no military alliances; no siding with one country against another; no foreign military bases and no using Vietnamese territory to oppose other countries; and no using force or threatening to use force in international relations (Vietnam National Defence White Paper, 2019), and has continuously been utilizing such principles to navigate the global political scene amidst multiple conflicts and gradually gain respect and standing among other nations.", "As of 2024, Vietnam has been a member of the United Nations for 47 years and has served as the President and non-permanent member of the United Nations Security Council. During its time in these international forums, Vietnam has made multiple contributions to the cause for peace and participated in several Working Groups and missions. The country also established strategic partnerships with other nations and had the honor of welcoming world leaders to its land, most remarkably Russian President Vladimir Putin, General Secretary of the Chinese Communist Party Xi Jinping, and United States President Joe Biden. These are the fruits of Vietnam’s amicable diplomatic policies, which helped the country gradually become a well-supported and praised diplomatic player.", "In the future, Vietnam is to maintain its “Bamboo Diplomacy” and Non-Aligned policy, while continuing to advance further on the world stage, extending the realms of its diplomatic relations further, potentially establishing full partnerships with more nations, and making more valuable suggestions in the international community. Vietnam has the potential to be a leader of its ASEAN bloc, a representative of peace, and an influential player in the diplomatic field worldwide.", "Citations:", "Foreign Relations and Defence Cooperation. Socialist Republic of Vietnam Ministry of National Defence. (n.d.). https://mod.gov.vn/en/intro/detail?1dmy&current=true&urile=wcm%3Apath%3A%2Fmod%2Fsa-mod-en%2Fvnd%2Fsa-en-dod-frdc%2Fsa-en-dv-mf-ctcs%2F30bcc49a-5767-4d25-b19d-730664b3cfe8#:~:text=(Bqp.vn)%20%2D%20As,wishes%20to%20be%20a%20friend", "Hiep, L. H. (2018). 1. introduction: The making of Vietnam’s foreign policy under Doi Moi. Vietnam’s Foreign Policy under Doi Moi, 3–22. https://doi.org/10.1355/9789814818155-006", "History of Vietnam’s Diplomacy. Embassy of the Socialist Republic of Vietnam in the United States. (n.d.). https://vietnamembassy-usa.org/vietnam/foreign-policy/history-of-vietnams-foreign-affairs", "Le, T. D., & Lai, T. A. (2022, May 11). Developments in Vietnam’s foreign policies after the 13th National Party Congress. Học Viện Ngoại Giao Việt Nam. https://dav.edu.vn/en/developments-in-vietnams-foreign-policies-after-the-13th-national-party-congress/", "Nguyen, L. V. (2022, March 17). Ho Chi Minh’s thought on international integration: Sustainable values illuminating the Vietnamese revolutionary cause. Communist Review. https://www.tapchicongsan.org.vn/web/english/international/detail/-/asset publisher/ZeaSwtFJtMgN/content/ho-chi-minh-s-thought-on-international-integration-sustainable-values-illuminating-the-vietnamese-revolutionary-cause#", "Vietnam active participant in Non-Aligned Movement. Vietnam+ (VietnamPlus). (2023, September 20). https://en.vietnamplus.vn/vietnam-active-participant-in-non-aligned-movement-post268251.vnp"]}, {"slug": "history-of-vietnamese-press-predictions", "title": "History of Vietnamese Press & Predictions", "author": "HƯƠNG GIANG", "type": "Op-ed", "source": "HU#U031bO#U031bNG GIANG/History of Vietnamese Press & Predictions.docx", "paragraphs": ["Op-Ed: History of Vietnamese Press & Predictions", "The Vietnamese Press history dates back to 1865, when Gia Dinh Bao became the first Vietnamese newspaper permitted to publish, effectively introducing a new meaning to information communication and the Vietnamese language to the country. Since then, multiple forms of media have developed in Vietnam, playing an important role in the country’s communication and diplomacy during both war and peace times.", "During the colonial and wartime periods, the press was widely used as an information-spreading tool to promote revolutionary ideologies. In 1925, the Youth Newspaper was established, marking the beginning of the revolutionary press in Vietnam. It is worth noting that these newspaper outlets were met with extreme censorship. Le Paria (Người cùng khổ) - a newsletter founded by Ho Chi Minh, who later became the leader of the Vietnamese Communist Revolution - was heavily scrutinized and threatened by the French authorities for its political content (Lao Dong, 2024). However, with persistent efforts, Vietnamese Communist newspapers prospered, and the following decades witnessed the founding of many other Communist publishing firms. Journalists serving in these newspaper firms were also considered revolutionaries, whose weapon was the power of their pen and words.", "By the time the Vietnamese Communist government was established, the press industry had taken a clear shape. This model of the Press was similar to that of the now-dissolved Soviet Union, in which publishing firms operated strictly under the supervision of the government, solely for propaganda and governmental issuing of information purposes. Unlike Western media, which was reader-centric and included advertisements, the Vietnamese press, like that of the Soviet Union, was regulated by the Propaganda and Training Committee and free of the pressure to make a profit (Dang, 2012), thus, most of the information issued was not focused on the needs of the news consumers.", "It was not until the “doi moi” era that this changed. With the renovation and development of the economy, the press became more conscious of the economic size of newspaper publishing. With the permission to include advertisements in these news channels by 1989, royalties for journalists no longer came from just the government, but also from the profits the firm was making from the readers and the private companies who requested advertisements in the newspaper. With this change in policy, the Vietnamese press became a competitive industry, catering more to the reader’s needs. In fact, then, the criticism of governmental officials and other disruptive activities was promoted by the press. The General Secretary of the Vietnamese Communist Party at the time, Mr. Nguyen Van Linh, encouraged journalists to report true and accurate information (Le, 2013). In his 400-word letter named “Things That Must Be Done Immediately” (“Những việc cần làm ngay”) published in the Nhan Dan newspaper, Mr. Linh emphasized the need for Vietnamese citizens to point out and criticize the wrongdoings of the government in the new era (Nhan Dan, n.d.), thus, combating negativity and steer towards a happier future for Vietnam.", "However, this trend in the press was met with a paradox, as the government continued to be the main regulator of the Vietnamese press. Specifically, after the collapse of the Soviet Union in 1991, the Vietnamese government became hyperaware of the possibility of a revolution stemming from a loose regulation of the press, thus, policies regarding criticism of the government in the press were tightened.", "Despite that, the press continues to advance alongside the economy. In the Vietnamese Press Law, it is stated that journalists have the right to collect and report information, and any actions prohibiting such tasks are illegal. The press also became bolder with their reports in recent years, as many scandals of high-ranking officials make the front page of newsletters. Despite this development, the Vietnamese press continues to be state-owned, with regulations covering the information allowed to be released, which has to align with the Socialist Republic of Vietnam’s ideologies and diplomatic positions. The Vietnamese press will likely remain state-owned in the future, however, the current reports suggest that this industry will be much less financially dependent on the government in the following decades, as several cuts in the press’ budget are to be announced by the government. This means that journalism will become more reader-oriented and rely on advertisements more to fund its publishing process. Competition in the press industry, in addition, will also rise as firms compete for their audience’s attention and choice.", "In the modern world, the role of journalism is changing rapidly. What started solely as a means for the Vietnamese government to introduce information and propaganda to the general public has evolved into something more suitable for the current economic-political climate. Its purpose is now to cater for both the Communist Party and the readers, providing information on a multifaceted level, allowing its audience to catch up with the socio-political development of the world, as well as their enjoyment and entertainment. Therefore, it would be wrong to assume that the Vietnamese press nowadays is a heavily censored industry, as viewed by many Western press industries, but rather a balanced mix of servitude towards the Communist Party’s political agenda and the audience’s demand. Moreover, it is imminent that this industry will continue to be tweaked and modified in the upcoming decades, steering toward a more reader-centric approach, whilst continuing to combat and prevent the spread of false or politically sensitive information.", "In conclusion, journalism in Vietnam is not only the voice of the government, but also that of the citizens, a mixture that works well amidst the globalization era for a developing and ever-changing country like Vietnam. Throughout the past, the industry has gone through various stages of development, from acting as a political weapon in wartimes (e.g. Voice of Vietnam radio or Youth newspaper) to being a medium for the spreading of information and the voice of citizens. This is a commendable journey, and alongside the development of the economic and political playground, as well as to accommodate new press policies, the press of Vietnam will continue to develop to fulfill its role and ability as a companion to the government and the citizens.", "Citations:", "Ho, L. Q. (2020, June 20). Vietnamese Revolutionary Press’ 95-year development process together with the country. National Defense Journal. http://tapchiqptd.vn/en/events-and-comments/vietnamese-revolutionary-press-95year-development-process-together-with-the-country/15639.html", "Mạnh, N. H. (2024, May 18). Chủ tịch HỒ Chí Minh - Người sáng lập những tờ báo cách mạng đầu tiên. BÁO LAO ĐỘNG. https://laodong.vn/lao-dong-cuoi-tuan/chu-tich-ho-chi-minh-nguoi-sang-lap-nhung-to-bao-cach-mang-dau-tien-1341058.ldo#:~:text=T%E1%BB%9D%20b%C3%A1o%20c%C3%A1ch%20m%E1%BA%A1ng%20%C4%91%E1%BA%A7u%20ti%C3%AAn%20do%20B%C3%A1c%20s%C3%A1ng%20l%E1%BA%ADp,xu%E1%BA%A5t%20b%E1%BA%A3n%20ng%C3%A0y%201.4.1922.", "Nguyen, T. N. H., Нгуен Тхи Нгок, Bui, C. T., & Буй Ти. (2019). The state management of media activities in Vietnam. The Russian Journal of Vietnamese Studies. https://vietnamjournal.ru/2618-9453/article/view/86995", "Peycam, P. M. F. (2012). The Birth of Vietnamese Political Journalism: Saigon, 1916-1930. Columbia University Press. https://doi.org/10.7312/peyc15850"]}, {"slug": "the-china-united-states-trade-war-and-its-impacts-on-vietnam", "title": "The China - United States Trade War and its Impacts on Vietnam and the World", "author": "HƯƠNG GIANG", "type": "Journal", "source": "HU#U031bO#U031bNG GIANG/The China - United States Trade War and its Impacts on Vietnam and the World.docx", "paragraphs": ["The China - United States Trade War and its Impacts on Vietnam and the World", "In 2018, an economic concern loomed in the White House of the United States of America - the country was at its largest trade deficit to ever be recorded. With Donald Trump holding the position of the country’s President, he had redirected his focus onto such a deficit. The reason for this was somewhat clear to Trump: a few years before that, the U.S. and China had engaged in high levels of bilateral trade, and by 2018, U.S. imports from China far exceeded its exports. Trump, single-mindedly aiming toward American economic success, accused China of participating in unethical and one-sided trade practices and said that America had been “taken total advantage of” (White House Archive, 2018). Following a series of threats, on March 22nd and July 18th, 2018, Trump signed a memorandum to impose tariffs on Chinese products. Specifically, $50 billion worth of Chinese products were placed under a 25% American tariff in the first round and an additional $34 billion of such products in the second (York, 2024).", "In retaliation, China implemented its own tariffs on American goods, which indeed took a toll on the American trade industry as the U.S. and China were close economic partners. At that time, China was an economically ambitious nation. With Xi Jinping taking the position of the General Secretary of the Communist Party, China no longer wanted to hide itself and its potential. Instead, the country was eyeing the leading spot in the world economy stage, and it was indeed succeeding in its quest with multiple governmental plans aiming to strengthen the country’s already vastly growing economy as well as to globalize its economic influence.", "This was the start of a series of tit-for-tat rounds of tariffs and retaliations from both the U.S. and China, neither wanting to back down; thus, resulting in a swiftly escalating trade tension between the 2 countries, straining their strategic partnership. The economic result was in no way positive either, as, on the one hand, the U.S. trade deficit even increased after the commencement of the trade war. On the other hand, China also lost a supplier of various agricultural products. In 2020, U.S. President Trump and General Secretary Jinping signed the Phase One Deal, committing to the mending and renewal of the two country’s trade relations. However, the deal failed to alleviate all the effects of the trade war on the two countries’ relations, supplies, and job force. Even then, the conflict continued to advance during the Biden administration, with tariffs placed on Chinese technological products, slowing down China’s technology sector. “Decoupling” was also a main concern in this era, as the U.S. and its allies sought to divest from Chinese sources to other partners such as ASEAN nations.", "Due to such goals, the U.S.-China trade war has had profound effects on the global economy. The United States, once the leading force of economic globalization and the firm supporter of international trade organizations such as WTO is now the one country to create more trade barriers and divide amongst nations. China’s position as an economic powerhouse after the 2008 financial crisis is also threatened, and the global economy is facing the risk of an economic recession due to this war.", "Moreover, global security and the current political standing are also likely to be changed in accordance with this war. Trump not only imposed economic limitations on China but also on other nations such as Japan, Mexico, and the EU bloc, many of which are U.S. allies. This means that America’s relationship with these countries is drastically dwindling, allowing opponents such as Russia, and, naturally, China to gain more support and trade partners from these allies. Such shifts in economic alliances are an indicator of impending changes in the political atmosphere as well as potential clashes in strategies, resulting in an even more competitive race among a wide variety of nations. In addition, such polarization could even result in activities beyond sanctions and tariffs.", "In response to such a situation, Vietnam opts for the neutral approach, as does its bloc, ASEAN. It is important to note that both sides of the trade war are worried about an enhanced influence of its opponent in this region, however, ASEAN has acted in a way that is most economically beneficial to them: not taking any preference, while accepting investment interest from foreign economies. This means opportunities are opening up for ASEAN’s economic development, especially for Vietnam, since the foreign direct investment (FDI) funds are being shifted from China to the country, promoting growth in fundamental sectors such as Technology and Automobile. Moreover, the reduction in trade between the U.S., China, and their allies created potential opportunities for Vietnam to become a more prominent market for global imports and exports, playing a stronger role as a trade partner to China, the United States, and other countries as well.", "However, the trade war has obvious negative impacts on ASEAN and Vietnam in particular, both economically and diplomatically. For starters, the escalation of the conflict and the involvement of more and more countries due to decoupling means that it is getting increasingly more difficult to remain in a neutral position while maintaining good trade relations with the two sides. This dilemma is manifested in the form of economic projects, as ASEAN countries find it hard to participate in Chinese or American-led economic development plans, as the risk of upsetting either side is huge on the economy of the bloc as a whole. The situation is even more tender with Vietnam, as China is Vietnam’s long-standing partner, not just economically but in other aspects as well, whereas the United States and Vietnam have made great strides in mending their diplomatic relationship post-Cold War. To maintain such positive relationships and cooperative partnerships, Vietnam must be extremely cautious and smart about its move to prevent one-sided involvement that can alter the dynamic of the political situation. Moreover, the trade war also means that the economy of the two most important trade partners of Vietnam - the U.S. and China - will be shrinking, thus, reducing demands for Vietnam’s exports as a whole, as well as the amount of money invested in Vietnam. An even bigger concern can be raised over the fact that Vietnam is at risk of U.S. tariff at practically any time now, and it is being even more thoroughly scrutinized since being decided by America as one of the most important trade partners, replacing China’s previous position. If such an event occurs, it will surely damage the Vietnamese market even further.", "In the future, the U.S.-China trade war will possibly escalate even further, or at least expand into new areas, leaving Vietnam in a more risky and vulnerable state. Though there are certain benefits and opportunities for the Vietnamese economy yielded by such an event, it is important that Vietnam thoroughly devises its reaction plans to any possible advancement of the conflict and acts swiftly and appropriately to prevent further financial damages.", "Citations:", "Diabora, I. (n.d.). Vietnam’s strategy in taking advantage of Trade War between US-China in 2018-2019. UMY Repository. http://repository.umy.ac.id/bitstream/handle/123456789/35565/K.%20JURNAL.pdf?sequence=11&isAllowed=y", "Kristoff, A., & Wu, A. (2024, June 5). The US-china trade war heats up. Project Syndicate. https://www.project-syndicate.org/onpoint/the-us-china-trade-war-heats-up", "Vietnam Central Institute for Economic Management. (2021, May 3). The US-china trade war and FDI attraction in Vietnam. IPCS. https://ipcs.mpi.gov.vn/en/the-us-china-trade-war-fdi-attrection-vietnam/", "Wong, D., & Koty, A. C. (2023, December 20). The US-china trade war: A timeline. China Briefing News. https://www.china-briefing.com/news/the-us-china-trade-war-a-timeline/", "York, E. (2024, July 16). Tariff tracker: Tracking the economic impact of tariffs. Tax Foundation. https://taxfoundation.org/research/all/federal/trump-tariffs-biden-tariffs/#:~:text=Section%20301%2C%20Chinese%20Products&text=The%20first%20tariffs%20began%20July,a%20%2412.5%20billion%20tax%20increase."]}, {"slug": "the-development-of-vietnam-and-the-eu-s-relations", "title": "The Development of Vietnam and the EU's Relations", "author": "HƯƠNG GIANG", "type": "Journal", "source": "HU#U031bO#U031bNG GIANG/The Development of Vietnam and the EU_s Relations.docx", "paragraphs": ["The Development of Vietnam and the EU's Relations", "Vietnam has been an extremely amicable player in the diplomatic stage ever since its Congress passed the “Doi Moi” bill allowing for integration in 1986, and its established diplomatic as well as economic ties with the EU is an important milestone in Vietnam’s new quest for international cooperation, as it is one of the events that signify the end of the post-Cold War isolation and polarisation era for the Southeast Asian country.", "In 1990, Vietnam and the EU shook hands for the first time and established diplomatic ties, ending years of Western sanctions and hostile relations. However, cooperation during this beginning era proved to be limited, as the focus was mainly placed on the return of displaced Vietnamese people and pushing post-war reparations rather than other advancement causes (Tran, n.d.). The relationship took a big leap in 1995 after the signing of the Framework Cooperation Agreement (FCA) between the two parties. In this document, Vietnam’s efforts in international integration were recognized, and the treaty facilitated the establishment of trade and cooperation in several fields such as technology and communication with the foundation being respect for human rights principles and support for Vietnam’s transition into the “Doi Moi” era. With this agreement in force, Vietnam and the EU established a bond that would only be strengthened with time. Then, under the treaty, the EU made strives to help Vietnam emerge in the global economy through multiple programs, namely the 1994-1999 technology and economic-centric program EuroTAPViet and the 1998-2017 market-centric one called MUTRAP (Vu, n.d.).", "Towards the end of the 1990s to the 2000s, the Vietnam-EU relationship grew in prominence through the year. In these years, the EU continued to aid Vietnam in efforts to mitigate poverty and further improve its market strategies and mechanisms, promoting sustainable financial practices. This assistance has been fundamental in maintaining Vietnam’s position on the global stage, allowing Vietnam to align with international economic goals. Moreover, recognizing the growing importance of the relationship as well as the ever-changing trend of the world, Vietnam and the EU started working on a new relationship framework - a document that would be more inclusive and offer a wider range of area coverage suitable for the time period.", "The 2010s marked the most important milestones in the development of the Vietnam-EU relationship with the signing of two fundamental agreements: the Partnership and Cooperation Agreement (PCA), for which the negotiation process had begun in the last decade, and the EU-Vietnam Free Trade Agreement (EVFTA). While the previous agreement (the FCA) only covered basic points relating to trade and human rights, the new deal (the PCA, signed in 2012 and came into force in 2016) expanded the scope of cooperation to virtually every era, including environment, science, tourism, culture, and crime resistance. Under this new cooperation treaty, Vietnam and the EU are able to engage in more intensive discussions, and thus, several recurrent meetings such as the annual EU-Vietnam enhanced Human Rights Dialogue and the EU-Vietnam Political Consultations were founded. Moreover, Vietnam and the EU also established grounds for defense cooperation through the Framework Participation Agreement (FDA) in late 2019, in which the two parties agreed on bilateral aid in defense operations, leading to the involvement of Vietnamese personnel in EU peacekeeping missions (Press and information team of the EEAS, 2023).", "In addition, economic ties have always been one of the main points of Vietnam-EU’s cooperation, and there is no doubt that improvements were made in that regard as well. The signing of the EVFTA (signed in 2019, effective since 2020) is responsible for such advancement, as, under this economic agreement, Vietnam became the EU’s leading ASEAN trade partner. In fact, before the EVFTA, trade increase between Vietnam and the EU was below the line of Vietnam’s overall growth. With the effects of the EVFTA, which aims to gradually remove tariffs on almost all Vietnamese products (99.7% of Vietnam’s exports after 7 years to be specific), trades are predicted to rise exponentially between the two parties, allowing Vietnam to compensate for its trade deficit with other nations while pushing the development of Vietnam’s key global value chains (Pham, 2020). Moreover, the EU and Vietnam continue to strengthen such an economic relationship with the enforcement of the EVFTA, resulting in more collaborative programs as well as a better risk management technique that proved to be necessary during the COVID-19 era. As a result, Vietnam’s exports had indeed risen in value just a year after the signing of the agreement; however, there is still room for a more proper implementation of the deal. For example, Vietnam should catch more interest for investment from other EU countries outside of the few central ones that are currently investing or there should be more programs to aid Vietnam’s economic transit
